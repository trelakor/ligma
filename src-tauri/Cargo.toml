[package]
name = "ligma"
version = "0.1.0"
description = "Lightweight desktop wrapper for Figma"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
discord-rich-presence = "1.1"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
# The dialog plugin's own rfd, for the synchronous dialogs downloads need
# in src/downloads.rs.
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }
# The updater's zip, to unpack multi-image exports in src/downloads.rs.
zip = { version = "4", default-features = false, features = ["deflate"] }

# Same versions Tauri's WebView2 backend uses, for the memory APIs in
# src/webview2.rs.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

# libc for the memory pressure level in src/pressure.rs; objc2 and block2,
# the same versions wry uses, for the AppKit and WebKit calls in
# src/titlebar.rs and src/wkwebview.rs.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"

# Small, fast release binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
