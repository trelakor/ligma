[package]
name = "ligma"
version = "0.1.0"
description = "Lightweight desktop wrapper for Figma"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
discord-rich-presence = "1.1"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"
# On Windows a figma:// link starts a second Ligma, which hands it to the
# running one (src/figma_scheme.rs)
tauri-plugin-single-instance = "2"
# Native save and folder pickers, synchronous as downloads need in
# src/downloads.rs. Prompts are Ligma's own (src/prompt.rs)
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }
# The updater's zip, to unpack multi-image exports in src/downloads.rs
zip = { version = "4", default-features = false, features = ["deflate"] }
# ligma.log, for problem reports in src/report.rs
tauri-plugin-log = "2"
log = "0.4"
# Vectorize in src/vectorize.rs: reading the image and tracing it
image = { version = "0.25", default-features = false, features = ["png"] }
visioncortex = "0.9"

# Same versions Tauri's WebView2 backend uses, for the memory APIs and tab
# shortcuts in src/webview2.rs
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# GetKeyState for the tab shortcuts and the stream tab previews are
# captured into, in src/webview2.rs
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com_StructuredStorage"] }
# Tab preview images as `data:` URLs (src/webview2.rs)
base64 = "0.22"
# figma:// registration in src/figma_scheme.rs
windows-registry = "0.6"
# Remove background in src/background.rs: ONNX Runtime, linked in, to run
# the model on the CPU, the model's download and check, and reading and
# writing the images
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "api-22"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# Remove background with BiRefNet on Macs with Apple silicon, as on
# Windows, but with ONNX Runtime downloaded along with the model, as it
# needs macOS 14. The download is a .tgz, hence flate2 and tar
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-22"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.22"
flate2 = "1"
tar = "0.4"

# libc for the memory pressure level in src/pressure.rs; objc2 and block2,
# the same versions wry uses, for the AppKit and WebKit calls in
# src/titlebar.rs and src/wkwebview.rs
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"

# Small, fast release binary. Thin LTO and the default codegen units keep
# release builds (and CI) quick for a slightly larger binary than full LTO
[profile.release]
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
