[package]
name = "ligma"
version = "0.1.0"
description = "Lightweight desktop wrapper for Figma"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
discord-rich-presence = "1.1"

# Same versions Tauri's WebView2 backend uses, for the memory APIs in
# src/webview2.rs.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

# Small, fast release binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
