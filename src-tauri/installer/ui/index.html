<!doctype html>
<!-- The Windows installer's window, served by main.rs. A Figma canvas, as in the
     DMG art (assets/installer/installer.html): the progress is a selected frame
     being dragged wider by your cursor, its size pill reading the percentage -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Installing Ligma</title>
<style>
  @font-face { font-family: "Inter"; src: url(/inter.woff2) format("woff2"); font-weight: 400 700; }

  :root {
    --canvas: #f5f5f5; --dot: #d6d6d6; --text: #1e1e1e; --muted: #757575;
    --select: #0c8ce9; --label: #0a73c4; --fill: rgb(12 140 233 / 0.08); --ghost: #c4c4c4;
    --you: #9747ff; --handle: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #1e1e1e; --dot: #383838; --text: #f5f5f5; --muted: #a0a0a0;
      --label: #4db5ff; --fill: rgb(12 140 233 / 0.14); --ghost: #4a4a4a;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; user-select: none; cursor: default; }
  body {
    font-family: "Inter", "Segoe UI Variable Text", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; color: var(--text);
    background: radial-gradient(circle, var(--dot) 0.9px, transparent 1.3px) 0 0 / 20px 20px, var(--canvas);
    display: grid; place-items: center;
  }
  main { width: 280px; display: grid; justify-items: center; }

  /* logo.png's mark spans x 220-604 and y 122-700 of 824; this crops it to 48px tall */
  .mark { width: 32px; height: 48px; background: url(/logo.png) -18.27px -10.13px / 68.43px no-repeat; }
  h1 { margin-top: 10px; font-size: 15px; font-weight: 600; letter-spacing: -0.005em; }

  /* The full width, drawn as Figma draws a hovered layer's bounds */
  .track { position: relative; margin-top: 44px; width: 100%; height: 28px; outline: 1px dashed var(--ghost); outline-offset: -1px; }
  .name { position: absolute; left: -1px; bottom: calc(100% + 6px); white-space: nowrap; font-size: 11px; font-weight: 500; color: var(--label); }

  /* Selected, as Figma draws it: outline, square handles */
  .frame { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; min-width: 1px; background: var(--fill); outline: 1px solid var(--select); outline-offset: -1px; transition: width 0.35s cubic-bezier(0.2, 0, 0, 1); }
  .frame i { position: absolute; width: 7px; height: 7px; background: var(--handle); border: 1px solid var(--select); }
  .frame i:nth-of-type(1) { left: -3px; top: -3px; } .frame i:nth-of-type(2) { right: -3px; top: -3px; }
  .frame i:nth-of-type(3) { left: -3px; bottom: -3px; } .frame i:nth-of-type(4) { right: -3px; bottom: -3px; }

  /* The size pill under a selection, here the percentage. A shade darker than
     Figma's so white reads on it at this size */
  .size { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); padding: 2px 6px; border-radius: 3px; background: #0a73c4; color: #fff; font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.3; white-space: nowrap; }

  /* Your cursor, on the right edge, dragging it wider */
  .you { position: absolute; right: -14px; top: 12px; display: flex; align-items: flex-start; transition: opacity 0.25s; }
  .you svg { width: 16px; height: 16px; color: var(--you); filter: drop-shadow(0 1px 1.5px rgb(0 0 0 / 0.3)); }
  .you span { margin: 13px 0 0 -2px; padding: 1px 6px 2px; border-radius: 4px; background: var(--you); color: #fff; font-size: 11px; font-weight: 600; line-height: 1.3; }

  .status { margin-top: 50px; font-size: 12px; color: var(--muted); }

  :root.done .you { opacity: 0; }

  @media (prefers-reduced-motion: reduce) { .frame { transition: none; } }
</style>
</head>
<body>
  <main>
    <div class="mark" role="img" aria-label="Ligma"></div>
    <h1>Ligma</h1>
    <div class="track">
      <span class="name" id="name">Installing</span>
      <div class="frame" id="frame">
        <i></i><i></i><i></i><i></i>
        <span class="size" id="size">0%</span>
        <div class="you"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 2.2c-.7-.3-1.4.4-1.1 1.1l4.3 10.3c.3.7 1.3.7 1.6-.1l1.3-3.7c.1-.3.3-.5.6-.6l3.7-1.3c.8-.3.8-1.3.1-1.6z" fill="currentColor" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg><span>You</span></div>
      </div>
    </div>
    <p class="status" id="status" aria-live="polite">Ligma opens when it's done</p>
  </main>
<script>
  const version = new URLSearchParams(location.search).get("v");
  if (version) document.getElementById("name").textContent = `Installing ${version}`;

  const frame = document.getElementById("frame");
  const size = document.getElementById("size");
  let shown = 0;
  // Called by main.rs with the installer's progress, 0 to 1. Never goes backwards
  function progress(p) {
    if (p <= shown) return;
    shown = p;
    frame.style.width = `${(p * 100).toFixed(1)}%`;
    size.textContent = `${Math.round(p * 100)}%`;
  }
  function done() {
    progress(1);
    document.documentElement.classList.add("done");
    document.getElementById("name").textContent = "Installed";
    document.getElementById("status").textContent = "Opening Ligma";
    setTimeout(() => window.ipc.postMessage("close"), 900);
  }

  document.addEventListener("mousedown", (e) => { if (e.button === 0) window.ipc.postMessage("drag"); });
  document.addEventListener("contextmenu", (e) => e.preventDefault());

  // Shown once the font and logo are in, so it never flashes half drawn
  const logo = new Image();
  logo.src = "/logo.png";
  Promise.all([document.fonts.load("600 15px Inter"), logo.decode().catch(() => {})])
    .catch(() => {})
    .then(() => requestAnimationFrame(() => window.ipc.postMessage("ready")));
</script>
</body>
</html>
