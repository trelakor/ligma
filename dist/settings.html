<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Settings</title>
<!-- Settings window (Ligma > Settings…). Edits settings.json through
     `get_settings` / `set_settings` in src-tauri/src/settings.rs; each
     change is saved and applied right away. -->
<style>
  :root {
    color-scheme: light dark;
    --bg: #ececec;
    --group: #fff;
    --divider: rgba(0, 0, 0, 0.1);
    --text: rgba(0, 0, 0, 0.85);
    --secondary: rgba(0, 0, 0, 0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e;
      --group: #2a2a2a;
      --divider: rgba(255, 255, 255, 0.1);
      --text: rgba(255, 255, 255, 0.85);
      --secondary: rgba(255, 255, 255, 0.5);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); }
  body {
    padding: 20px;
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", sans-serif;
    color: var(--text);
    cursor: default;
    -webkit-user-select: none;
    user-select: none;
  }
  h2 { margin: 0 0 6px 10px; font-size: 13px; font-weight: 600; }
  h2:not(:first-child) { margin-top: 18px; }
  .group { background: var(--group); border-radius: 8px; border: 1px solid var(--divider); }
  .row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 8px 12px; }
  .row + .row { border-top: 1px solid var(--divider); }
  .row[hidden] { display: none; }
  .label { flex: 1; }
  .hint { color: var(--secondary); font-size: 11px; }
  .disabled { opacity: 0.4; }
  input[type="number"] { width: 64px; font: inherit; text-align: right; }
  input[type="checkbox"] { width: 14px; height: 14px; }
</style>
</head>
<body>
<h2>Tabs</h2>
<div class="group">
  <label class="row">
    <span class="label">Reopen tabs from last time
      <div class="hint">Brings back your tabs and the one you had open. Each loads when you select it.</div>
    </span>
    <input type="checkbox" id="restore">
  </label>
</div>
<h2>Memory</h2>
<div class="group">
  <label class="row">
    <span class="label">Put hidden tabs to sleep
      <div class="hint">Closes a tab you aren't looking at to free its memory. It reloads when selected.</div>
    </span>
    <input type="checkbox" id="sleep">
  </label>
  <label class="row" id="sleep-after-row">
    <span class="label">After minutes hidden</span>
    <input type="number" id="sleep-after" min="1" step="1">
  </label>
  <label class="row" id="limit-row">
    <span class="label">Limit hidden tabs kept loaded
      <div class="hint">Past the limit, the oldest hidden tab sleeps right away. Home goes first.</div>
    </span>
    <input type="checkbox" id="limit">
  </label>
  <label class="row" id="max-hidden-row">
    <span class="label">Hidden tabs kept loaded</span>
    <input type="number" id="max-hidden" min="0" step="1">
  </label>
  <label class="row" id="snapshots-row">
    <span class="label">Show last image while a tab reloads
      <div class="hint">In place of Figma's loading screen, after a file tab wakes from sleep.</div>
    </span>
    <input type="checkbox" id="snapshots">
  </label>
</div>
<h2>Integrations</h2>
<div class="group">
  <label class="row">
    <span class="label">Discord Rich Presence
      <div class="hint">Shows the open file and selected tool on Discord.</div>
    </span>
    <input type="checkbox" id="discord">
  </label>
  <label class="row" id="discord-file-row">
    <span class="label">Show file name
      <div class="hint">When off, Discord says "Editing a file".</div>
    </span>
    <input type="checkbox" id="discord-file">
  </label>
  <label class="row" id="discord-tool-row">
    <span class="label">Show selected tool
      <div class="hint">The tool's name and icon.</div>
    </span>
    <input type="checkbox" id="discord-tool">
  </label>
</div>
<script>
  const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);
  const $ = (id) => document.getElementById(id);
  const fields = ["restore", "sleep", "sleep-after", "limit", "max-hidden", "snapshots", "discord", "discord-file", "discord-tool"];
  // Snapshots only exist on macOS.
  $("snapshots-row").hidden = !navigator.userAgent.includes("Mac");

  let settings;
  // Number fields keep their last value while switched off, so switching
  // back on restores it.
  let sleepAfter = 30;
  let maxHidden = 3;

  function show() {
    const sleeping = settings.sleepTabsAfterMinutes > 0;
    const limited = settings.maxHiddenTabsLoaded != null;
    if (sleeping) sleepAfter = settings.sleepTabsAfterMinutes;
    if (limited) maxHidden = settings.maxHiddenTabsLoaded;
    $("sleep").checked = sleeping;
    $("sleep-after").value = sleepAfter;
    $("limit").checked = limited;
    $("max-hidden").value = maxHidden;
    $("snapshots").checked = settings.reloadSnapshots;
    $("discord").checked = settings.discordRichPresence;
    $("discord-file").checked = settings.discordShowFile;
    $("discord-tool").checked = settings.discordShowTool;
    $("restore").checked = settings.restoreTabs;
    // Without sleep nothing is unloaded, so the other memory options do nothing.
    for (const [id, enabled] of [
      ["sleep-after-row", sleeping],
      ["limit-row", sleeping],
      ["max-hidden-row", sleeping && limited],
      ["snapshots-row", sleeping],
      ["discord-file-row", settings.discordRichPresence],
      ["discord-tool-row", settings.discordRichPresence],
    ]) {
      $(id).classList.toggle("disabled", !enabled);
      $(id).querySelector("input").disabled = !enabled;
    }
  }

  function whole(input, min, fallback) {
    const value = Math.floor(Number(input.value));
    return Number.isFinite(value) && value >= min ? value : fallback;
  }

  async function save() {
    sleepAfter = whole($("sleep-after"), 1, sleepAfter);
    maxHidden = whole($("max-hidden"), 0, maxHidden);
    settings = {
      ...settings,
      sleepTabsAfterMinutes: $("sleep").checked ? sleepAfter : 0,
      maxHiddenTabsLoaded: $("limit").checked ? maxHidden : null,
      reloadSnapshots: $("snapshots").checked,
      discordRichPresence: $("discord").checked,
      discordShowFile: $("discord-file").checked,
      discordShowTool: $("discord-tool").checked,
      restoreTabs: $("restore").checked,
    };
    show();
    await invoke("set_settings", { settings });
  }

  for (const id of fields) $(id).addEventListener("change", save);

  invoke("get_settings").then((loaded) => {
    settings = loaded;
    show();
  });
</script>
</body>
</html>
