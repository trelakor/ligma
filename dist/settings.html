<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Settings</title>
<!-- Settings window (Ligma > Settings…). Edits settings.json through
     `get_settings` / `set_settings` in src-tauri/src/settings.rs; each
     change is saved and applied right away. About checks for updates and
     reports a problem (src-tauri/src/report.rs). The window has no native
     title bar: the header is its own, and its colors follow the active
     Figma tab's theme (`applyTheme`, from `get_theme` and tabs.rs). -->
<style>
  /* Figma's UI3 palette, until the first Figma tab reports its own. */
  :root {
    color-scheme: dark;
    --bg: #2c2c2c;
    --bg-secondary: #383838;
    --bg-tertiary: #444444;
    --border: #444444;
    --text: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.7);
    --text-tertiary: rgba(255, 255, 255, 0.4);
    --brand: #0d99ff;
    --switch-off: rgba(255, 255, 255, 0.2);
    --hover: rgba(255, 255, 255, 0.06);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --bg-secondary: #f5f5f5;
      --bg-tertiary: #e6e6e6;
      --border: #e6e6e6;
      --text: rgba(0, 0, 0, 0.9);
      --text-secondary: rgba(0, 0, 0, 0.5);
      --text-tertiary: rgba(0, 0, 0, 0.3);
      --switch-off: rgba(0, 0, 0, 0.18);
      --hover: rgba(0, 0, 0, 0.04);
    }
  }
  /* Set by `applyTheme` from the theme's background. */
  :root.dark { color-scheme: dark; --switch-off: rgba(255, 255, 255, 0.2); --hover: rgba(255, 255, 255, 0.06); }
  :root.light { color-scheme: light; --switch-off: rgba(0, 0, 0, 0.18); --hover: rgba(0, 0, 0, 0.04); }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    display: flex;
    flex-direction: column;
    font: 450 11px/16px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", sans-serif;
    font-feature-settings: "cv11", "calt";
    letter-spacing: 0.005em;
    color: var(--text);
    cursor: default;
    -webkit-user-select: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: color-mix(in srgb, var(--brand) 35%, transparent); }

  /* The window's title bar. Drags the window; on macOS the traffic
     lights sit at its left, centered like the tab bar's. */
  header {
    position: relative;
    display: flex;
    flex: none;
    align-items: center;
    height: 38px;
    padding-left: 16px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 11px; font-weight: 550; line-height: 16px; pointer-events: none; }
  .macos header { justify-content: center; padding-left: 0; }
  #close {
    display: grid;
    place-items: center;
    width: 46px;
    height: 100%;
    margin-left: auto;
    border: 0;
    background: none;
    color: var(--text-secondary);
  }
  #close:hover { background: #c42b1c; color: #fff; }
  .macos #close { display: none; }

  main { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--bg-tertiary) transparent; }

  section { padding: 8px 0 12px; }
  section + section { border-top: 1px solid var(--border); }
  h2 {
    padding: 8px 16px 4px;
    font-size: 11px;
    font-weight: 550;
    line-height: 16px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 32px;
    padding: 6px 16px;
  }
  .row[hidden] { display: none; }
  label.row:has(input:not(:disabled)):hover { background: var(--hover); }
  .label { flex: 1; min-width: 0; }
  .hint { margin-top: 1px; color: var(--text-secondary); text-wrap: pretty; }
  /* Options that depend on the row above. */
  .nested { padding-left: 32px; }
  .row.disabled .label { color: var(--text-tertiary); }
  .row.disabled .hint { color: var(--text-tertiary); }

  /* Figma's switch. */
  .switch {
    position: relative;
    flex: none;
    width: 28px;
    height: 16px;
    margin: 0;
    border-radius: 8px;
    background: var(--switch-off);
    -webkit-appearance: none;
    appearance: none;
    transition: background-color 120ms ease-out;
  }
  .switch::before {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    transition: transform 160ms cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  .switch:checked { background: var(--brand); }
  .switch:checked::before { transform: translateX(12px); }
  .switch:disabled { opacity: 0.4; }

  /* Figma's number field, with its unit inside. */
  .field {
    display: flex;
    flex: none;
    align-items: center;
    width: 72px;
    height: 24px;
    padding: 0 8px 0 0;
    border: 1px solid transparent;
    border-radius: 5px;
    background: var(--bg-secondary);
    color: var(--text-secondary);
  }
  .field:hover { border-color: var(--border); }
  .field:focus-within { border-color: var(--brand); }
  .field input {
    width: 100%;
    min-width: 0;
    height: 100%;
    padding: 0 4px 0 8px;
    border: 0;
    outline: 0;
    background: none;
    color: var(--text);
    font: inherit;
    font-variant-numeric: tabular-nums;
    caret-color: var(--brand);
    -moz-appearance: textfield;
  }
  .field input::-webkit-inner-spin-button, .field input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .row.disabled .field { opacity: 0.4; border-color: transparent; }

  /* Figma's secondary button. */
  .button {
    flex: none;
    height: 24px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: none;
    color: var(--text);
    font: inherit;
    font-weight: 450;
  }
  .button:hover { background: var(--hover); }
  .button:active { background: var(--bg-secondary); }

  .switch:focus-visible, #close:focus-visible, .button:focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 1px;
  }

  @media (prefers-reduced-motion: reduce) {
    .switch, .switch::before { transition: none; }
  }
</style>
</head>
<body>
<header data-tauri-drag-region>
  <h1>Settings</h1>
  <button id="close" title="Close" aria-label="Close">
    <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m3.5 3.5 9 9M12.5 3.5l-9 9"/></svg>
  </button>
</header>
<main>
  <section>
    <h2>Tabs</h2>
    <label class="row">
      <span class="label">Reopen tabs from last time
        <div class="hint">Brings back your tabs and the one you had open. Each loads when you select it.</div>
      </span>
      <input type="checkbox" class="switch" id="restore">
    </label>
  </section>
  <section>
    <h2>Memory</h2>
    <label class="row">
      <span class="label">Put hidden tabs to sleep
        <div class="hint">Closes a tab you aren't looking at to free its memory. It reloads when selected.</div>
      </span>
      <input type="checkbox" class="switch" id="sleep">
    </label>
    <label class="row nested" id="sleep-after-row">
      <span class="label">After being hidden for</span>
      <span class="field"><input type="number" id="sleep-after" min="1" step="1">min</span>
    </label>
    <label class="row nested" id="limit-row">
      <span class="label">Limit hidden tabs kept loaded
        <div class="hint">Past the limit, the oldest hidden tab sleeps right away. Home goes first.</div>
      </span>
      <input type="checkbox" class="switch" id="limit">
    </label>
    <label class="row nested" id="max-hidden-row">
      <span class="label">Hidden tabs kept loaded</span>
      <span class="field"><input type="number" id="max-hidden" min="0" step="1">tabs</span>
    </label>
    <label class="row nested" id="snapshots-row">
      <span class="label">Show last image while a tab reloads
        <div class="hint">In place of Figma's loading screen, after a file tab wakes from sleep.</div>
      </span>
      <input type="checkbox" class="switch" id="snapshots">
    </label>
  </section>
  <section>
    <h2>Discord</h2>
    <label class="row">
      <span class="label">Rich Presence
        <div class="hint">Shows the open file and selected tool on your Discord profile.</div>
      </span>
      <input type="checkbox" class="switch" id="discord">
    </label>
    <label class="row nested" id="discord-file-row">
      <span class="label">Show file name
        <div class="hint">When off, Discord doesn't name the file.</div>
      </span>
      <input type="checkbox" class="switch" id="discord-file">
    </label>
    <label class="row nested" id="discord-tool-row">
      <span class="label">Show selected tool
        <div class="hint">The tool's name and icon.</div>
      </span>
      <input type="checkbox" class="switch" id="discord-tool">
    </label>
    <label class="row nested" id="discord-invites-row">
      <span class="label">Invites to files
        <div class="hint">Lets Discord friends join the open file in their Ligma, if they have access in Figma. Shows how many are in it.</div>
      </span>
      <input type="checkbox" class="switch" id="discord-invites">
    </label>
  </section>
  <section>
    <h2>About</h2>
    <div class="row">
      <span class="label"><span id="version">Ligma</span>
        <div class="hint">Ligma checks for updates on launch and every 6 hours.</div>
      </span>
      <button class="button" id="check-updates">Check for Updates</button>
    </div>
    <div class="row">
      <span class="label">Report a problem
        <div class="hint">Opens a GitHub issue with Ligma's version, your system and its recent log, for you to read and edit before sending. Nothing is sent otherwise.</div>
      </span>
      <button class="button" id="report">Report…</button>
    </div>
  </section>
</main>
<script>
  const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);
  const $ = (id) => document.getElementById(id);
  const fields = ["restore", "sleep", "sleep-after", "limit", "max-hidden", "snapshots", "discord", "discord-file", "discord-tool", "discord-invites"];
  const macos = navigator.userAgent.includes("Mac");
  document.documentElement.classList.toggle("macos", macos);
  // Snapshots only exist on macOS.
  $("snapshots-row").hidden = !macos;

  const close = () => invoke("plugin:window|close", { label: "settings" });
  $("close").addEventListener("click", close);
  addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    // Esc leaves a number field first, then closes.
    if (document.activeElement?.matches("input[type=number]")) document.activeElement.blur();
    else close();
  });

  // Figma theme colors (see THEME_JS in tabs.rs) onto the variables.
  const THEME_VARS = {
    "--bg": "bg",
    "--bg-secondary": "bgSecondary",
    "--bg-tertiary": "bgTertiary",
    "--border": "border",
    "--text": "text",
    "--text-secondary": "textSecondary",
    "--text-tertiary": "textTertiary",
    "--brand": "brand",
  };
  // Relative luminance of a CSS color, 0 to 1, or null.
  const luminance = (color) => {
    const probe = document.createElement("canvas").getContext("2d");
    probe.fillStyle = color;
    const hex = /^#([0-9a-f]{6})$/i.exec(probe.fillStyle)?.[1];
    if (!hex) return null;
    const [r, g, b] = [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  };
  window.applyTheme = (theme) => {
    if (!theme?.bg) return;
    const root = document.documentElement;
    for (const [cssVar, key] of Object.entries(THEME_VARS)) {
      if (theme[key]) root.style.setProperty(cssVar, theme[key]);
    }
    const light = luminance(theme.bg);
    if (light != null) {
      root.classList.toggle("light", light > 0.5);
      root.classList.toggle("dark", light <= 0.5);
    }
  };

  let settings;
  // Number fields keep their last value while switched off, so switching
  // back on restores it.
  let sleepAfter = 30;
  let maxHidden = 3;

  function show() {
    const sleeping = settings.sleepTabsAfterMinutes > 0;
    const limited = settings.maxHiddenTabsLoaded != null;
    if (sleeping) sleepAfter = settings.sleepTabsAfterMinutes;
    if (limited) maxHidden = settings.maxHiddenTabsLoaded;
    $("sleep").checked = sleeping;
    $("sleep-after").value = sleepAfter;
    $("limit").checked = limited;
    $("max-hidden").value = maxHidden;
    $("snapshots").checked = settings.reloadSnapshots;
    $("discord").checked = settings.discordRichPresence;
    $("discord-file").checked = settings.discordShowFile;
    $("discord-tool").checked = settings.discordShowTool;
    $("discord-invites").checked = settings.discordInvites;
    $("restore").checked = settings.restoreTabs;
    // Without sleep nothing is unloaded, so the other memory options do nothing.
    for (const [id, enabled] of [
      ["sleep-after-row", sleeping],
      ["limit-row", sleeping],
      ["max-hidden-row", sleeping && limited],
      ["snapshots-row", sleeping],
      ["discord-file-row", settings.discordRichPresence],
      ["discord-tool-row", settings.discordRichPresence],
      ["discord-invites-row", settings.discordRichPresence],
    ]) {
      $(id).classList.toggle("disabled", !enabled);
      $(id).querySelector("input").disabled = !enabled;
    }
  }

  function whole(input, min, fallback) {
    const value = Math.floor(Number(input.value));
    return Number.isFinite(value) && value >= min ? value : fallback;
  }

  async function save() {
    sleepAfter = whole($("sleep-after"), 1, sleepAfter);
    maxHidden = whole($("max-hidden"), 0, maxHidden);
    settings = {
      ...settings,
      sleepTabsAfterMinutes: $("sleep").checked ? sleepAfter : 0,
      maxHiddenTabsLoaded: $("limit").checked ? maxHidden : null,
      reloadSnapshots: $("snapshots").checked,
      discordRichPresence: $("discord").checked,
      discordShowFile: $("discord-file").checked,
      discordShowTool: $("discord-tool").checked,
      discordInvites: $("discord-invites").checked,
      restoreTabs: $("restore").checked,
    };
    show();
    await invoke("set_settings", { settings });
  }

  for (const id of fields) $(id).addEventListener("change", save);

  $("check-updates").addEventListener("click", () => invoke("check_for_updates"));
  $("report").addEventListener("click", () => invoke("report_problem"));
  invoke("get_version").then((version) => {
    if (version) $("version").textContent = `Ligma ${version}`;
  });

  invoke("get_theme").then(window.applyTheme);
  invoke("get_settings").then((loaded) => {
    settings = loaded;
    show();
  });
</script>
</body>
</html>
