<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tab Menu</title>
<!-- A tab's right-click menu, the toolbar's menu of modes, or the image
     picker's menu of adjustments (see src-tauri/src/tab_menu.rs). The window
     is exactly the menu: the page draws the items from `get_menu`,
     reports its size with `menu_ready`, and sends the chosen item to
     `menu_pick`. Colors come from the active Figma tab's theme, so the
     menu is light or dark with the editor -->
<style>
  /* Figma's UI3 menu, until the first Figma tab reports its theme */
  :root {
    color-scheme: dark;
    --menu: #1e1e1e;
    --text: #ffffff;
    --selected: #0d99ff;
    --selected-text: #ffffff;
    --separator: rgba(255, 255, 255, 0.1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--menu); overflow: hidden; }
  body {
    font: 450 11px/16px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", sans-serif;
    font-feature-settings: "cv11", "calt";
    letter-spacing: 0.005em;
    color: var(--text);
    cursor: default;
    -webkit-user-select: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  #menu {
    display: inline-flex;
    flex-direction: column;
    min-width: 176px;
    padding: 8px;
    outline: none;
  }
  .item {
    display: flex;
    align-items: center;
    height: 24px;
    padding: 0 16px 0 8px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .item.selected { background: var(--selected); color: var(--selected-text); }
  .check { display: flex; width: 16px; margin-right: 4px; visibility: hidden; }
  [aria-checked="true"] > .check { visibility: visible; }
  .shortcut { margin-left: auto; padding-left: 24px; opacity: 0.5; }
  .item.selected > .shortcut { opacity: 0.7; }
  .item[aria-disabled="true"] { opacity: 0.4; }
  .separator { height: 1px; margin: 8px -8px; background: var(--separator); }
</style>
</head>
<body>
<div id="menu" role="menu" tabindex="-1"></div>
<script>
  const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);
  const menu = document.getElementById("menu");
  const pick = (action) => invoke("menu_pick", { action });

  // Figma theme colors (see THEME_JS in tabs.rs) onto the variables. The
  // editor's, not Figma's menu colors: those stay dark in light themes
  const THEME_VARS = {
    "--menu": "bg",
    "--text": "text",
    "--selected": "brand",
    "--separator": "border",
  };
  const applyTheme = (theme) => {
    if (!theme) return;
    for (const [cssVar, key] of Object.entries(THEME_VARS)) {
      if (theme[key]) document.documentElement.style.setProperty(cssVar, theme[key]);
    }
  };

  // Figma's menu check
  const CHECK = '<span class="check" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 8.5l2.5 2.5 4.5-5.5"/></svg></span>';

  let items = [];
  let selected = -1;
  const select = (index) => {
    selected = index;
    items.forEach((node, i) => node.classList.toggle("selected", i === index));
    if (index >= 0) menu.setAttribute("aria-activedescendant", items[index].id);
    else menu.removeAttribute("aria-activedescendant");
  };

  window.refresh = async () => {
    const loaded = await invoke("get_menu");
    if (!loaded) return;
    applyTheme(loaded.theme);
    menu.replaceChildren();
    items = [];
    loaded.items.forEach((item, i) => {
      if (!item) {
        menu.append(Object.assign(document.createElement("div"), { className: "separator", role: "separator" }));
        return;
      }
      const [action, text] = item;
      const node = Object.assign(document.createElement("div"), {
        id: `item-${i}`,
        className: "item",
        role: loaded.checked ? "menuitemcheckbox" : "menuitem",
        textContent: text,
      });
      if (loaded.checked) {
        node.setAttribute("aria-checked", loaded.checked.includes(action));
        node.insertAdjacentHTML("afterbegin", CHECK);
      }
      const shortcut = loaded.shortcuts?.find(([item]) => item === action);
      if (shortcut) node.append(Object.assign(document.createElement("span"), { className: "shortcut", textContent: shortcut[1] }));
      // Shown, but not offered: no hover, keys or clicks
      if (loaded.disabled?.includes(action)) {
        node.setAttribute("aria-disabled", "true");
        menu.append(node);
        return;
      }
      const index = items.length;
      node.addEventListener("mousemove", () => selected !== index && select(index));
      node.addEventListener("click", () => pick(action));
      node.dataset.action = action;
      items.push(node);
      menu.append(node);
    });
    select(-1);
    const { width, height } = menu.getBoundingClientRect();
    await invoke("menu_ready", { width: Math.ceil(width), height: Math.ceil(height) });
    menu.focus();
  };

  menu.addEventListener("mouseleave", () => select(-1));
  addEventListener("keydown", (e) => {
    const step = { ArrowDown: 1, ArrowUp: -1 }[e.key];
    if (step && items.length) {
      e.preventDefault();
      select(selected < 0 ? (step > 0 ? 0 : items.length - 1) : (selected + step + items.length) % items.length);
    } else if (e.key === "Home" || e.key === "End") {
      e.preventDefault();
      select(e.key === "Home" ? 0 : items.length - 1);
    } else if ((e.key === "Enter" || e.key === " ") && selected >= 0) {
      e.preventDefault();
      pick(items[selected].dataset.action);
    } else if (e.key === "Escape") {
      pick(null);
    }
  });
  document.addEventListener("contextmenu", (e) => e.preventDefault());

  window.refresh();
</script>
</body>
</html>
