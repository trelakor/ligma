<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tab Menu</title>
<!-- A tab's right-click menu (see src-tauri/src/tab_menu.rs). The window
     is exactly the menu: the page draws the items from `get_menu`,
     reports its size with `menu_ready`, and sends the chosen item to
     `menu_pick`. Colors come from the active Figma tab's menu theme. -->
<style>
  /* Figma's UI3 menu, until the first Figma tab reports its theme. */
  :root {
    color-scheme: dark;
    --menu: #1e1e1e;
    --text: #ffffff;
    --selected: #0d99ff;
    --selected-text: #ffffff;
    --separator: rgba(255, 255, 255, 0.1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--menu); overflow: hidden; }
  body {
    font: 450 11px/16px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", sans-serif;
    font-feature-settings: "cv11", "calt";
    letter-spacing: 0.005em;
    color: var(--text);
    cursor: default;
    -webkit-user-select: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  #menu {
    display: inline-flex;
    flex-direction: column;
    min-width: 176px;
    padding: 8px;
    outline: none;
  }
  .item {
    display: flex;
    align-items: center;
    height: 24px;
    padding: 0 16px 0 8px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .item.selected { background: var(--selected); color: var(--selected-text); }
  .separator { height: 1px; margin: 8px -8px; background: var(--separator); }
</style>
</head>
<body>
<div id="menu" role="menu" tabindex="-1"></div>
<script>
  const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);
  const menu = document.getElementById("menu");
  const pick = (action) => invoke("menu_pick", { action });

  // Figma theme colors (see THEME_JS in tabs.rs) onto the variables; a
  // theme without menu colors falls back to the editor's.
  const THEME_VARS = {
    "--menu": ["menu", "bg"],
    "--text": ["menuText", "text"],
    "--selected": ["menuSelected", "brand"],
    "--separator": ["menuBorder", "border"],
  };
  const applyTheme = (theme) => {
    if (!theme) return;
    for (const [cssVar, keys] of Object.entries(THEME_VARS)) {
      const value = keys.map((key) => theme[key]).find(Boolean);
      if (value) document.documentElement.style.setProperty(cssVar, value);
    }
  };

  let items = [];
  let selected = -1;
  const select = (index) => {
    selected = index;
    items.forEach((node, i) => node.classList.toggle("selected", i === index));
    if (index >= 0) menu.setAttribute("aria-activedescendant", items[index].id);
    else menu.removeAttribute("aria-activedescendant");
  };

  window.refresh = async () => {
    const loaded = await invoke("get_menu");
    if (!loaded) return;
    applyTheme(loaded.theme);
    menu.replaceChildren();
    items = [];
    loaded.items.forEach((item, i) => {
      if (!item) {
        menu.append(Object.assign(document.createElement("div"), { className: "separator", role: "separator" }));
        return;
      }
      const [action, text] = item;
      const node = Object.assign(document.createElement("div"), {
        id: `item-${i}`,
        className: "item",
        role: "menuitem",
        textContent: text,
      });
      const index = items.length;
      node.addEventListener("mousemove", () => selected !== index && select(index));
      node.addEventListener("click", () => pick(action));
      node.dataset.action = action;
      items.push(node);
      menu.append(node);
    });
    select(-1);
    const { width, height } = menu.getBoundingClientRect();
    await invoke("menu_ready", { width: Math.ceil(width), height: Math.ceil(height) });
    menu.focus();
  };

  menu.addEventListener("mouseleave", () => select(-1));
  addEventListener("keydown", (e) => {
    const step = { ArrowDown: 1, ArrowUp: -1 }[e.key];
    if (step && items.length) {
      e.preventDefault();
      select(selected < 0 ? (step > 0 ? 0 : items.length - 1) : (selected + step + items.length) % items.length);
    } else if (e.key === "Home" || e.key === "End") {
      e.preventDefault();
      select(e.key === "Home" ? 0 : items.length - 1);
    } else if ((e.key === "Enter" || e.key === " ") && selected >= 0) {
      e.preventDefault();
      pick(items[selected].dataset.action);
    } else if (e.key === "Escape") {
      pick(null);
    }
  });
  document.addEventListener("contextmenu", (e) => e.preventDefault());

  window.refresh();
</script>
</body>
</html>
