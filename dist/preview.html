<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tab Preview</title>
<!-- A hovered tab's preview card (see src-tauri/src/preview.rs): its last
     image, name and product. The window is exactly the card: the page
     draws it from `get_tab_preview` and reports its size with
     `tab_preview_ready`. It never gets the mouse or focus. Colors come
     from the active Figma tab's theme -->
<style>
  /* Figma's UI3 dark theme, until the first Figma tab reports its theme */
  :root {
    color-scheme: dark;
    --bg: #2c2c2c;
    --bg-secondary: #383838;
    --text: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.7);
    --border: rgba(255, 255, 255, 0.1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); overflow: hidden; }
  body {
    font: 450 11px/16px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", sans-serif;
    font-feature-settings: "cv11", "calt";
    letter-spacing: 0.005em;
    color: var(--text);
    cursor: default;
    -webkit-user-select: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  /* On Windows the window is see-through and the page draws the card's
     corners and shadow, with room for it all round (INSET) */
  html.drawn, html.drawn body { background: transparent; }
  html.drawn #card {
    margin: 16px;
    border-radius: 13px;
    background: var(--bg);
    box-shadow: 0 0 0 0.5px var(--border), 0 2px 5px rgba(0, 0, 0, 0.15), 0 6px 14px rgba(0, 0, 0, 0.2);
  }
  #card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 264px;
    padding: 8px 8px 10px;
  }
  /* The tab's canvas as it last looked */
  #image {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 6px;
    background: var(--bg-secondary);
    outline: 1px solid var(--border);
    outline-offset: -1px;
  }
  #image[hidden] { display: none; }
  #text { padding: 0 4px; min-width: 0; }
  #title {
    font-size: 13px;
    line-height: 20px;
    font-weight: 550;
    letter-spacing: -0.0025em;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  #detail { color: var(--text-secondary); }
</style>
</head>
<body>
<div id="card">
  <canvas id="image" hidden></canvas>
  <div id="text">
    <div id="title"></div>
    <div id="detail"></div>
  </div>
</div>
<script>
  const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);
  const $ = (id) => document.getElementById(id);
  const drawn = !navigator.userAgent.includes("Mac");
  document.documentElement.classList.toggle("drawn", drawn);
  const INSET = drawn ? 16 : 0;

  // Figma theme colors (see THEME_JS in tabs.rs) onto the variables
  const THEME_VARS = {
    "--bg": "bg",
    "--bg-secondary": "bgSecondary",
    "--text": "text",
    "--text-secondary": "textSecondary",
    "--border": "border",
  };
  const applyTheme = (theme) => {
    if (!theme) return;
    for (const [cssVar, key] of Object.entries(THEME_VARS)) {
      if (theme[key]) document.documentElement.style.setProperty(cssVar, theme[key]);
    }
  };

  // Tab kinds (`kind` in tabs.rs) by product
  const PRODUCTS = {
    design: "Figma Design",
    board: "FigJam",
    slides: "Figma Slides",
    proto: "Prototype",
    make: "Figma Make",
    site: "Figma Sites",
    buzz: "Figma Buzz",
  };

  // Draws the `crop` part of `source` (fractions, see CROP_JS in tabs.rs),
  // or all of it, to fill `canvas`, trimming the longer side evenly. Less
  // EDGE pixels all round: the image's outermost rows can hold a line of
  // Figma's frame, and scaling down would blend it in
  const EDGE = 2;
  const draw = (canvas, source, crop) => {
    const [cx, cy, cw, ch] = crop ?? [0, 0, 1, 1];
    let [sx, sy, sw, sh] = [cx * source.width, cy * source.height, cw * source.width, ch * source.height];
    [sx, sy, sw, sh] = [sx + EDGE, sy + EDGE, sw - 2 * EDGE, sh - 2 * EDGE];
    const { width, height } = canvas.getBoundingClientRect();
    const fit = width / height;
    if (sw / sh > fit) {
      sx += (sw - sh * fit) / 2;
      sw = sh * fit;
    } else {
      sy += (sh - sw / fit) / 2;
      sh = sw / fit;
    }
    canvas.width = Math.round(width * devicePixelRatio);
    canvas.height = Math.round(height * devicePixelRatio);
    const context = canvas.getContext("2d");
    context.imageSmoothingQuality = "high";
    context.drawImage(source, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  };

  // Only the latest card is drawn, if they come quickly one after another
  let latest = 0;
  window.refresh = async () => {
    const asked = ++latest;
    const card = await invoke("get_tab_preview");
    if (!card || asked !== latest) return;
    applyTheme(card.theme);
    $("title").textContent = card.title || "Loading…";
    $("detail").textContent = [PRODUCTS[card.kind] ?? "Figma", card.asleep && "Asleep"].filter(Boolean).join(" · ");
    const image = $("image");
    image.hidden = !card.image;
    if (card.image) {
      // Drawn before it's shown, not after
      const loaded = new Image();
      loaded.src = card.image;
      const ok = await loaded.decode().then(() => true, () => false);
      if (asked !== latest) return;
      if (ok) draw(image, loaded, card.crop);
      else image.hidden = true;
    }
    const { width, height } = $("card").getBoundingClientRect();
    await invoke("tab_preview_ready", { seq: card.seq, width: Math.ceil(width), height: Math.ceil(height), inset: INSET });
  };

  window.refresh();
</script>
</body>
</html>
