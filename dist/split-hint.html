<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Split View</title>
<!-- Marks the half of a canvas a dragged tab would split into (see
     src-tauri/src/split.rs). The window is see-through on Windows; on
     macOS it's faded instead -->
<style>
  /* The theme's accent, set by split.rs */
  :root { --brand: #0d99ff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: transparent; }
  #hint {
    position: fixed;
    inset: 6px;
    border: 2px solid var(--brand);
    border-radius: 8px;
    background: color-mix(in srgb, var(--brand) 16%, transparent);
  }
</style>
</head>
<body>
<div id="hint"></div>
</body>
</html>
