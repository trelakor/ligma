<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ligma</title>
<!-- A prompt: join requests, updates and errors (see src-tauri/src/prompt.rs).
     The window is exactly the prompt: the page draws the text and buttons
     from `get_prompt`, reports its size with `prompt_ready`, and sends the
     chosen button to `prompt_answer`. Colors come from the active Figma
     tab's theme, like the settings window's -->
<style>
  /* Figma's UI3 palette, until the first Figma tab reports its own */
  :root {
    color-scheme: dark;
    --bg: #2c2c2c;
    --bg-secondary: #383838;
    --border: #444444;
    --text: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.7);
    --brand: #0d99ff;
    --hover: rgba(255, 255, 255, 0.06);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --bg-secondary: #f5f5f5;
      --border: #e6e6e6;
      --text: rgba(0, 0, 0, 0.9);
      --text-secondary: rgba(0, 0, 0, 0.5);
      --hover: rgba(0, 0, 0, 0.04);
    }
  }
  /* Set by `applyTheme` from the theme's background */
  :root.dark { color-scheme: dark; --hover: rgba(255, 255, 255, 0.06); }
  :root.light { color-scheme: light; --hover: rgba(0, 0, 0, 0.04); }

  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); overflow: hidden; }
  body {
    font: 450 11px/16px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", sans-serif;
    font-feature-settings: "cv11", "calt";
    letter-spacing: 0.005em;
    color: var(--text);
    cursor: default;
    -webkit-user-select: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  #prompt { width: 360px; }
  /* Drags the window */
  header {
    display: flex;
    align-items: center;
    height: 40px;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 11px; font-weight: 550; line-height: 16px; pointer-events: none; }
  #message {
    padding: 16px 16px 0;
    color: var(--text);
    white-space: pre-line;
    overflow-wrap: anywhere;
    text-wrap: pretty;
    -webkit-user-select: text;
    user-select: text;
    cursor: text;
  }
  footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 16px;
  }
  /* Figma's buttons: secondary, and primary for the default */
  button {
    flex: none;
    height: 24px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: none;
    color: var(--text);
    font: inherit;
    font-weight: 450;
  }
  button:hover { background: var(--hover); }
  button:active { background: var(--bg-secondary); }
  button.primary { border-color: transparent; background: var(--brand); color: #fff; }
  button.primary:hover, button.primary:active { background: color-mix(in srgb, var(--brand) 88%, #000); }
  button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  button.primary:focus-visible { outline-color: color-mix(in srgb, var(--brand) 60%, var(--text)); }
</style>
</head>
<body>
<div id="prompt" role="alertdialog" aria-labelledby="title" aria-describedby="message">
  <header data-tauri-drag-region><h1 id="title"></h1></header>
  <p id="message"></p>
  <footer></footer>
</div>
<script>
  const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);
  const $ = (id) => document.getElementById(id);
  const answer = (index) => invoke("prompt_answer", { index });

  // Figma theme colors (see THEME_JS in tabs.rs) onto the variables
  const THEME_VARS = {
    "--bg": "bg",
    "--bg-secondary": "bgSecondary",
    "--border": "border",
    "--text": "text",
    "--text-secondary": "textSecondary",
    "--brand": "brand",
  };
  // Relative luminance of a CSS color, 0 to 1, or null
  const luminance = (color) => {
    const probe = document.createElement("canvas").getContext("2d");
    probe.fillStyle = color;
    const hex = /^#([0-9a-f]{6})$/i.exec(probe.fillStyle)?.[1];
    if (!hex) return null;
    const [r, g, b] = [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  };
  window.applyTheme = (theme) => {
    if (!theme?.bg) return;
    const root = document.documentElement;
    for (const [cssVar, key] of Object.entries(THEME_VARS)) {
      if (theme[key]) root.style.setProperty(cssVar, theme[key]);
    }
    const light = luminance(theme.bg);
    if (light != null) {
      root.classList.toggle("light", light > 0.5);
      root.classList.toggle("dark", light <= 0.5);
    }
  };

  // Sizes the window to the prompt, also after the interface scale changes
  window.measure = () => {
    const { width, height } = $("prompt").getBoundingClientRect();
    return invoke("prompt_ready", { width: Math.ceil(width), height: Math.ceil(height) });
  };

  let buttons = [];
  invoke("get_prompt").then(async (prompt) => {
    if (!prompt) return;
    window.applyTheme(prompt.theme);
    document.title = prompt.title;
    $("title").textContent = prompt.title;
    $("message").textContent = prompt.message;
    buttons = prompt.buttons.map((text, index) => {
      const button = Object.assign(document.createElement("button"), { textContent: text });
      if (index === prompt.buttons.length - 1) button.className = "primary";
      button.addEventListener("click", () => answer(index));
      return button;
    });
    document.querySelector("footer").replaceChildren(...buttons);
    await document.fonts?.ready;
    await window.measure();
    buttons.at(-1)?.focus();
  });

  addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      e.preventDefault();
      answer(null);
    } else if (e.key === "Enter" && !(document.activeElement instanceof HTMLButtonElement)) {
      e.preventDefault();
      buttons.at(-1)?.click();
    } else if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && buttons.length > 1) {
      e.preventDefault();
      const at = buttons.indexOf(document.activeElement);
      const step = e.key === "ArrowRight" ? 1 : -1;
      buttons[(at + step + buttons.length) % buttons.length].focus();
    }
  });
  document.addEventListener("contextmenu", (e) => e.preventDefault());
</script>
</body>
</html>
