  else if (state.view.startsWith("t:") && LIVE) html += `<span class="fnote">This team's trash in Figma. Restore a file, or delete it for good</span>`;
  else if (inTrash() && LIVE) html += `<span class="fnote">Every team's trash in Figma. Restore a file, or delete it for good</span>`;
  else if (inTrash()) html += `<span class="fnote">Files in the trash are deleted for good after 30 days</span>`;
  else if (state.view === "starred" && FILES.some((f) => f.starred && !f.trashed)) html += `<span class="fnote">Drag files, or press ${MAC ? "⌥←" : "Alt+Left"} and ${MAC ? "⌥→" : "Alt+Right"}, to put them in your order</span>`;
  else if (state.view.startsWith("p:")) html += `<a class="fnote" href="https://www.figma.com/files" target="_blank" rel="noopener">Sharing and permissions in Figma${icon("ext")}</a>`;
  else if (layoutOf(state.view)) html += layoutToggle(layoutOf(state.view));
  morph(filters, html);
}

// A shared file's line: its project when it's in one of yours, then who
// shared it and when
function sharedText(file) {
  const where = placeOf(file.project);
  return (where === "Shared with you" ? "" : where + " · ") + sharedWhen(file);
}

// The same, without where: a row has its own column for that
const sharedWhen = (file) => (file.sharedBy ? `${file.sharedBy} shared it ${when(file.sharedAt)}` : `${file.madeBy ? `From ${file.madeBy} · ` : ""}Shared ${when(file.sharedAt)}`);

// `reorder`: in a row of starred files, which has its own drag (startLift).
// `why`: a suggested file says why it's there, in place of where and when
function cardHtml(file, { reorder = state.view === "starred", why } = {}) {
  const trash = inTrash();
  const place = /^[pd]:/.test(state.view) ? "" : placeOf(file.project) + " · ";
  const sharedNote = state.view === "shared" && file.sharedAt ? sharedText(file) : null;
  const meta = why ? why.text : sharedNote ? sharedNote : trash ? `${placeOf(file.project)} · Deleted ${when(file.trashedAt)}` : place + activity(file) + (file.unread ? ` · ${file.unread} new` : "");
  const tools = trash ? "" : `<div class="tools"><button class="tool more" tabindex="-1" aria-label="More actions" aria-haspopup="menu">${icon("more")}</button><button class="tool star${file.starred ? " starred" : ""}" tabindex="-1" aria-label="${file.starred ? "Remove from starred" : "Star"}">${icon("star")}</button></div>`;
  const badge = file.unread ? `<span class="badge" title="${file.unread} new ${file.unread === 1 ? "comment" : "comments"}">${file.unread}</span>` : "";
  const restore = trash ? `<button class="restore" tabindex="-1">Restore</button>` : "";
  return `<div class="card" role="option" id="c-${file.id}" data-id="${file.id}" tabindex="-1" aria-selected="${state.sel.has(file.id)}" aria-labelledby="n-${file.id}" aria-describedby="d-${file.id}" draggable="${!trash && !reorder}">
    <div class="thumb" data-thumb="${file.id}" aria-hidden="true"></div>${trash ? "" : facesBox(file.id)}${tools}
    <div class="name">${glyph(file.type)}<span class="nm" id="n-${file.id}">${esc(file.name)}</span>${badge}${restore}</div>
    <div class="meta${why?.strong ? " strong" : ""}" id="d-${file.id}">${esc(meta)}</div></div>`;
}

const facesBox = (id, cls = "") => {
  const label = facesLabel(id);
  return `<div class="faces${cls}" data-faces="${id}"${label ? ` role="img" aria-label="${esc(label)}"` : ""}>${facesHtml(id)}</div>`;
};

// A file on one line: a small preview, its name, where it is and what
// happened last. Recents can show files this way or as cards
function rowHtml(file) {
  const badge = file.unread ? `<span class="badge" title="${file.unread} new ${file.unread === 1 ? "comment" : "comments"}">${file.unread}</span>` : "";
  return `<div class="card row" role="option" id="c-${file.id}" data-id="${file.id}" tabindex="-1" aria-selected="${state.sel.has(file.id)}" aria-labelledby="n-${file.id}" aria-describedby="d-${file.id}" draggable="true">
    <div class="thumb" data-thumb="${file.id}" aria-hidden="true"></div>
    <div class="name">${glyph(file.type)}<span class="nm" id="n-${file.id}">${esc(file.name)}</span>${badge}</div>
    <div class="where">${esc(state.view === "shared" && placeOf(file.project) === "Shared with you" ? "" : placeOf(file.project))}</div>
    <div class="when" id="d-${file.id}">${esc(state.view === "shared" && file.sharedAt ? sharedWhen(file) : activity(file))}</div>
    <div class="end">${facesBox(file.id, " inline")}<div class="tools"><button class="tool more" tabindex="-1" aria-label="More actions" aria-haspopup="menu">${icon("more")}</button><button class="tool star${file.starred ? " starred" : ""}" tabindex="-1" aria-label="${file.starred ? "Remove from starred" : "Star"}">${icon("star")}</button></div></div></div>`;
}
const fileList = (files, label, layout) =>
  layout === "rows"
    ? `<div class="rows" role="listbox" aria-multiselectable="true" aria-label="${esc(label)}">${files.map(rowHtml).join("")}</div>`
    : `<div class="grid" role="listbox" aria-multiselectable="true" aria-label="${esc(label)}">${files.map(cardHtml).join("")}</div>`;

// Rows or cards for Recents, here and on Home
// `where`: "home" (Home's Recents, rows unless changed), or a page with
// cards unless changed: "recents", "shared" or "drafts" (every Drafts).
// Each keeps its own
const LAYOUT_LABELS = { home: "Recents", recents: "Recents", shared: "Shared with you", drafts: "Drafts" };
const layoutOf = (view) => (view === "recents" || view === "shared" ? view : view === "drafts" || view.startsWith("d:") ? "drafts" : null);
const layoutToggle = (where) =>
  `<div class="seg lay" role="group" aria-label="Show ${LAYOUT_LABELS[where]} as">${[["rows", "list", "List"], ["grid", "grid", "Grid"]].map(([value, iconName, label]) => `<button data-layout="${where}:${value}" aria-pressed="${state.layout[where] === value}" aria-label="${label}" title="${label}">${icon(iconName)}</button>`).join("")}</div>`;
function setLayout(choice) {
  const [where, value] = choice.split(":");
  state.layout[where] = value;
  store.set("layout:" + where, value);
  render();
}

/* Home: what you starred, then what Ligma thinks you'll want (projects
   you've been working in, files with something new), then your latest
   files. Each file shows once, in the first section that has it */

// Cards across, as a grid lays them out at this width
const homeColumns = (min, gap = 16) => Math.max(1, Math.floor((scroller.clientWidth - 56 + gap) / (min + gap)));
const homeShape = () => [homeColumns(300, 20), homeColumns(240), homeColumns(260)].join();
let homeCols = "";

// Why a file is suggested, strongest first; 0 is no reason beyond having
// opened it
function reasonFor(file) {
  if (file.unread) return { score: 1000 + file.unread, text: `${file.unread} new ${file.unread === 1 ? "comment" : "comments"}`, strong: true };
  if (!LIVE) return { score: file.by && file.kind !== "open" ? 500 : 0, text: activity(file) };
  const people = [...(PRESENCE.get(file.key)?.values() ?? [])].filter((u) => u.id !== Live.uid);
  if (people.length) return { score: 800, text: `${personName(people[0])}${people.length > 1 ? ` and ${people.length - 1} more are` : " is"} in it now`, strong: true };
  // Figma says when a file changed, not who changed it, and logs when you
  // opened a file, not when you left: a change hours after that open is
  // most likely someone else's, not your own session's
  if (file.touchedAt && file.viewedAt && file.touchedAt - file.viewedAt > 6 * HOUR) return { score: 400, text: `New changes · ${short(file.touchedAt)}` };
  return { score: 0, text: `You opened it · ${short(file.viewedAt ?? file.at)}` };
}

// Projects you've been working in lately, with their latest files
function suggestProjects(files, n) {
  const byProject = new Map();
  for (const f of files) {
    if (!f.project || !PROJECTS[f.project] || DRAFT_FOLDERS.has(f.project)) continue;
    const list = byProject.get(f.project) ?? [];
    list.push(f);
    byProject.set(f.project, list);
  }
  return [...byProject]
    .map(([id, list]) => ({ ...PROJECTS[id], files: list.sort((a, b) => b.at - a.at), at: Math.max(...list.map((f) => f.at)) }))
    .sort((a, b) => b.at - a.at)
    .slice(0, n);
}
const filesText = (n) => (n === undefined ? "" : `${n} ${n === 1 ? "file" : "files"}`);
// Its count from Figma, filled in where the project shows once it comes
function wantProjectCount(id) {
  if (!LIVE || !Live.uid || COUNTED.has("p:" + id)) return;
  COUNTED.add("p:" + id);
  LG.load(VIEWS.projectCount(id)).then(() => {
    for (const el of $$(`[data-pcount="${id}"]`)) el.textContent = filesText(LG.count(id));
    sideSoon();
  }, () => COUNTED.delete("p:" + id));
}
// A project as a tile: its latest files' previews over its name, team,
// number of files and when something last changed in it
function projectTile(p) {
  if (!LIVE || Live.ready.has("starred")) wantProjectCount(p.id);
  const shots = p.files.slice(0, 3);
  const cells = shots.length ? shots.map((f) => `<span class="thumb" data-thumb="${f.id}"></span>`).join("") : `<span class="none">${figmaIcon("folder", 24)}</span>`;
  return `<button class="ptile" data-go="p:${p.id}" data-project="${p.id}" aria-label="${esc(`${p.name}, ${p.team.name}`)}">
    <span class="mosaic n${shots.length}" aria-hidden="true">${cells}</span>
    <span class="pname">${figmaIcon("folder", 16)}<b>${esc(p.name)}</b></span>
    <span class="pmeta"><span>${esc(p.team.name)} · ${esc(short(p.at))}</span><span data-pcount="${p.id}">${esc(filesText(LIVE ? LG.count(p.id) : p.files.length))}</span></span></button>`;
}

function homeLayout() {
  homeCols = homeShape();
  const [starCols, cols, projectCols] = homeCols.split(",").map(Number);
  const shown = FILES.filter((f) => !f.trashed && (state.type === "all" || f.type === state.type));
  const starredAll = starOrder(shown.filter((f) => f.starred));
  const starred = starredAll.slice(0, starCols);
  const taken = new Set(starred.map((f) => f.id));
  const pool = shown.filter((f) => (LIVE ? f.recent : true) && !taken.has(f.id)).sort((a, b) => b.at - a.at);
  // Who's in a file is a reason too: watch the latest ones
  if (LIVE && Live.ready.has("starred")) for (const f of pool.slice(0, 24)) LG.watch(f.key);
  const reasons = new Map(pool.map((f) => [f.id, reasonFor(f)]));
  // A row of suggestions: files with something new first; with little new,
  // older work you opened comes back, what Recents has scrolled past
  const signals = pool.filter((f) => reasons.get(f.id).score > 0).sort((a, b) => reasons.get(b.id).score - reasons.get(a.id).score || b.at - a.at).slice(0, cols);
  for (const f of signals) taken.add(f.id);
  const recentCount = state.layout.home === "rows" ? 8 : cols * 2;
  const recents = pool.filter((f) => !taken.has(f.id)).slice(0, recentCount);
  for (const f of recents) taken.add(f.id);
  const suggested = [...signals, ...pool.filter((f) => !taken.has(f.id)).slice(0, Math.max(0, Math.min(cols, 4) - signals.length))];
  const projects = suggestProjects(shown.filter((f) => !LIVE || f.recent || f.starred), projectCols);

  const files = [];
  const open = (id) => !state.collapsed.has("home:" + id);
  const section = (id, title, count, body, view, extra = "") =>
    `<section class="sec home-sec" data-key="home:${id}"><h2><button class="fold" data-fold="home:${id}" aria-expanded="${open(id)}">${icon("down", "chev")}<span>${esc(title)}</span>${count ? `<small>${count}</small>` : ""}</button>${extra}${view ? `<button class="all" data-go="${view}">View all${icon("right")}</button>` : ""}</h2>${open(id) ? body : ""}</section>`;
  let html = "";

  // Placeholders while a list is still on its way: Starred comes first
  const waiting = (n, cls = "") => `<div class="grid ${cls}" aria-hidden="true">${`<div class="card sk"><div class="thumb"></div><div class="bar" style="width:60%"></div><div class="bar" style="width:40%;margin-top:8px"></div></div>`.repeat(n)}</div>`;
  const starsLoading = LIVE && !Live.ready.has("starred") && !starred.length;
  const recentsLoading = LIVE && !Live.ready.has("recents");

  if (open("starred")) files.push(...starred);
  html += section("starred", "Starred", starredAll.length, starred.length
    ? `<div class="grid star-grid" role="listbox" aria-multiselectable="true" aria-label="Starred, drag to reorder">${starred.map((f) => cardHtml(f, { reorder: true })).join("")}</div>`
    : starsLoading ? waiting(starCols, "star-grid") : `<p class="hint">Press S on a file, or click the star on its preview, to keep it here</p>`, starredAll.length ? "starred" : null);
  if (recentsLoading) html += `<section class="sec home-sec" data-key="home:waiting">${waiting(cols * 2)}</section>`;

  if (projects.length) html += section("projects", "Suggested projects", 0, `<div class="ptiles">${projects.map(projectTile).join("")}</div>`);

  if (suggested.length) {
    if (open("suggested")) files.push(...suggested);
    html += section("suggested", "Suggested files", 0, `<div class="grid" role="listbox" aria-multiselectable="true" aria-label="Suggested files">${suggested.map((f) => cardHtml(f, { why: reasons.get(f.id) })).join("")}</div>`);
  }

  if (recents.length) {
    if (open("recents")) files.push(...recents);
    html += section("recents", "Recents", 0, fileList(recents, "Recents", state.layout.home), "recents", layoutToggle("home"));
  }
  // What a redraw would change, for presence updates (see presenceChanged)
  const key = suggested.map((f) => f.id + reasons.get(f.id).text).join("|");
  return { html, files, key, any: starsLoading || recentsLoading || starred.length + suggested.length + recents.length > 0 };
}
let homeKey = "";

const EMPTY = {
  home: ["home", "Nothing here yet", "Files you open, edit or get comments on show up here", "new"],
  recents: ["clock", "Nothing here yet", "Files you open, edit or get comments on show up here, newest first", "new"],
  shared: ["users", "Nothing shared with you", "Files people share with you show up here, newest first", null],
  starred: ["star", "No starred files", "Press S on a file, or click the star on its preview, to keep it here", null],
  drafts: ["file", "No drafts", "Files you make outside a project stay here until you move them", "new"],
  trash: ["trash", "Trash is empty", "Deleted files stay here for 30 days, then they're gone for good", null],
  project: ["folder", "No files in this project", "Drag files onto it in the sidebar, or make a new one here", "new"],
};

function renderEmpty() {
  if (state.type !== "all") {
    const what = `No ${TYPES[state.type].label} files here`;
    return `<div class="empty"><div class="ic">${icon("search")}</div><h2>${what}</h2><p>Your filters hide every file in ${esc(viewName(state.view))}</p><button class="btn" data-act="clear-filters">Show all files</button></div>`;
  }
  const [iconName, title, body, action] = EMPTY[state.view.startsWith("p:") ? "project" : state.view.startsWith("d:") ? "drafts" : state.view.startsWith("t:") ? "trash" : state.view];
  const button = action ? `<button class="btn primary" data-act="new">${icon("plus")}New Design file</button>` : "";
  return `<div class="empty"><div class="ic">${icon(iconName)}</div><h2>${title}</h2><p>${body}</p>${button}</div>`;
}

function renderSkeleton() {
  const card = `<div class="card sk"><div class="thumb"></div><div class="bar" style="width:60%"></div><div class="bar" style="width:40%;margin-top:8px"></div></div>`;
  return ["Today", "Yesterday"].map((label) => `<section class="sec"><h2>${label}</h2><div class="grid">${card.repeat(4)}</div></section>`).join("");
}

/* Redraws change only what changed. What's on screen stays where it is:
   previews already drawn, hover, focus, a selection box, animations. So
   something loading changes its own part of the page, not all of it.
   Elements pair up by `id` or `data-key`, the rest by place and tag */

const keyOf = (node) => (node.nodeType === 1 ? node.dataset.key || node.id || null : null);
function morph(parent, html) {
  const next = document.createElement("template");
  next.innerHTML = html;
  patchChildren(parent, next.content);
}
function patchChildren(from, to) {
  const keyed = new Map();
  for (const el of from.children) if (keyOf(el)) keyed.set(keyOf(el), el);
  const wanted = new Set([...to.children].map(keyOf).filter(Boolean));
  let cur = from.firstChild;
  // Skips past what's going: keyed elements the new content doesn't have
  const settle = () => {
    while (cur && keyOf(cur) && !wanted.has(keyOf(cur))) {
      const gone = cur;
      cur = cur.nextSibling;
      gone.remove();
    }
  };
  for (const want of [...to.childNodes]) {
    settle();
    const key = keyOf(want);
    let have = key ? keyed.get(key) : cur && !keyOf(cur) && cur.nodeName === want.nodeName ? cur : null;
    if (have && have.nodeName !== want.nodeName) have = null;
    if (key) keyed.delete(key);
    if (!have) {
      from.insertBefore(want, cur);
      continue;
    }
    if (have === cur) cur = cur.nextSibling;
    else from.insertBefore(have, cur);
    patch(have, want);
  }
  while (cur) {
    const gone = cur;
    cur = cur.nextSibling;
    gone.remove();
  }
}
function patch(have, want) {
  if (have.nodeType !== 1) {
    if (have.nodeValue !== want.nodeValue) have.nodeValue = want.nodeValue;
    return;
  }
  for (const { name } of [...have.attributes]) if (!want.hasAttribute(name)) have.removeAttribute(name);
  for (const { name, value } of want.attributes) if (have.getAttribute(name) !== value) have.setAttribute(name, value);
  // A preview already drawn stays; observeThumbs draws it again if the file's changed
  if (have.dataset.thumb && have.firstChild) return;
  patchChildren(have, want);
}

// A file's preview into `el`, noting which picture it is
const thumbSig = (file) => `${file.id}|${file.live ? `${file.thumbUrl ?? ""}|${file.bg ?? ""}` : file.name}`;
function fillThumb(el, file) {
  el.innerHTML = thumb(file);
  el.sig = thumbSig(file);
}

let thumbObserver;
function observeThumbs() {
  thumbObserver?.disconnect();
  thumbObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      const el = entry.target;
      thumbObserver.unobserve(el);
      const file = byId(el.dataset.thumb);
      if (!file) continue;
      fillThumb(el, file);
    }
  }, { root: scroller, rootMargin: "800px 0px" });
  for (const el of $$(".thumb[data-thumb]", scroller)) {
    const file = byId(el.dataset.thumb);
    if (!el.firstChild || !file) thumbObserver.observe(el);
    else if (el.sig !== thumbSig(file)) fillThumb(el, file);
  }
  observeFaces();
}

// Who's in each file on screen, watched from when it's near the view.
// Each redraw, and each new socket, asks for every one in view again: a
// file already watched on this socket is skipped
let facesObserver;
function observeFaces() {
  if (!LIVE) return;
  facesObserver?.disconnect();
  facesObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      const file = byId(entry.target.dataset.faces);
      if (file?.live && !file.trashed) LG.watch(file.key);
    }
  }, { root: scroller, rootMargin: "800px 0px" });
  for (const el of $$("[data-faces]", scroller)) facesObserver.observe(el);
}

// The selection box, drawn over the files (see drawBox)
const marquee = Object.assign(document.createElement("div"), { className: "marquee" });
let box = null;

function render({ keepScroll = true } = {}) {
  // Not under a starred file being dragged: once it's down
  if (lift?.live) {
    lift.rerender = true;
    return;
  }
  const started = performance.now();
  const ready = LIVE && (state.view === "home" ? Live.ready.has("recents") || Live.ready.has("starred") : Live.ready.has(state.view));
  const home = state.view === "home" && state.mode !== "empty" && (!LIVE || ready) ? homeLayout() : null;
  if (home) homeKey = home.key;
  const list = state.mode === "empty" ? [] : home ? home.files : viewFiles();
  order = list.map((f) => f.id);
  for (const id of state.sel) if (!order.includes(id)) state.sel.delete(id);
  renderSide();
  renderHead(list.length);
  renderFilters();
  sections = [];
  let html = "";
  if (state.mode === "loading") html = renderSkeleton();
  else if (LIVE && Live.signedOut) html = `<div class="empty"><div class="ic">${icon("users")}</div><h2>Sign in to Figma</h2><p>Your files show here once you're signed in</p><a class="btn primary" href="https://www.figma.com/login">Sign in</a></div>`;
  else if (LIVE && !ready && !Live.error) {
    need(state.view);
    html = renderSkeleton();
  } else if (home) html = home.any ? home.html : renderEmpty();
  else if (!list.length) html = renderEmpty();
  else if (state.view === "starred") html = `<section class="sec"><div class="grid star-grid" id="starred-grid" role="listbox" aria-multiselectable="true" aria-label="Starred, drag to reorder">${list.map(cardHtml).join("")}</div></section>`;
  // Shared with you and Drafts: one grid, newest first, no dates over it
  else if (state.view === "shared" || state.view === "drafts" || state.view.startsWith("d:")) html = `<section class="sec">${fileList(list, viewName(state.view), state.layout[layoutOf(state.view)])}</section>`;
  else {
    for (const file of list) {
      const t = timeOf(file);
      const b = bucket(t);
      if (sections.at(-1)?.key !== b.key) sections.push({ ...b, month: monthOf(t), files: [] });
      sections.at(-1).files.push(file);
    }
    const layout = state.view === "recents" ? state.layout.recents : "grid";
    html = sections.map((s, i) => `<section class="sec" id="s${i}" data-key="day:${s.key}" data-month="${s.month}"><h2>${esc(s.label)}<small>${s.files.length}</small></h2>${fileList(s.files, s.label, layout)}</section>`).join("");
  }
  // Keyboard focus stays on the grid across a redraw: on the same file, or
  // the next one when it left this view
  const active = document.activeElement;
  const hadFocus = scroller.contains(active) || active === document.body || !active;
  if (state.focus && !order.includes(state.focus)) {
    const was = previousOrder.indexOf(state.focus);
    state.focus = previousOrder.slice(was + 1).find((id) => order.includes(id)) ?? order.at(-1) ?? null;
  }
  previousOrder = order;
  // A selection box being drawn stays over the new content
  const boxing = marquee.isConnected;
  marquee.remove();
  morph(scroller, html);
  if (boxing) scroller.append(marquee);
  if (box) box.cards = null;
  // Otherwise the browser keeps what's in view where it is, as content
  // above it changes
  if (!keepScroll) scroller.scrollTop = 0;
  const first = state.focus && order.includes(state.focus) ? state.focus : order[0];
  if (first && cardEl(first)) cardEl(first).tabIndex = 0;
  if (inboxEl.classList.contains("open")) drawInbox();
  if (hadFocus && state.focus && order.includes(state.focus) && cardEl(state.focus) && !pal.open && !menu.classList.contains("open")) cardEl(state.focus).focus({ preventScroll: true });
  observeThumbs();
  renderRail();
  renderSelbar();
  console.debug(`Home: ${list.length} files in ${(performance.now() - started).toFixed(1)} ms`);
}

/* Month rail: every month from the newest file back to the oldest, empty
   ones too, with a tick as long as the month is busy */

let railMonths = [];
function renderRail() {
  railMonths = [];
  if (sections.length) {
    const counts = new Map();
    for (const s of sections) counts.set(s.month, (counts.get(s.month) ?? 0) + s.files.length);
    const [ny, nm] = sections[0].month.split("-").map(Number);
    const [oy, om] = sections.at(-1).month.split("-").map(Number);
    for (let y = ny, m = nm; y > oy || (y === oy && m >= om); m--) {
      if (m < 0) { m = 11; y--; }
      railMonths.push({ key: `${y}-${m}`, y, m, n: counts.get(`${y}-${m}`) ?? 0 });
    }
  }
  if (railMonths.length < 2) {
    scroller.style.paddingBottom = "";
    rail.hidden = true;
    rail.parentElement.style.gridTemplateColumns = "minmax(0, 1fr)";
    return;
  }
  rail.hidden = false;
  rail.parentElement.style.gridTemplateColumns = "";
  const max = Math.max(...railMonths.map((m) => m.n));
  let html = `<span class="pos" id="pos"></span>`;
  let year = null;
  for (const month of railMonths) {
    if (month.y !== year) {
      year = month.y;
      html += `<span class="yr">${year}</span>`;
    }
    const name = new Date(month.y, month.m).toLocaleDateString(undefined, { month: "short" });
    const full = new Date(month.y, month.m).toLocaleDateString(undefined, { month: "long", year: "numeric" });
    const tip = `${full} · ${month.n ? `${month.n} ${month.n === 1 ? "file" : "files"}` : "nothing"}`;
    html += `<button class="mo" data-month="${month.key}" data-tip="${esc(tip)}" aria-label="${esc(tip)}" ${month.n ? "" : "disabled"}>${esc(name)}<span class="d" style="--w:${month.n ? Math.max(4, Math.round((month.n / max) * 28)) : 0}px"></span></button>`;
  }
  rail.innerHTML = html;
  fitEnd();
  syncRail(true);
}

// Room after the oldest month, so a jump to it lands at the top
function fitEnd() {
  const last = !rail.hidden && $(".sec:last-child", scroller);
  scroller.style.paddingBottom = last ? `${Math.max(120, scroller.clientHeight - last.offsetHeight)}px` : "";
}
// Home shows a row of starred files and of projects, so a width that fits
// more or fewer draws it again
let resizeFrame = 0;
new ResizeObserver(() => {
  fitEnd();
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(() => state.view === "home" && homeShape() !== homeCols && render());
}).observe(scroller);

let railKey = null;
function syncRail(instant = false) {
  if (rail.hidden || !sections.length) return;
  const secs = $$(".sec", scroller);
  const y = scroller.scrollTop + 48;
  let current = secs[0];
  for (const sec of secs) {
    if (sec.offsetTop <= y) current = sec;
    else break;
  }
  if (scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 2) current = secs.at(-1);
  setRailMonth(current.dataset.month, instant);
}
function setRailMonth(key, instant = false) {
  const button = $(`.mo[data-month="${key}"]`, rail);
  const pos = $("#pos", rail);
  if (!button || !pos) return;
  if (key !== railKey) {
    $$(".mo.on", rail).forEach((b) => {
      b.classList.remove("on");
      b.removeAttribute("aria-current");
    });
    button.classList.add("on");
    button.setAttribute("aria-current", "true");
    railKey = key;
  }
  if (instant) pos.style.transition = "none";
  pos.style.transform = `translateY(${button.offsetTop}px)`;
  if (instant) requestAnimationFrame(() => (pos.style.transition = ""));
  const top = button.offsetTop - rail.clientHeight / 2;
  if (rail.scrollHeight > rail.clientHeight) rail.scrollTo({ top, behavior: instant ? "auto" : "smooth" });
}

let scrollFrame = 0;
scroller.addEventListener("scroll", () => {
  if (scrollFrame) return;
  scrollFrame = requestAnimationFrame(() => {
    scrollFrame = 0;
    syncRail();
  });
}, { passive: true });

function jumpTo(button, smooth) {
  const sec = button && !button.disabled && $(`.sec[data-month="${button.dataset.month}"]`, scroller);
  if (!sec) return;
  setRailMonth(button.dataset.month);
  scroller.scrollTo({ top: sec.offsetTop, behavior: smooth && !reducedMotion.matches ? "smooth" : "auto" });
}
rail.addEventListener("click", (e) => {
  if (scrubbed) return;
  const button = e.target.closest(".mo");
  jumpTo(button, true);
  const first = button && $(`.sec[data-month="${button.dataset.month}"] .card`, scroller);
  if (first) focusCard(first.dataset.id, false);
});
// Dragging along the rail scrubs through the months. The pointer is
// captured only once it leaves the month it pressed: captured at once, the
// click would go to the rail instead of the month and do nothing
let scrubbing = false;
let scrubbed = false;
let pressed = null;
rail.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 || !e.target.closest(".mo")) return;
  scrubbing = true;
  scrubbed = false;
  pressed = e.target.closest(".mo");
});
rail.addEventListener("pointermove", (e) => {
  if (!scrubbing) return;
  if (!(e.buttons & 1)) return endScrub();
  const x = rail.getBoundingClientRect().left + rail.clientWidth / 2;
  const button = document.elementFromPoint(x, e.clientY)?.closest(".mo");
  if (!button || button === pressed || button.dataset.month === railKey) return;
  if (!scrubbed) rail.setPointerCapture(e.pointerId);
  scrubbed = true;
  pressed = null;
  tip.style.display = "none";
  jumpTo(button, false);
});
function endScrub() {
  scrubbing = false;
  pressed = null;
  setTimeout(() => (scrubbed = false));
}
for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) rail.addEventListener(type, endScrub);
// Up and down move between months that have files
rail.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
  const months = $$(".mo:not(:disabled)", rail);
  const next = months[months.indexOf(document.activeElement) + (e.key === "ArrowDown" ? 1 : -1)];
  if (!next) return;
  e.preventDefault();
  next.focus();
  jumpTo(next, true);
});

const tip = $("#tip");
rail.addEventListener("pointerover", (e) => {
  const button = e.target.closest(".mo");
  if (!button) return;
  const box = button.getBoundingClientRect();
  tip.textContent = button.dataset.tip;
  tip.style.display = "block";
  tip.style.left = `${box.left - tip.offsetWidth - 8}px`;
  tip.style.top = `${box.top + box.height / 2 - tip.offsetHeight / 2}px`;
});
rail.addEventListener("pointerout", (e) => {
  if (!e.relatedTarget?.closest?.(".mo")) tip.style.display = "none";
});
// A face over a preview: whose it is, above it
scroller.addEventListener("pointerover", (e) => {
  const face = e.target.closest(".face");
  if (!face) return;
  const box = face.getBoundingClientRect();
  tip.textContent = face.dataset.tip;
  tip.style.display = "block";
  tip.style.left = `${Math.min(innerWidth - tip.offsetWidth - 8, box.left + box.width / 2 - tip.offsetWidth / 2)}px`;
  tip.style.top = `${box.top - tip.offsetHeight - 6}px`;
});
scroller.addEventListener("pointerout", (e) => {
  if (e.target.closest(".face") && !e.relatedTarget?.closest?.(".face")) tip.style.display = "none";

scroller.addEventListener("scroll", () => (tip.style.display = "none"), { passive: true });

/* Selection and focus */

const cardEl = (id) => document.getElementById("c-" + id);
function selection() {
  if (state.sel.size) return order.filter((id) => state.sel.has(id));
  return state.focus && order.includes(state.focus) ? [state.focus] : [];
}
function setSel(ids, anchor) {
  state.sel = new Set(ids);
  if (anchor !== undefined) state.anchor = anchor;
  for (const el of $$(".card[data-id]", scroller)) el.setAttribute("aria-selected", state.sel.has(el.dataset.id));
  renderSelbar();
}
function focusCard(id, scroll = true) {
  const el = cardEl(id);
  if (!el) return;
  const previous = state.focus && cardEl(state.focus);
  if (previous) previous.tabIndex = -1;
  for (const other of $$('.card[tabindex="0"]', scroller)) other.tabIndex = -1;
  state.focus = id;
  el.tabIndex = 0;
  el.focus({ preventScroll: true });
  if (scroll) el.scrollIntoView({ block: "nearest" });
}
function rangeTo(id) {
  const a = order.indexOf(state.anchor ?? id);
  const b = order.indexOf(id);
  setSel(order.slice(Math.min(a, b), Math.max(a, b) + 1));
}
// The card beside, above or below, by where the cards sit
function neighbor(id, key) {
  const i = order.indexOf(id);
  if (key === "ArrowRight") return order[i + 1];
  if (key === "ArrowLeft") return order[i - 1];
  const step = key === "ArrowDown" ? 1 : -1;
  const box = cardEl(id).getBoundingClientRect();
  const center = box.left + box.width / 2;
  let rowTop = null;
  let best = null;
  let bestDistance = Infinity;
  for (let j = i + step; j >= 0 && j < order.length; j += step) {
    const other = cardEl(order[j]).getBoundingClientRect();
    if (rowTop === null) {
      if (step > 0 ? other.top > box.top + 4 : other.top < box.top - 4) rowTop = other.top;
      else continue;
    }
    if (Math.abs(other.top - rowTop) > 4) break;
    const distance = Math.abs(other.left + other.width / 2 - center);
    if (distance < bestDistance) {
      bestDistance = distance;
      best = order[j];
    }
  }
  return best;
}

/* Actions. Each changes the sample data and offers an undo; the live page
   sends the same changes to Figma */

const snapshot = (ids) => ids.map((id) => ({ ...byId(id) }));
const restoreSnapshot = (snap) => {
  for (const saved of snap) Object.assign(byId(saved.id), saved);
  render();
};
const named = (ids) => (ids.length === 1 ? `“${byId(ids[0]).name}”` : `${ids.length} files`);

// Sends a change to Figma. If Figma refuses it, `rollback` puts the page
// back and the toast says so
function send(request, rollback, what) {
  request.catch((error) => {
    rollback?.();
    render();
    toast(`Couldn't ${what}: ${error.message}`);
  });
  return request;
}
const keysOf = (ids) => ids.map((id) => ({ key: byId(id).key }));

function openFiles(ids, background = false) {
  ids = ids.filter((id) => !byId(id).trashed);
  if (!ids.length) return;
  const now = Date.now();
  if (LIVE) {
    // Home hands Figma links to tabs of their own (tabs.rs)
    for (const id of ids) {
      window.open(fileUrl(byId(id)), "_blank");
      upsertFile(id, { viewedAt: now, recent: true });
    }
    toast(`Opening ${named(ids)}`);
    return render();
  }
  for (const id of ids) Object.assign(byId(id), { at: now, kind: "open", by: "me", unread: 0 });
  toast(background ? `Opened ${named(ids)} in the background` : `Opening ${named(ids)}`);
  render();
}

function toggleStar(ids) {
  const snap = snapshot(ids);
  const star = !ids.every((id) => byId(id).starred);
  for (const id of ids) {
    byId(id).starred = star;
    if (star) Live.starKeys?.add(byId(id).key);
    else Live.starKeys?.delete(byId(id).key);
  }
  if (LIVE) send(api("/api/bulk_favorite_resources_v2", { method: star ? "PUT" : "DELETE", json: { resources: ids.map((id) => ({ file: { key: id } })) } }), () => restoreSnapshot(snap), star ? "star it" : "unstar it");
  toast(star ? `Starred ${named(ids)}` : `Removed ${named(ids)} from starred`, LIVE ? () => toggleStar(ids) : () => restoreSnapshot(snap));
  render();
}

function moveFiles(ids, project) {
  // Drafts are per team: the drafts of the first file's team
  if (LIVE && !project) project = Live.draftsByTeam[byId(ids[0])?.team] ?? DRAFTS()[0];
  ids = ids.filter((id) => byId(id).project !== project);
  if (!ids.length) return;
  const snap = snapshot(ids);
  // Organizing isn't work on the file: it keeps its place in the timeline
  for (const id of ids) byId(id).project = project;
  let undo = () => restoreSnapshot(snap);
  if (LIVE) {
    send(
      api("/api/folder_items/move_bulk", { method: "PUT", json: { folder: { parent_folder_id: project }, folder_items: ids.map((id) => ({ file: { key: id } })) } }).then((meta) => {
        const failed = (meta?.results ?? []).filter((r) => r && r.success === false).length;
        if (failed) throw new Error(`${failed} of them can't move there`);
      }),
      () => restoreSnapshot(snap),
      "move it",
    );
    // Back where each came from
    undo = () => {
      const back = {};
      for (const saved of snap) (back[saved.project] ??= []).push(saved.id);
      for (const [from, group] of Object.entries(back)) moveFiles(group, from === "null" ? null : from);
    };
  }
  toast(`Moved ${named(ids)} to ${placeOf(project)}`, undo);
  render();
}

function trashFiles(ids) {
  if (!ids.length) return;
  const snap = snapshot(ids);
  for (const id of ids) Object.assign(byId(id), { trashed: true, trashedAt: Date.now() });
  state.sel.clear();
  if (LIVE) {
    send(api("/api/files_batch", { method: "DELETE", json: { files: keysOf(ids), trashed: true } }), () => restoreSnapshot(snap), "delete it");
    rememberTrash();
  }
  toast(`Moved ${named(ids)} to the trash`, LIVE ? () => restoreFiles(ids) : () => restoreSnapshot(snap));
  render();
}

function restoreFiles(ids) {
  const snap = snapshot(ids);
  for (const id of ids) byId(id).trashed = false;
  if (LIVE) {
    send(api("/api/files_batch/restore", { method: "POST", json: { files: keysOf(ids), batch_fail_on_file_limit: true } }), () => restoreSnapshot(snap), "restore it");
    rememberTrash();
  }
  toast(`Restored ${named(ids)}`, LIVE ? () => trashFiles(ids) : () => restoreSnapshot(snap));
  render();
}

function deleteForever(ids) {
  if (LIVE) {
    // Figma can't bring these back, so ask first
    if (!window.confirm(`Delete ${named(ids)} for good? This can't be undone.`)) return;
    const gone = ids.map((id) => byId(id));
    for (const file of gone) {
      FILES.splice(FILES.indexOf(file), 1);
      BY_ID.delete(file.id);
    }
    state.sel.clear();
    send(api("/api/files_batch", { method: "DELETE", json: { files: gone.map((f) => ({ key: f.key })), trashed: false } }), () => gone.forEach((f) => addFile(f)), "delete it for good");
    rememberTrash();
    toast(`Deleted ${gone.length === 1 ? `“${gone[0].name}”` : `${gone.length} files`} for good`);
    return render();
  }
  const removed = ids.map((id) => [FILES.indexOf(byId(id)), byId(id)]);
  for (const [, file] of removed) {
    FILES.splice(FILES.indexOf(file), 1);
    BY_ID.delete(file.id);
  }
  state.sel.clear();
  toast(`Deleted ${removed.length === 1 ? `“${removed[0][1].name}”` : `${removed.length} files`} for good`, () => {
    for (const [index, file] of removed.sort((a, b) => a[0] - b[0])) {
      FILES.splice(index, 0, file);
      BY_ID.set(file.id, file);
    }
    render();
  });
  render();
}

function duplicate(ids) {
  if (LIVE) {
    toast(ids.length === 1 ? "Making a copy" : `Making ${ids.length} copies`);
    Promise.all(ids.map((id) => api(`/api/multiplayer/${id}/copy?folder_id=${encodeURIComponent(byId(id).project ?? "")}`, { method: "POST" })))
      .then((metas) => {
        const copies = metas.map((m) => upsertFile(m.key, { ...fromRest(m), touchedAt: Date.now(), viewedAt: Date.now(), recent: true }));
        state.sel = new Set(copies.map((f) => f.id));
        state.focus = copies[0]?.id;
        toast(`Made ${copies.length === 1 ? "a copy" : `${copies.length} copies`}`, () => trashFiles(copies.map((f) => f.id)));
        render();
      })
      .catch((error) => toast(`Couldn't copy it: ${error.message}`));
    return;
  }
  const copies = ids.map((id) => {

  });
  state.focus = copies[0].id;
  state.sel = new Set(copies.map((f) => f.id));
  toast(`Made ${copies.length === 1 ? "a copy" : `${copies.length} copies`}`, () => {
    for (const copy of copies) {
      FILES.splice(FILES.indexOf(copy), 1);

const fileUrl = (file) => `https://www.figma.com/${URL_PATHS[file.editor] ?? { design: "design", figjam: "board", slides: "slides" }[file.type]}/${file.key}/${encodeURIComponent(file.name.replace(/\s+/g, "-"))}`;

function teamById(id) {

function toggleTeamStar(id) {

function currentTeam() {

// New project: a name field where the menu was
function newProject(at, teamId = currentTeam()) {
  const found = teamById(teamId);
  if (!found) return;
  closeMenu();
  menuReturn = document.activeElement;
  menu.classList.remove("big");
  menu.innerHTML = `<input type="text" aria-label="Project name" placeholder="New project in ${esc(found.team.name)}" spellcheck="false">`;
  const input = $("input", menu);
  menuItems = [];
  menuKeys = (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      const name = input.value.trim();
      closeMenu();
      if (name) createProject(teamId, name);
      return true;
    }
    return e.key.length === 1 || e.key === "Backspace";
  };

function createProject(teamId, name) {
  const { team } = teamById(teamId);
  const add = (id, label) => {
    team.projects.push([id, label]);
    PROJECTS[id] = { id, name: label, team, plan: teamById(teamId).plan };
    state.collapsed.delete(teamId);
    if (LIVE) Live.ready.add("p:" + id);
    go("p:" + id);
    toast(`Made the project ${label}`);
  };
  if (!LIVE) return add("p" + nextId++, name);
  api("/api/folders", { method: "POST", json: { path: name, team_id: teamId, sharing_audience_control: "plan_edit" } })
    .then((meta) => {
      const folder = meta.folder ?? meta;
      add(folder.id, folder.name ?? folder.path ?? name);
    })
    .catch((error) => toast(`Couldn't make it: ${error.message}`));
}

function rename(id) {
  const file = byId(id);
  const label = $(".nm", cardEl(id));
  if (!file || !label) return;
  const input = document.createElement("input");
  input.value = file.name;
  input.setAttribute("aria-label", "File name");
  label.replaceChildren(input);
  input.focus();
  input.select();
  let done = false;
  const finish = (save) => {
    if (done) return;
    done = true;
    const name = input.value.trim();
    if (save && name && name !== file.name) {
      const snap = snapshot([id]);
      const old = file.name;
      file.name = name;
      const put = (to) => send(api(`/api/files/${file.key}`, { method: "PUT", json: { name: to } }), () => restoreSnapshot(snap), "rename it");
      if (LIVE) put(name);
      toast(`Renamed to “${name}”`, () => {
        restoreSnapshot(snap);
        if (LIVE) put(old);
      });
    }
    render();
    focusCard(id, false);
  };
  input.addEventListener("keydown", (e) => {
    e.stopPropagation();
    if (e.key === "Enter") finish(true);
    if (e.key === "Escape") finish(false);
  });
  input.addEventListener("blur", () => finish(true));
}

function go(view) {
  if (!viewName(view)) return;
  state.view = view;
  state.sel.clear();
  state.focus = null;
  document.body.classList.remove("side-open");
  render({ keepScroll: false });
  scroller.scrollTop = 0;
}

const noteFile = (note) => byId(note.fileKey ?? note.file) ?? null;
const teamColor = (name) => Object.values(PROJECTS).find((p) => p.team.name === name)?.team.color ?? "#757575";

// Figma's bell, read as its own panel reads it. Its text comes as HTML;
// only bold survives here
const NOTE_KINDS = { AtMentionCommentNotif: "mention", FileCommentReplyNotifV2: "reply", FileCommentNotifV2: "comment", BatchedFileCommentNotif: "comment" };
const ENTITIES = { amp: "&", lt: "<", gt: ">", quot: '"', "#39": "'", apos: "'", nbsp: " " };
const strip = (html) => String(html ?? "").replace(/<br\s*\/?>/gi, " ").replace(/<[^>]+>/g, "").replace(/&(amp|lt|gt|quot|#39|apos|nbsp);/g, (_, e) => ENTITIES[e]);
const boldOnly = (html) => esc(strip(String(html ?? "").replace(/<b>/gi, "\u0001").replace(/<\/b>/gi, "\u0002"))).replace(/\u0001/g, "<b>").replace(/\u0002/g, "</b>");
let notesTimer = 0;
// Figma can't mark a notification unread again, so Ligma remembers which
// ones you did
const localUnread = new Set();
const saveLocalUnread = () => store.set(`unread:${Live.uid}`, [...localUnread]);
async function loadNotes() {
  try {
    if (!localUnread.size) for (const id of store.get(`unread:${Live.uid}`, [])) localUnread.add(id);
    const params = new URLSearchParams({ currentView: "fullscreen", appVersion: "1", clientType: "web", current_plan_id: "-1", is_plan_org: "false" });
    const items = await api(`/api/user_notifications/server_driven/plan?${params}`);
    NOTES.splice(0);
    for (const file of FILES) file.unread = 0;
    for (const item of Array.isArray(items) ? items : []) {
      const attachment = item.preferred_attachments?.[0];
      const body = attachment?.body ?? {};
      const html = (blocks) => (blocks ?? []).map((b) => b?.html_text ?? "").join(" ");
      const type = item.notification_type ?? "";
      const href = item.deeplink?.href ?? attachment?.deeplink?.href ?? null;
      // The title is who it's from, sometimes as their email; the avatar
      // has their name. The subtitle says what happened and where
      const email = (t) => /^[^\s@]+@[^\s@]+$/.test(t);
      let who = strip(html(body.title)).trim();
      if (email(who)) who = Live.users.find((u) => u.email === who)?.name ?? (email(item.avatars?.[0]?.fallback_text ?? "") ? who : item.avatars?.[0]?.fallback_text) ?? who;
      const parts = (body.subtitle ?? []).map((b) => strip(b?.html_text).trim()).filter((t) => t && t !== "·");
      const note = {
        id: item.notification_id,
        live: true,
        kind: NOTE_KINDS[type] ?? (/Invite/.test(type) ? "invite" : /Request(?!Approved)/.test(type) ? "request" : "other"),
        who,
        action: parts[0] ?? "",
        target: parts.slice(1).join(" · "),
        title: esc(who),
        about: /Team/.test(type) ? "team" : /Folder|Project/.test(type) ? "folder" : null,
        serverUnread: !!item.is_unread,
        text: strip(html(body.description)).trim(),
        href,
        fileKey: href?.match(/\/(?:design|file|board|slides|proto|deck|make|site|buzz)\/([A-Za-z0-9]{22})/)?.[1] ?? null,
        avatar: item.avatars?.[0]?.img_url ?? null,
        initial: (item.avatars?.[0]?.fallback_text ?? "?").trim()[0] ?? "?",
        icon: item.icon?.img_url ?? null,
        at: Date.parse(body.created_at) || Date.now(),
        unread: !!item.is_unread || localUnread.has(item.notification_id),
        count: 1,
        done: null,
      };
      NOTES.push(note);
      const file = byId(note.fileKey);
      if (note.unread && file && ABOUT_COMMENTS.has(note.kind)) file.unread += 1;
    }
  } catch (error) {
    // Again shortly; the bell keeps what it had meanwhile
    console.warn("Ligma home: couldn't load notifications", error);
    setTimeout(loadNotes, 5000);
  }
  notesTimer ||= setInterval(() => document.visibilityState === "visible" && loadNotes(), 60000);
  render();
}

function setUnread(note, unread) {
  if (note.unread === unread) return;
  note.unread = unread;
  const file = noteFile(note);
  if (file && ABOUT_COMMENTS.has(note.kind)) file.unread = Math.max(0, file.unread + (unread ? note.count : -note.count));
  if (!note.live) return;
  unread ? localUnread.add(note.id) : localUnread.delete(note.id);
  saveLocalUnread();
  if (!unread && note.serverUnread && !note.bulk) {
    note.serverUnread = false;
    api("/api/user_notifications/read", { method: "PUT", json: { id: note.id, currentView: "fullscreen", medium: "web", appVersion: "1", clientType: "web" } }).catch(() => toast("Couldn't mark it read in Figma"));
  }
}
function markRead(notes, read) {
  if (!notes.length) return;
  if (LIVE) {
    const all = read && notes.length > 1;
    const before = notes.map((n) => [n, n.unread]);
    for (const note of notes) {
      note.bulk = all;
      if (all) note.serverUnread = false;
      setUnread(note, !read);
      note.bulk = false;
    }
    if (all) api("/api/user_notifications/mark_read/plan", { method: "POST", json: { current_plan_id: "-1", currentView: "fullscreen", is_plan_org: false, source: "web" } }).catch(() => toast("Couldn't mark them read in Figma"));
    const what = notes.length === 1 ? "" : ` ${notes.length} notifications`;
    toast(`Marked${what} as ${read ? "read" : "unread"}`, () => {
      for (const [note, unread] of before) setUnread(note, unread);
      render();
    });
    return render();
  }
  const before = notes.map((n) => [n, n.unread]);
  for (const note of notes) setUnread(note, !read);
  const what = notes.length === 1 ? "" : ` ${notes.length} notifications`;
  toast(`Marked${what} as ${read ? "read" : "unread"}`, () => {
    for (const [note, unread] of before) setUnread(note, unread);
    render();
  });
  render();
}
function openNote(note) {
  const file = noteFile(note);
  setUnread(note, false);
  if (note.live) {
    if (note.href) window.open(note.href, "_blank");
    if (file) upsertFile(file.key, { viewedAt: Date.now(), recent: true });
    toast(file ? `Opening “${file.name}”` : "Opening in Figma");
    return render();
  }
  if (!file) {
    toast(`Opening the ${note.team} team in Figma`);
    return render();
  }
  Object.assign(file, { at: Date.now(), kind: "open", by: "me" });
  toast(`Opening “${file.name}”${ABOUT_COMMENTS.has(note.kind) ? ` at ${firstName(note.by)}'s comment` : ""}`);
  render();
}
// Approve or deny an edit request, join or decline a team
function answer(note, act) {
  const file = noteFile(note);
  const person = PEOPLE[note.by].name;
  const outcome = {
    approve: ["Approved", `${person} can now edit “${file?.name}”`],
    deny: ["Denied", `Denied ${person}'s request`],
    accept: ["Joined", `Joined ${note.team}`],
    decline: ["Declined", `Declined the invite to ${note.team}`],
  }[act];
  if (!outcome) return;
  const was = note.unread;
  setUnread(note, false);
  note.done = outcome[0];
  toast(outcome[1], () => {
    note.done = null;
    setUnread(note, was);
    render();
  });
  render();
}

function noteRow(note) {
  const file = noteFile(note);
  if (note.live) {
    // The file's own picture where there is one; Figma's icons for the
    // rest are drawn for a light ground, so these are Ligma's
    const key = note.fileKey;
    const url = file?.thumbUrl ?? (key && LG.store.File?.[key]?.$?.signedThumbnailUrl);
    if (key && !url) LG.wantThumb(key);
    const pic = key
      ? `<div class="pt nt" aria-hidden="true" data-note-key="${esc(key)}">${url ? `<img src="${esc(url)}" alt="" referrerpolicy="no-referrer">` : `<div class="tph"></div>`}</div>`
      : `<div class="pt nt ni" aria-hidden="true">${icon(note.about === "team" ? "users" : note.about === "folder" ? "folder" : "bell")}</div>`;
    const face = note.avatar ? `<img src="${esc(note.avatar)}" alt="" referrerpolicy="no-referrer">` : esc(note.initial);
    // As Figma's bell words it: who, then what happened and where
    const line = `<b>${esc(note.who)}</b>`;
    const what = [note.action, note.target].filter(Boolean).join(" · ");
    const where = what ? `<span class="nwhere">${esc(what)}</span>` : "";
    const label = (note.unread ? "Unread. " : "") + `${note.who} ${note.action} ${note.target}`.trim() + ", " + short(note.at);
    const read = `<button class="tool rd" data-note-act="read" tabindex="-1" aria-label="Mark as ${note.unread ? "read" : "unread"}" title="Mark as ${note.unread ? "read" : "unread"} (U)">${icon(note.unread ? "check" : "bell")}</button>`;
    return `<div class="note${note.unread ? " unread" : ""}" role="option" id="nt-${esc(note.id)}" data-note="${esc(note.id)}" tabindex="-1" aria-selected="${state.noteFocus === note.id}" aria-label="${esc(label)}">
      <span class="ud" aria-hidden="true"></span><span class="av lg" aria-hidden="true" style="background:${colorForTeam(note.initial)}">${face}</span>
      <div class="nb"><div class="nl">${line}<span class="nw">${esc(short(note.at))}</span></div>${where}${note.text ? `<p class="quote">${esc(note.text)}</p>` : ""}</div>${pic}${read}</div>`;
  }
  const who = PEOPLE[note.by];
  const name = `<b>${esc(who.name)}</b>`;
  const target = `<b>${esc(file ? file.name : note.team)}</b>`;
  const line = {
    comment: `${name} commented on ${target}`,
    reply: `${name} replied to you in ${target}`,
    mention: `${name} mentioned you in ${target}`,
    request: `${name} asked to edit ${target}`,
    "invite-file": `${name} invited you to edit ${target}`,
    "invite-team": `${name} invited you to the ${target} team`,
  }[note.kind];
  const quote = note.text ? `<p class="quote">${esc(note.text)}</p>` : "";
  const more = note.count > 1 ? `<span class="nmore">and ${note.count - 1} more ${note.count === 2 ? "comment" : "comments"}</span>` : "";
  let acts = "";
  if (note.done) acts = `<span class="done">${icon("check")}${esc(note.done)}</span>`;
  else if (note.kind === "request") acts = `<div class="nacts"><button class="btn sm primary" data-note-act="approve">Approve</button><button class="btn sm" data-note-act="deny">Deny</button></div>`;
  else if (note.kind === "invite-team") acts = `<div class="nacts"><button class="btn sm primary" data-note-act="accept">Join team</button><button class="btn sm" data-note-act="decline">Decline</button></div>`;
  const pic = file ? `<div class="pt nt" aria-hidden="true">${thumb(file)}</div>` : `<span class="tm nt" aria-hidden="true" style="background:${teamColor(note.team)}">${esc(note.team[0])}</span>`;
  const label = (note.unread ? "Unread. " : "") + line.replace(/<[^>]+>/g, "") + ", " + short(note.at);
  return `<div class="note${note.unread ? " unread" : ""}" role="option" id="nt-${note.id}" data-note="${note.id}" tabindex="-1" aria-selected="${state.noteFocus === note.id}" aria-label="${esc(label)}">
    <span class="ud" aria-hidden="true"></span><span class="av lg" aria-hidden="true" style="background:${who.color}">${esc(who.name[0])}</span>
    <div class="nb"><div class="nl">${line}<span class="nw">${esc(short(note.at))}</span></div>${quote}${more}${acts}</div>
    ${pic}<button class="tool rd" data-note-act="read" tabindex="-1" aria-label="Mark as ${note.unread ? "read" : "unread"}" title="Mark as ${note.unread ? "read" : "unread"} (U)">${icon(note.unread ? "check" : "bell")}</button></div>`;
}

// The inbox is a window under the bell beside the account menu
const inboxEl = $("#inbox");
let bellReturn = null;

function drawInbox() {
  const show = { unread: (n) => n.unread, mentions: (n) => n.kind === "mention" || n.kind === "reply", requests: (n) => n.kind === "request" || n.kind.startsWith("invite") }[state.inbox] ?? (() => true);
  const notes = NOTES.filter(show).sort((a, b) => b.at - a.at);
  const unread = NOTES.filter((n) => n.unread).length;
  const kinds = [["all", "All"], ["unread", "Unread"], ["mentions", "Mentions"], ["requests", "Requests"]];
  let html = `<div class="ih"><h2 id="inbox-title">Inbox</h2><small>${unread ? `${unread} unread` : ""}</small><span class="grow"></span>`;
  html += `<button class="ib" data-act="read-all" ${unread ? "" : "disabled"}>${icon("check")}Mark all as read</button>`;
  html += `<button class="ib x" data-act="close" aria-label="Close">${icon("x")}</button></div>`;
  html += `<div class="if"><div class="seg" role="group" aria-label="Show">${kinds.map(([id, label]) => `<button data-inbox="${id}" aria-pressed="${state.inbox === id}">${label}</button>`).join("")}</div></div><div class="il">`;
  if (!notes.length) {
    const caughtUp = state.inbox === "all" || state.inbox === "unread";
    html += `<div class="iempty">${icon("bell")}<b>${caughtUp ? "You're all caught up" : "Nothing here"}</b><span>Comments, replies, mentions and invites from Figma land here</span></div>`;
  } else {
    let last = null;
    for (const note of notes) {
      const b = bucket(note.at);
      if (b.key !== last) {
        if (last) html += `</div>`;
        last = b.key;
        html += `<h3>${esc(b.label)}</h3><div role="listbox" aria-label="${esc(b.label)}">`;
      }
      html += noteRow(note);
    }
    html += `</div>`;
  }
  const had = inboxEl.contains(document.activeElement);
  const scrollTop = $(".il", inboxEl)?.scrollTop ?? 0;
  inboxEl.innerHTML = html + `</div>`;
  $(".il", inboxEl).scrollTop = scrollTop;
  const row = (state.noteFocus && document.getElementById("nt-" + state.noteFocus)) || $(".note", inboxEl);
  if (row) {
    state.noteFocus = row.dataset.note;
    row.tabIndex = 0;
    row.setAttribute("aria-selected", "true");
    if (had && !document.activeElement?.closest?.("#inbox")) row.focus({ preventScroll: true });
  }
}

function openInbox() {
  closeMenu();
  if (pal.open) pal.close();
  bellReturn = document.activeElement;
  inboxEl.classList.add("open");
  drawInbox();
  renderSide();
  const bell = $("#bell").getBoundingClientRect();
  inboxEl.style.top = `${bell.bottom + 6}px`;
  inboxEl.style.left = `${Math.max(8, Math.min(bell.left - 8, innerWidth - inboxEl.offsetWidth - 8))}px`;
  ($(".note", inboxEl) ?? inboxEl).focus({ preventScroll: true });
}
function closeInbox(restore = true) {
  if (!inboxEl.classList.contains("open")) return;
  inboxEl.classList.remove("open");
  renderSide();
  if (restore) ($("#bell") ?? bellReturn)?.focus({ preventScroll: true });
}

inboxEl.addEventListener("click", (e) => {
  const kind = e.target.closest("[data-inbox]");
  if (kind) {
    state.inbox = kind.dataset.inbox;
    state.noteFocus = null;
    return drawInbox();
  }
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "read-all") return markRead(NOTES.filter((n) => n.unread), true);
  if (act === "close") return closeInbox();
  const row = e.target.closest(".note[data-note]");
  if (!row) return;
  const note = NOTES.find((n) => n.id === row.dataset.note);
  focusNote(note.id);
  const noteAct = e.target.closest("[data-note-act]")?.dataset.noteAct;
  if (noteAct === "read") markRead([note], note.unread);
  else if (noteAct) answer(note, noteAct);
  else if (!e.target.closest("button")) {
    closeInbox(false);
    openNote(note);
  }
});
inboxEl.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    e.preventDefault();
    closeInbox();
  } else if (e.target.closest(".note") || e.target === inboxEl) inboxKeys(e);
});
addEventListener("pointerdown", (e) => {
  if (!inboxEl.classList.contains("open") || inboxEl.contains(e.target) || e.target.closest?.("#bell, #toast, .menu")) return;
  closeInbox(false);
}, true);
addEventListener("resize", () => closeInbox(false));

function focusNote(id, scroll = false) {
  state.noteFocus = id;
  for (const row of $$(".note", inboxEl)) {
    row.tabIndex = row.dataset.note === id ? 0 : -1;
    row.setAttribute("aria-selected", row.dataset.note === id);
  }
  const el = document.getElementById("nt-" + id);
  el?.focus({ preventScroll: true });
  if (scroll) el?.scrollIntoView({ block: "nearest" });
}
function inboxKeys(e) {
  const rows = $$(".note", inboxEl);
  if (!rows.length) return;
  const i = Math.max(0, rows.findIndex((r) => r.dataset.note === state.noteFocus));
  const note = NOTES.find((n) => n.id === rows[i].dataset.note);
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const to = (j) => focusNote(rows[Math.min(rows.length - 1, Math.max(0, j))].dataset.note, true);
  if (key === "ArrowDown" || key === "ArrowUp") {
    e.preventDefault();
    to(i + (key === "ArrowDown" ? 1 : -1));
  } else if (key === "Home" || key === "End") {
    e.preventDefault();
    to(key === "Home" ? 0 : rows.length - 1);
  } else if (key === "Enter") {
    e.preventDefault();
    closeInbox(false);
    openNote(note);
  } else if (key === "u" && !e.ctrlKey && !e.metaKey && !e.altKey) markRead([note], note.unread);

/* Toast and selection bar */

const toastEl = $("#toast");
let toastTimer = 0;
let toastUndo = null;
function toast(message, undo) {
  clearTimeout(toastTimer);
  toastUndo = undo ?? null;
  toastEl.innerHTML = `<span>${esc(message)}</span>${undo ? `<button class="undo" data-act="undo">Undo</button>` : ""}<button class="x" data-act="dismiss" aria-label="Dismiss">${icon("x")}</button>`;
  toastEl.hidden = false;
  toastEl.classList.remove("in");

  toastEl.classList.add("in");

  toastTimer = setTimeout(hideToast, toastLife);
}
let toastLife = 0;
const hideToast = () => {
  toastEl.hidden = true;
  toastUndo = null;
};
// Held open while the pointer or focus is on it
for (const [type, run] of [["pointerenter", false], ["focusin", false], ["pointerleave", true], ["focusout", true]]) {
  toastEl.addEventListener(type, () => {
    clearTimeout(toastTimer);
    if (run && !toastEl.matches(":hover, :focus-within")) toastTimer = setTimeout(hideToast, toastLife);
  });
}
toastEl.addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act;

const selbar = $("#selbar");
function renderSelbar() {
  const ids = order.filter((id) => state.sel.has(id));
  const show = ids.length > 1;
  toastEl.classList.toggle("solo", !show);
  if (!show) {
    selbar.hidden = true;
    return;
  }
  const trash = inTrash();
  const buttons = trash
    ? `<button data-a="restore">Restore</button><button data-a="forever">Delete forever</button>`
    : `<button data-a="open">Open</button><button data-a="star">${ids.every((id) => byId(id).starred) ? "Unstar" : "Star"}</button><button data-a="move">Move to…</button><button data-a="trash">Move to trash</button>`;
  const wasHidden = selbar.hidden;
  selbar.innerHTML = `<span>${ids.length} selected</span>${buttons}<button class="x" data-a="clear" aria-label="Clear selection">${icon("x")}</button>`;
  selbar.hidden = false;

    selbar.classList.add("in");

}
selbar.addEventListener("click", (e) => {
  const button = e.target.closest("[data-a]");
  if (!button) return;
  const ids = selection();
  const act = button.dataset.a;
  if (act === "open") openFiles(ids);
  else if (act === "star") toggleStar(ids);
  else if (act === "move") openMover(ids, button.getBoundingClientRect(), true);
  else if (act === "trash") trashFiles(ids);
  else if (act === "restore") restoreFiles(ids);
  else if (act === "forever") deleteForever(ids);
  else if (act === "clear") setSel([]);
});

/* Menus */

const menu = $("#menu");
let menuItems = [];
let menuIndex = -1;
let menuReturn = null;
let menuKeys = null;

function placeMenu(at, above = false) {
  menu.classList.add("open");
  const { innerWidth: w, innerHeight: h } = window;
  const rect = at instanceof DOMRect ? at : null;
  let x = rect ? rect.left : at.x;
  let y = rect ? (above ? rect.top - menu.offsetHeight - 8 : rect.bottom + 4) : at.y;
  if (x + menu.offsetWidth > w - 8) x = (rect ? rect.right : at.x) - menu.offsetWidth;
  if (y + menu.offsetHeight > h - 8) y = (rect ? rect.top - 4 : at.y) - menu.offsetHeight;
  menu.style.left = `${Math.max(8, x)}px`;
  menu.style.top = `${Math.max(8, y)}px`;
}

// items: { label, detail, kbd, act, checked, disabled, ext, swatch, iconHtml, sub } | { header } | { html } | null.
// detail is a second line under the label; sub, items of a menu that opens
// beside this one; html, a row of its own that isn't an item
function menuRows(items, list, prefix, checks = items.some((item) => item && "checked" in item)) {
  return items.map((item) => {
    if (!item) return `<div class="msep" role="separator"></div>`;
    if (item.header) return `<div class="mh">${esc(item.header)}</div>`;
    if (item.html) return item.html;
    const i = list.push(item) - 1;
    const radio = checks && "checked" in item;
    const check = checks ? `<span class="ck">${fig("check")}</span>` : "";
    const swatch = item.swatch ? `<span class="sw" style="background:${item.swatch}"></span>` : "";
    const tail = item.sub ? `<span class="x">${fig("right")}</span>` : item.kbd ? `<span class="k">${esc(item.kbd)}</span>` : item.ext ? `<span class="x">${fig("ext")}</span>` : "";
    const label = item.detail ? `<span class="two"><span>${esc(item.label)}</span><small>${esc(item.detail)}</small></span>` : esc(item.label);
    return `<button class="mi${item.detail ? " tall" : ""}" id="${prefix}${i}" tabindex="-1" role="${radio ? "menuitemradio" : "menuitem"}" data-i="${i}" ${radio ? `aria-checked="${!!item.checked}"` : ""} ${item.sub ? 'aria-haspopup="menu" aria-expanded="false"' : ""} ${item.disabled ? 'aria-disabled="true"' : ""}>${check}${swatch}${item.iconHtml ? `<span class="mic">${item.iconHtml}</span>` : ""}${label}${tail}</button>`;
  }).join("");
}
function showMenu(items, at, options = {}) {
  closeMenu();
  menuReturn = document.activeElement;
  menuKeys = null;
  menuItems = [];
  menu.innerHTML = menuRows(items, menuItems, "mi", options.checks);
  menuIndex = -1;
  menu.classList.toggle("big", !!options.big);
  menu.classList.toggle("account", !!options.account);
  placeMenu(at, options.above);
  menu.focus();
}
function closeMenu() {
  closeSub();
  if (!menu.classList.contains("open")) return;
  menu.classList.remove("open");

function openMover(ids, at, above = false) {
  const current = new Set(ids.map((id) => byId(id).project ?? null));
  const targets = [{ project: null, label: "Drafts", where: "" }];
  for (const plan of PLANS) for (const team of plan.teams) for (const [id, name] of team.projects) targets.push({ project: id, label: name, where: team.name });
  closeMenu();
  menuReturn = document.activeElement;
  menu.innerHTML = `<input type="text" role="combobox" aria-expanded="true" aria-controls="mlist" aria-autocomplete="list" placeholder="Move ${esc(named(ids))} to…" aria-label="Project" spellcheck="false"><div class="mlist" id="mlist" role="listbox" aria-label="Projects"></div>`;
  const input = $("input", menu);

    const q = input.value.trim();
    const shown = targets.map((t) => ({ t, m: q ? match(q, `${t.label} ${t.where}`) : { score: 0 } })).filter((x) => x.m).sort((a, b) => b.m.score - a.m.score);

// Letters of `query` in order in `text`; more for runs, word starts and
// whole substrings. Each word of the query has to match
function match(query, text) {
  const lower = text.toLowerCase();
  let total = 0;
  const hits = new Set();
  for (const word of query.toLowerCase().split(/\s+/).filter(Boolean)) {
    let score = 0;
    let at = 0;
    let last = -2;
    const local = [];
    for (let j = 0; j < lower.length && at < word.length; j++) {
      if (lower[j] !== word[at]) continue;
      score += (j === last + 1 ? 3 : 1) + (j === 0 || /[\s—\-_./(]/.test(lower[j - 1]) ? 4 : 0);
      local.push(j);
      last = j;
      at++;
    }
    if (at < word.length) return null;
    const sub = lower.indexOf(word);
    if (sub >= 0) {
      score += 8 + (sub === 0 ? 6 : 0);
      local.length = 0;
      for (let k = 0; k < word.length; k++) local.push(sub + k);
    }
    local.forEach((j) => hits.add(j));
    total += score;
  }
  return { score: total - lower.length * 0.02, hits };
}
function marked(text, hits) {
  if (!hits?.size) return esc(text);
  let out = "";
  for (let i = 0; i < text.length; i++) out += hits.has(i) ? `<b>${esc(text[i])}</b>` : esc(text[i]);
  return out.replace(/<\/b><b>/g, "");
}

  palChips.innerHTML = chips.map((chip, i) => `<span class="chip"><i>${chip.key}:</i>${esc(chip.label)}<button data-chip="${i}" aria-label="Remove ${chip.key} ${esc(chip.label)}">${icon("x")}</button></span>`).join("");
  const live = FILES.filter((f) => !f.trashed);
  const scoped = live.filter((f) => chips.every((c) => (c.key === "in" ? f.project === c.value : c.key === "type" ? f.type === c.value : f.by === c.value)));
  const recency = (f) => 3 * Math.exp(-(Date.now() - f.at) / (7 * DAY));

  if (scope) {
    const options = SCOPES[scope.key].options()
      .map((o) => ({ o, m: scope.q ? match(scope.q, o.label) : { score: 0 } }))
      .filter((x) => x.m)
      .sort((a, b) => b.m.score - a.m.score)
      .slice(0, 9);
    html += `<div class="ph">${SCOPES[scope.key].title}<small>Tab or Enter to add</small></div>`;
    options.forEach(({ o, m }) => {
      const i = items.push({ kind: "scope", key: scope.key, value: o.value, label: o.label, start: scope.start }) - 1;
      html += row(i, icon(scope.key === "in" ? "folder" : scope.key === "by" ? "users" : "file"), marked(o.label, m.hits), o.where ? `<span class="pp">${esc(o.where)}</span>` : "");
    });
    if (!options.length) html += `<div class="pmsg">Nothing called <b>${esc(scope.q)}</b></div>`;
  } else if (!query && !chips.length) {
    palBody.classList.add("split");
    let left = `<div class="ph">Recent</div>`;
    live.slice().sort((a, b) => b.at - a.at).slice(0, 8).forEach((file) => {
      const i = items.push({ kind: "file", id: file.id }) - 1;
      left += fileRow(file, i);
    });
    let right = `<div class="ph">Starred</div>`;
    live.filter((f) => f.starred).sort((a, b) => b.at - a.at).slice(0, 5).forEach((file) => {
      const i = items.push({ kind: "file", id: file.id }) - 1;
      right += row(i, glyph(file.type), esc(file.name));
    });
    right += `<div class="ph">Create</div>`;
    for (const type of Object.keys(TYPES)) {
      const i = items.push({ kind: "create", type, name: "Untitled" }) - 1;
      right += row(i, glyph(type), `New ${TYPES[type].noun}`);
    }
    right += `<div class="ph">Narrow down</div><div class="scopes">${Object.keys(SCOPES).map((key) => `<button data-scope="${key}">${key}:</button>`).join("")}</div>`;
    html = `<div>${left}</div><div>${right}</div>`;
  } else {
    searchFigma(query);
    const files = scoped
      .map((file) => ({ file, m: query ? match(query, file.name) ?? (match(query, `${file.name} ${placeOf(file.project)}`) && { score: -4, hits: null }) ?? (file.found === query && { score: -6, hits: null }) : { score: 0 } }))
      .filter((x) => x.m)
      .sort((a, b) => b.m.score + recency(b.file) - (a.m.score + recency(a.file)));
    if (files.length) {
      html += `<div class="ph">Files<small>${files.length > 8 ? `8 of ${files.length}` : files.length}</small></div>`;
      files.slice(0, 8).forEach(({ file, m }) => {
        const i = items.push({ kind: "file", id: file.id }) - 1;
        html += fileRow(file, i, m.hits);
      });
    }
    const inChip = chips.find((c) => c.key === "in");
    if (query && !inChip) {
      const projects = Object.values(PROJECTS).map((p) => ({ p, m: match(query, p.name) })).filter((x) => x.m).sort((a, b) => b.m.score - a.m.score).slice(0, 3);
      if (projects.length) {
        html += `<div class="ph">Projects</div>`;
        for (const { p, m } of projects) {
          const i = items.push({ kind: "view", view: "p:" + p.id }) - 1;
          html += row(i, icon("folder"), marked(p.name, m.hits), `<span class="pp">${esc(p.team.name)}</span>`);
        }
      }
    }
    if (!files.length) html = `<div class="pmsg">No files match <b>${esc(query || "these filters")}</b>${chips.length ? " with these filters" : ""}</div>` + html;
    html += `<div class="ph">Actions</div>`;
    if (query) {
      const where = inChip ? inChip.value : state.view.startsWith("p:") ? state.view.slice(2) : null;
      for (const type of ["design", "figjam"]) {
        const i = items.push({ kind: "create", type, name: query, project: where }) - 1;
        html += row(i, icon("plus"), `New ${TYPES[type].noun} “${esc(query)}”`, `<span class="pp">in ${esc(placeOf(where))}</span>`);
      }
    }
    const commands = COMMANDS.map((c) => ({ c, m: query ? match(query, c.label) : { score: 0 } })).filter((x) => x.m).slice(0, query ? 3 : 4);
    for (const { c, m } of commands) {
      const i = items.push({ kind: "command", command: c }) - 1;
      html += row(i, icon(c.icon), marked(c.label, m.hits), c.url ? icon("ext") : "");
    }
  }
  palItems = items;
  palIndex = Math.min(palIndex, Math.max(0, items.length - 1));
  palBody.innerHTML = html;
  selectPal(palIndex, false);
  const enter = palItems[palIndex]?.kind === "scope" ? "Add" : "Open";
  palFoot.innerHTML = `<span><kbd>↑</kbd><kbd>↓</kbd>Move</span><span><kbd>Enter</kbd>${enter}</span><span><kbd>${MOD}Enter</kbd>Open in the background</span><span><kbd>Tab</kbd>Add a filter</span><span><kbd>Backspace</kbd>Remove a filter</span>`;
}

function selectPal(i, scroll = true) {
  palIndex = i;
  for (const el of $$(".pr", palBody)) el.setAttribute("aria-selected", Number(el.dataset.i) === i);
  const el = $(`#po${i}`, palBody);
  if (el) {
    palInput.setAttribute("aria-activedescendant", el.id);
    if (scroll) el.scrollIntoView({ block: "nearest" });
  } else palInput.removeAttribute("aria-activedescendant");
}

function activate(item, background = false) {
  if (!item) return;
  if (item.kind === "scope") {
    chips = chips.filter((c) => c.key !== item.key || item.key === "by");
    chips.push({ key: item.key, value: item.value, label: item.label });
    palInput.value = palInput.value.slice(0, item.start).replace(/\s+$/, "");
    if (palInput.value) palInput.value += " ";
    palIndex = 0;
    drawPalette();
    return;
  }
  pal.close();
  if (item.kind === "file") {
    state.focus = item.id;
    openFiles([item.id], background);
  } else if (item.kind === "view") go(item.view);
  else if (item.kind === "create") createFile(item.type, item.name, item.project);
  else if (item.kind === "command") {
    const { command } = item;
    if (command.view) go(command.view);
    else if (command.url) window.open(command.url, "_blank", "noopener");
    else command.act();
  }
}

palInput.addEventListener("input", () => {
  palIndex = 0;
  drawPalette();
});
palInput.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!palItems.length) return;
    const n = palItems.length;
    selectPal((palIndex + (e.key === "ArrowDown" ? 1 : n - 1)) % n);
  } else if (e.key === "Enter") {
    e.preventDefault();
    activate(palItems[palIndex], e.ctrlKey || e.metaKey);
  } else if (e.key === "Tab") {
    const item = palItems[palIndex];
    if (item?.kind === "scope") {
      e.preventDefault();
      activate(item);
    } else if (!e.shiftKey && !parse().scope) {
      e.preventDefault();
      palInput.value = (palInput.value ? palInput.value.replace(/\s*$/, " ") : "") + "in:";
      drawPalette();

  } else if (e.key === "Backspace" && !palInput.value && chips.length) {
    chips.pop();
    drawPalette();
  }
});
palBody.addEventListener("pointermove", (e) => {
  const el = e.target.closest(".pr");

});
palBody.addEventListener("click", (e) => {

});
palChips.addEventListener("click", (e) => {
  const button = e.target.closest("[data-chip]");
  if (!button) return;
  chips.splice(Number(button.dataset.chip), 1);
  palInput.focus();
  drawPalette();
});

/* Page events */

head.addEventListener("click", (e) => {

filters.addEventListener("click", (e) => {

scroller.addEventListener("click", (e) => {
  // The click that drops a starred file doesn't clear the selection. The
  // one that ends a selection box doesn't reach here (endBox)
  if (liftJustEnded) {
    liftJustEnded = false;
    return;
  }
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "new") return createFile("design");
  if (act === "clear-filters") {
    state.type = "all";
    return render({ keepScroll: false });
  }
  // Home: a section folding away, View all, a suggested project
  const fold = e.target.closest("[data-fold]")?.dataset.fold;

  }
  const to = e.target.closest("[data-go]")?.dataset.go;

  const layout = e.target.closest("[data-layout]")?.dataset.layout;

  const card = e.target.closest(".card[data-id]");
  if (!card) {

    return;
  }
  const id = card.dataset.id;
  if (e.target.closest(".star")) return toggleStar(state.sel.has(id) ? selection() : [id]);
