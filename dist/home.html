  if (info?.error) html += `<p class="wnote" role="alert">Couldn't load the people: ${esc(info.error)}</p>`;
  else if (!info?.members) html += `<div class="wsk"></div><div class="wsk"></div><div class="wsk"></div>`;
  else html += `<div role="list" aria-label="People in ${esc(team.name)}">${info.members.map((m, i) => (winState.ask?.id === m.id ? askRow(m) : personRow(m, tier, memberControl(m, i, tier)))).join("")}</div>`;
  html += `</section></div><div class="wfoot"><button class="ib" data-w="all-settings">${plan.tier === "Pro" ? "Seats, libraries, AI, transfer and deleting" : "Libraries, AI, transfer and deleting"}<span class="x">${fig("right")}</span></button></div>`;
  return html;
}

const ACCESS = [["edit", "Can edit"], ["view", "Can view"], ["none", "No access"]];
function shareWinHtml() {
  const p = PROJECTS[winState.project];
  const roles = ROLES[p.id];
  const access = ACCESS.find(([k]) => k === accessOf(p.id))[1];
  const everyone = orgWide(p.id) ? p.plan.name : p.team.name;
  const tm = p.team.img ? `<img src="${esc(p.team.img)}" alt="" referrerpolicy="no-referrer">` : esc(p.team.name[0]);
  let html = `<div class="wh"><span class="fbig">${folderIcon(p.id)}</span><div class="wt"><h2 id="win-title"><span class="hname static">Share ${esc(p.name)}</span></h2><small>${esc(p.team.name)}</small></div><button class="ib x" data-w="close" aria-label="Close" title="Close">${icon("x")}</button></div><div class="wb">`;
  html += `<section class="ws"><h3>Invite</h3>${inviteForm(`Invite people to ${p.name}`, [ROLE_LEVELS.viewer, ROLE_LEVELS.editor])}</section>`;
  html += `<section class="ws"><h3>Who has access</h3><div role="list" aria-label="Who has access to ${esc(p.name)}">`;
  html += `<div class="mem" role="listitem"><span class="tm" style="background:${p.team.img ? "transparent" : p.team.color}">${tm}</span><span><b>Anyone in ${esc(everyone)}</b></span>` +
    // Starter teams' projects are open to the whole team, to edit
    (p.plan.tier === "Free" ? `<span class="role">${access}</span>` : `<button class="ib" data-w="team-access" aria-haspopup="menu" aria-label="What ${esc(everyone)} can do: ${access}">${access}${icon("down")}</button>`) + `</div>`;
  if (roles?.error) html += `<p class="wnote" role="alert">Couldn't load who has access: ${esc(roles.error)}</p>`;
  else if (!roles) html += `<div class="wsk"></div><div class="wsk"></div>`;
  else html += roles.list.map((m, i) => (winState.ask?.id === m.id ? askRow(m) : personRow(m, null, memberControl(m, i, null)))).join("");
  html += `</div></section></div><div class="wfoot"><button class="ib" data-w="project-link">${icon("link")}Copy link</button></div>`;
  return html;
}

function drawWin() {
  if (!win.classList.contains("open")) return;
  // Not under a name or description being edited: once it's saved
  if ($(".editing", win)) return;
  if (winState.kind === "team" && !teamById(winState.team)) return closeWin(false);
  if (winState.kind === "share" && !PROJECTS[winState.project]) return closeWin(false);
  const was = $(".invite input", win);
  const typed = was?.value ?? "";
  const focused = document.activeElement;
  // What had focus, found again in the new contents: a person's button by
  // their place in the list
  const { w, i } = win.contains(focused) ? focused.dataset ?? {} : {};
  const refocus = was && focused === was ? "emails" : w ? `[data-w="${w}"]${i ? `[data-i="${i}"]` : ""}` : null;
  win.setAttribute("aria-label", winState.kind === "team" ? "Team settings and people" : "Share");
  win.innerHTML = winState.kind === "team" ? teamWinHtml() : shareWinHtml();
  const input = $(".invite input", win);
  if (input) {
    input.value = typed;
    inviteReady();
  }
  if (refocus === "emails") input?.focus();
  else if (refocus) $(refocus, win)?.focus();
  placeWin();
}

const emailsIn = (text) => text.split(/[\s,;]+/).map((s) => s.trim()).filter(Boolean);
const isEmail = (s) => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s);
function inviteReady() {
  const input = $(".invite input", win);
  const emails = emailsIn(input?.value ?? "");
  const submit = $(".invite [type=submit]", win);
  if (submit) submit.disabled = !emails.length || !emails.every(isEmail);
}

function sendInvites() {
  const input = $(".invite input", win);
  const emails = emailsIn(input.value);
  if (!emails.length || !emails.every(isEmail)) return;
  const team = winState.kind === "team";
  const id = team ? winState.team : winState.project;
  const { plan } = teamById(winState.team);
  // Starter and Professional teams invite members, with no level to pick:
  // as their links do
  const level = team && standalone(plan) ? ROLE_LEVELS.editor : winState.level ?? ROLE_LEVELS.viewer;
  const done = () => {
    input.value = "";
    inviteReady();
    toast(emails.length === 1 ? `Invited ${emails[0]}` : `Invited ${emails.length} people`);
    (team ? loadTeamInfo(id) : loadRoles(id)).then(drawWin, () => {});
  };
  if (!LIVE) return done();
  const submit = $(".invite [type=submit]", win);
  submit.disabled = true;
  api("/api/invites", { method: "POST", json: { emails, resource_type: team ? "team" : "folder", resource_id_or_key: id, level } })
    .then(done, (error) => {
      inviteReady();
      toast(`Couldn't invite them: ${error.message}`);
    });
}

function renameTeam(id) {
  const { team } = teamById(id) ?? {};
  const el = $("[data-w=rename]", win);
  if (!team || !el) return;
  editInPlace(el, { value: team.name, label: "Team name" }, (name) => {
    if (!name) return;
    const old = team.name;
    const put = (to, from) => {
      team.name = to;
      render();
      drawWin();
      if (LIVE) send(api(`/api/teams/${id}`, { method: "PUT", json: { name: to } }), () => {
        team.name = from;
        drawWin();
      }, "rename the team");
    };
    put(name, old);
    toast(`Renamed to “${name}”`, () => put(old, name));
  }, () => {
    drawWin();
    refocus($("[data-w=rename]", win)) || win.focus({ preventScroll: true });
  });
}
function describeTeam(id) {
  const { team } = teamById(id) ?? {};
  const el = $("[data-w=about]", win);
  if (!team || !el) return;
  const info = TEAM_INFO[id];
  const old = info?.description ?? team.description ?? "";
  editInPlace(el, { value: old, label: `Description of ${team.name}`, multiline: true }, (text) => {
    const put = (to, from) => {
      team.description = to;
      if (info) info.description = to;
      drawWin();
      if (LIVE) send(api(`/api/teams/${id}`, { method: "PUT", json: { description: to } }), () => {
        team.description = from;
        if (info) info.description = from;
        drawWin();
      }, "save the description");
    };
    put(text, old);
    toast(text ? "Saved the description" : "Removed the description", () => put(old, text));
  }, () => {
    drawWin();
    refocus($("[data-w=about]", win)) || win.focus({ preventScroll: true });
  });
}

function teamAccessMenu(at) {
  const id = winState.project;
  const f = (FOLDER[id] ??= {});
  const current = accessOf(id);
  const scope = orgWide(id) ? "organization" : "team";
  // In the field the project has, keeping its scope (plan, org, workspace)
  const field = f.audience ? "audience" : "teamAccess";
  const value = (level) => (field === "audience"
    ? level === "none" ? "invite_only" : `${f.audience.match(/^(org|plan|workspace)_/)?.[1] ?? "plan"}_${level}`
    : { edit: "team_edit", view: "team_view", none: "team_access_disabled" }[level]);
  showMenu(ACCESS.map(([key, label]) => ({
    label,
    detail: { edit: `Everyone in the ${scope} can edit`, view: `Everyone in the ${scope} can view`, none: "Only people invited to it" }[key],
    checked: key === current,
    act: () => {
      if (key === current) return;
      const old = f[field];
      const put = (to, from) => setFolder(id, field, to, from, () => api(`/api/folders/${id}`, { method: "PUT", json: field === "audience" ? { sharing_audience_control: to } : { team_access: to } }), "change who has access");
      put(value(key), old);
      toast(key === "none" ? `Only people invited can open ${PROJECTS[id].name}` : `Everyone in the ${scope} ${label.toLowerCase()}`, () => put(old, value(key)));
    },
  })), at);
}

/* People in a team or a project: roles in a project and in an
   Organization's teams; removing people and invites anywhere. Nothing here
   can be undone in Figma but a role, so removing asks first */

const ROLE_DETAIL = { team: ["Opens the team's files", "Edits the team's files", "Also manages the team and its people"], share: ["Opens the project's files", "Edits the project's files"] };
function personMenu(i, at) {
  const m = peopleOf()?.[i];
  if (!m) return;
  const levels = rolesFor(m);
  const items = levels.map((level, j) => ({ label: level === ROLE_LEVELS.admin ? "Admin" : levelName(level), detail: ROLE_DETAIL[winState.kind][j], checked: m.level === level, act: () => setRole(m, level) }));
  if (items.length) items.push(null);
  if (m.pending) items.push({ label: "Send the invite again", act: () => resendInvite(m) }, { label: "Cancel invite…", act: () => askRemove(m) });
  else items.push({ label: `Remove from ${peopleWhere()}…`, act: () => askRemove(m) });
  showMenu(items, at);
}

// The window's resource, to know a change still belongs to what's open
const winKey = () => `${winState.kind}:${winState.kind === "team" ? winState.team : winState.project}`;

function setRole(m, level) {
  const key = winKey();
  if (m.level === level) return;
  const put = (to, from) => {
    m.level = to;
    m.role = { ...m.role, level: to };
    drawWin();
    if (LIVE) send(api(`/api/roles/${m.role.id}`, { method: "PUT", json: { ...m.role, level: to, response_version: 2 } }), () => {
      m.level = from;
      m.role = { ...m.role, level: from };
      if (winKey() === key) drawWin();
    }, "change the role");
  };
  const old = m.level;
  put(level, old);
  toast(`${m.name} ${level >= ROLE_LEVELS.admin ? "is an admin now" : levelName(level).toLowerCase()}`, () => put(old, level));
}

function resendInvite(m) {
  if (!LIVE) return toast(`Sent the invite to ${m.name} again`);
  const team = winState.kind === "team";
  api("/api/invites/resend", { method: "POST", json: { email: m.name, resource_type: team ? "team" : "folder", resource_id_or_key: team ? winState.team : winState.project } })
    .then(() => toast(`Sent the invite to ${m.name} again`), (error) => toast(`Couldn't send the invite: ${error.message}`));
}

// Into the person's row: what removing them from a team does to its files
// comes in as Figma works it out
function askRemove(m) {
  const key = winKey();
  winState.ask = { id: m.id, impact: null };
  drawWin();
  $("[data-w=ask-no]", win)?.focus();
  if (!LIVE || m.pending || winState.kind !== "team") return;
  api(`/api/teams/${winState.team}/users/removal_impact?user_ids[]=${encodeURIComponent(m.id)}`).then((impact) => {
    if (winKey() !== key || winState.ask?.id !== m.id) return;
    winState.ask.impact = impact;
    drawWin();
  }, () => {});
}

function removePerson(m) {
  const key = winKey();
  const list = peopleOf();
  const where = peopleWhere();
  if (!list) return;
  const at = list.indexOf(m);
  winState.ask = null;
  list.splice(at, 1);
  drawWin();
  $(".invite input", win)?.focus();
  toast(m.pending ? `Canceled the invite to ${m.name}` : `Removed ${m.name} from ${where}`);
  if (!LIVE) return;
  // An invite, a project's person or an Organization team's member goes
  // with their role; a Starter or Professional team's member, as Figma's
  // own Members page removes them
  const viaTeam = winState.kind === "team" && !m.pending && (standalone(teamById(winState.team).plan) || !m.role);
  const request = viaTeam
    ? api(`/api/teams/${winState.team}/users`, { method: "DELETE", json: { user_ids: [m.id] } })
    : api(`/api/roles/${m.role.id}`, { method: "DELETE" });
  send(request, () => {
    if (!list.includes(m)) list.splice(Math.min(at, list.length), 0, m);
    if (winKey() === key) drawWin();
  }, m.pending ? "cancel the invite" : "remove them");
}

/* A team's settings page, in Home's main area: its plan and seats,
   libraries, AI, and transferring or deleting it, as Figma's own team
   settings have them. Each change that costs money or can't be undone says
   what it does, in place, before it's made */

const TEAM_SET = {};
const settingsTeam = () => (state.view.startsWith("s:") && teamById(state.view.slice(2)) ? state.view.slice(2) : null);
const tierOf = (plan) => (plan.teams.length === 1 ? plan.tier : plan.name);
// Figma's seat types, as its members page names them; "" is a View seat
const SEATS = [["expert", "Full seat"], ["developer", "Dev seat"], ["collaborator", "Collab seat"], ["", "View seat"]];
const seatName = (key) => SEATS.find(([k]) => k === (key ?? ""))?.[1] ?? "View seat";
const money = (cents, currency = "usd") => new Intl.NumberFormat(undefined, { style: "currency", currency: currency.toUpperCase(), minimumFractionDigits: cents % 100 ? 2 : 0 }).format(cents / 100);
const dayOf = (iso) => new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });

const SAMPLE_SET = {
  meta: { ai_features_disabled: false, ai_data_sharing_enabled: true, figma_provided_libraries_disabled: false },
  counts: { team_active_project_count: 3, active_project_active_file_count: 24, active_drafts_count: 6, team_trashed_file_count: 2 },
  libraries: [{ library_key: "sample", library_file_key: "sample", library_name: "Ligma UI", num_components: 48, num_styles: 12, num_variables: 30 }],
};
async function loadTeamSettings(id) {
  const { team, plan } = teamById(id) ?? {};
  if (!team) return;
  // What's open on the page stays open through a reload that ends later
  const kept = () => ({ transfer: TEAM_SET[id]?.transfer ?? null, deleting: TEAM_SET[id]?.deleting ?? null });
  try {
    if (!LIVE) {
      await loadTeamInfo(id);
      const seats = plan.tier === "Pro"
        ? {
            users: TEAM_INFO[id].members.filter((m) => !m.pending).map((m, i) => ({ user_id: m.id, user: { handle: m.name, email: m.email }, active_seat_type: i < 2 ? { key: "expert" } : null })),
            summary: { currency: "usd", monthly_subscription: { estimated_amount_due: 4000, current_period_end: new Date(Date.now() + 18 * 864e5).toISOString() }, monthly_seats: { expert: 2 }, total_upgraded_user_counts: { expert: 2 } },
            rates: { product_prices: [["expert", 2000], ["developer", 1500], ["collaborator", 500]].map(([key, amount]) => ({ tier: "pro", billable_product_key: key, renewal_term: "month", currency: "usd", amount })) },
          }
        : null;
      TEAM_SET[id] = { ...structuredClone(SAMPLE_SET), seats, ...kept() };
    } else {
      await loadTeamInfo(id).catch(() => {});
      const [meta, counts, libraries] = await Promise.all([
        api(`/api/teams/${id}`),
        api(`/api/teams/${id}/deletion_file_count`).catch(() => null),
        api("/api/design_systems/v2/libraries").catch(() => []),
      ]);
      // Seats are a Professional team's, and only its admins see them
      let seats = null;
      if (meta.pro_team && TEAM_INFO[id]?.admin) {
        const [users, summary, rates] = await Promise.all([
          api(`/api/teams/${id}/team_users`),
          api(`/api/subscriptions/team/${id}/summary`),
          api(`/api/pricing/rates?plan_parent_id=${id}&plan_type=team`),
        ]);
        seats = { users, summary, rates };
      }
      TEAM_SET[id] = { meta, counts, libraries: (Array.isArray(libraries) ? libraries : []).filter((l) => String(l.team_id) === id), seats, ...kept() };
    }
  } catch (error) {
    TEAM_SET[id] = { error: error.message, ...kept() };
  }
  if (settingsTeam() === id) drawSettingsKeepingFocus();
}

// What a seat costs here: Figma's price for this plan, billed as it's billed
function seatPrice(seats, key) {
  if (!key) return null;
  const sum = seats.summary;
  const term = sum.annual_subscription && !sum.monthly_subscription ? "year" : "month";
  const price = seats.rates.product_prices?.find((p) => p.tier === "pro" && p.billable_product_key === key && p.renewal_term === term && p.currency === (sum.currency ?? "usd"));
  return price ? `${money(price.amount, price.currency)} a ${term}` : null;
}
// Paid seats of a type nobody has: given out without adding to the bill
function spareSeats(seats, key) {
  const sum = seats.summary;
  return (sum.monthly_seats?.[key] ?? 0) + (sum.annual_seats?.[key] ?? 0) - (sum.total_upgraded_user_counts?.[key] ?? 0);
}

const settingRow = (title, detail, control, extra = "") => `<div class="srow"${extra}><span class="st"><b>${title}</b>${detail ? `<small>${detail}</small>` : ""}</span>${control ? `<span class="ctl">${control}</span>` : ""}</div>`;
const toggle = (key, label, on, off) => `<button class="tgl" role="switch" aria-checked="${on}" aria-label="${esc(label)}" data-set="${key}"${off ? " disabled" : ""}></button>`;

function settingsPage(id) {
  const { team, plan } = teamById(id);
  const s = TEAM_SET[id];
  if (!s) {
    loadTeamSettings(id);
    return renderSkeleton();
  }
  if (s.error) return `<div class="empty"><div class="ic">${icon("users")}</div><h2>Couldn't load ${esc(team.name)}'s settings</h2><p>${esc(s.error)}</p><button class="btn" data-set="reload">Try again</button></div>`;
  const admin = TEAM_INFO[id]?.admin ?? !LIVE;
  const off = !admin;
  let html = `<div class="setp">`;
  if (!admin) html += `<p class="snote">Only the team's admins can change these</p>`;
  if (s.seats) html += seatsSection(id, s.seats);
  // Libraries: Figma's own kits for the team's files, and what it publishes
  const kits = !s.meta.figma_provided_libraries_disabled;
  html += `<section class="sec"><h2>Libraries</h2>`;
  // Starter teams always have them: Figma takes the setting and ignores it
  const starter = !!s.meta.starter_team;
  html += settingRow("Figma's UI kits and libraries", starter ? "Starter teams always have the libraries Figma provides, like its iOS, Android and Material kits" : "Lets this team's files use the libraries Figma provides, like its iOS, Android and Material kits", toggle("kits", "Figma's UI kits and libraries", starter || kits, off || starter));
  if (s.libraries.length) {
    for (const l of s.libraries) {
      const parts = [[l.num_components, "component"], [l.num_styles, "style"], [l.num_variables, "variable"]].filter(([n]) => n).map(([n, w]) => `${n} ${w}${n === 1 ? "" : "s"}`);
      html += `<a class="srow" href="https://www.figma.com/design/${esc(l.library_file_key ?? l.library_key)}" target="_blank" rel="noopener"><span class="st"><b>${esc(l.library_name ?? "Library")}</b><small>Published library${parts.length ? ` · ${parts.join(", ")}` : ""}</small></span><span class="ctl">${fig("ext")}</span></a>`;
    }
  } else html += settingRow("No libraries published from this team", "A library published from one of its files shows here");
  html += `</section>`;
  // AI: Figma's AI in the team's files, and whether Figma learns from them
  const ai = !s.meta.ai_features_disabled;
  const student = !!s.meta.student_team_at;
  html += `<section class="sec"><h2>AI</h2>`;
  html += settingRow("AI features", "Lets people use Figma's AI tools in this team's files", toggle("ai", "AI features", ai, off));
  html += settingRow("Share content to train Figma's AI", student ? "Off for education teams" : "Lets Figma use this team's files to improve its AI models", toggle("ai-data", "Share content to train Figma's AI", !student && !!s.meta.ai_data_sharing_enabled, off || student));
  html += `</section>`;
  html += `<section class="sec"><h2>Transfer and delete</h2>${transferRow(id, s, off)}${deleteRow(id, s, plan, off)}</section>`;
  return html + `</div>`;
}

function seatsSection(id, seats) {
  const sum = seats.summary;
  const sub = sum.monthly_subscription ?? sum.annual_subscription;
  const term = sum.monthly_subscription ? "month" : "year";
  const plan = sub ? `${money(sub.estimated_amount_due ?? 0, sum.currency)} a ${term} · ${sum.plan_canceled || sub.canceled_at ? "Ends" : "Renews"} ${dayOf(sub.current_period_end)}` : "";
  let html = `<section class="sec"><h2>Seats<small>${esc(plan)}</small></h2><div class="seats">`;
  const ask = TEAM_SET[id].askSeat;
  for (const u of seats.users ?? []) {
    const key = u.active_seat_type?.key ?? "";
    const who = u.user ?? {};
    const name = who.handle || who.email || "Someone";
    const face = who.img_url ? `<img src="${esc(who.img_url)}" alt="" referrerpolicy="no-referrer">` : esc(name[0]);
    const avatar = `<span class="av" style="background:${who.img_url ? "transparent" : colorForTeam(u.user_id)}">${face}</span>`;
    const me = u.user_id === (LIVE ? Live.uid : "me");
    if (ask?.user === u.user_id) {
      const to = ask.seat;
      const price = seatPrice(seats, to);
      const bits = [];
      if (to) bits.push(spareSeats(seats, to) > 0 ? `It uses a ${seatName(to)} this team already pays for` : `It adds ${price ?? "a seat"} to this team's bill`);
      if (key && sub) bits.push(`Their ${seatName(key)} stays on the bill until the plan renews on ${dayOf(sub.current_period_end)}, for someone else to use`);
      html += `<div class="srow ask">${avatar}<span class="st"><b id="seat-q">Give ${esc(name)} a ${seatName(to)}?</b><small>${esc(bits.join(". "))}</small></span><span class="ctl"><button class="btn sm" data-set="seat-no">Cancel</button><button class="btn sm primary" data-set="seat-yes" aria-describedby="seat-q">${to ? `${spareSeats(seats, to) > 0 ? "Give" : "Add"} ${seatName(to)}` : "Change seat"}</button></span></div>`;
      continue;
    }
    const price = seatPrice(seats, key);
    html += `<div class="srow">${avatar}<span class="st"><b>${esc(name)}${me ? ` <i style="color:var(--text2);font-style:normal">(you)</i>` : ""}</b><small>${esc(who.email ?? "")}</small></span><span class="ctl"><button class="ib" data-set="seat" data-user="${esc(u.user_id)}" aria-haspopup="menu" aria-label="${esc(name)}: ${seatName(key)}">${seatName(key)}${price ? ` · ${price.replace(" a ", "/").replace("month", "mo").replace("year", "yr")}` : ""}${icon("down")}</button></span></div>`;
  }
  return html + `</div></section>`;
}

function transferRow(id, s, off) {
  const t = s.transfer;
  if (t?.sent) return settingRow("Transfer requested", `Sent to ${esc(t.email)}${t.orgName ? ` at ${esc(t.orgName)}` : ""}. The team moves once they accept`, t.requestId ? `<button class="btn sm" data-set="transfer-withdraw">Withdraw</button>` : "");
  if (!t?.open) return settingRow("Transfer to another organization", "Moves the team, its projects, files and people to an organization. An admin there accepts it", `<button class="btn sm" data-set="transfer-open"${off ? " disabled" : ""}>Transfer…</button>`);
  const hint = t.error ? `<span class="fhint bad" role="alert">${esc(t.error)}</span>` : t.orgName ? `<span class="fhint">To ${esc(t.orgName)}</span>` : `<span class="fhint">Copy the link of any page in that organization in Figma</span>`;
  return `<div class="srow ask"><span class="st"><b>Transfer ${esc(teamById(id).team.name)} to another organization</b><small>The team, its projects, files and people move once an admin there accepts. Libraries and fonts it used may not come along</small></span>

// The toggles: optimistic, with Undo, rolled back if Figma refuses
const TEAM_FLAGS = {
  kits: { field: "figma_provided_libraries_disabled", on: false, say: ["Figma's UI kits are on for", "Figma's UI kits are off for"], put: (id, on) => api(`/api/teams/${id}`, { method: "PUT", json: { figma_provided_libraries_disabled: !on } }) },
  ai: { field: "ai_features_disabled", on: false, say: ["AI features are on for", "AI features are off for"], put: (id, on) => api(`/api/teams/${id}`, { method: "PUT", json: { ai_features_disabled: !on } }) },
  "ai-data": { field: "ai_data_sharing_enabled", on: true, say: ["Figma can train its AI on", "Figma won't train its AI on"], put: (id, on) => api(`/api/teams/${id}/ai_data_sharing`, { method: "PUT", json: { enabled: on } }) },
};
function setTeamFlag(id, key) {
  const flag = TEAM_FLAGS[key];
  const s = TEAM_SET[id];
  const name = teamById(id).team.name;
  const isOn = () => s.meta[flag.field] === flag.on;

}

// The organization a pasted link points into: figma.com/files/<org id>/…
async function transferOrg(id) {
  const t = TEAM_SET[id].transfer;
  const org = (t.org ?? "").match(/figma\.com\/files\/(\d+)(?:[/?#]|$)/)?.[1] ?? null;
  t.orgId = null;
  t.orgName = null;
  t.error = t.org && !org ? "That's not a link into an organization. Open any page of it in Figma and copy its link" : null;
  if (org) {
    try {
      const name = LIVE ? await api(`/api/orgs/${org}/org_name`) : "Northwind Studio";
      if (TEAM_SET[id].transfer !== t) return;
      t.orgId = org;
      t.orgName = typeof name === "string" ? name : name?.name ?? null;
    } catch {
      t.error = "Couldn't find that organization";
    }
  }
  drawSettingsKeepingFocus();
}
function sendTransfer(id) {
  const t = TEAM_SET[id].transfer;
  if (!transferReady(t)) return;
  t.sending = true;
  drawSettingsKeepingFocus();
  const sent = (meta) => {
    TEAM_SET[id].transfer = { sent: true, email: t.email, orgName: t.orgName, requestId: meta?.id ?? meta?.asset_transfer_request?.id ?? null };
    render();
    toast(`Sent the transfer request to ${t.email}`);
  };
  if (!LIVE) return sent({ id: "sample" });
  api("/api/asset_transfer/create_request", { method: "POST", json: { transfer_type: "team", team_id: id, destination_user_email: t.email.trim(), destination_team_id: null, destination_org_id: t.orgId, message: t.message?.trim() || null, is_transfer_copy: false } })
    .then(sent, (error) => {
      t.sending = false;
      t.error = error.message;
      drawSettingsKeepingFocus();
    });
}
function withdrawTransfer(id) {
  const t = TEAM_SET[id].transfer;
  const back = () => {
    TEAM_SET[id].transfer = null;
    render();
    toast("Withdrew the transfer request");
  };
  if (!LIVE) return back();
  api(`/api/asset_transfer/${t.requestId}`, { method: "DELETE" }).then(back, (error) => toast(`Couldn't withdraw it: ${error.message}`));
}

// Deleted teams can be restored for a while, so Undo restores this one
function deleteTeam(id) {
  const { team, plan } = teamById(id) ?? {};
  const s = TEAM_SET[id];
  if (!team || s.deleting?.typed.trim() !== team.name.trim()) return;
  s.deleting.busy = true;
  render();
  const gone = () => {
    plan.teams.splice(plan.teams.indexOf(team), 1);
    if (!plan.teams.length) PLANS.splice(PLANS.indexOf(plan), 1);
    delete TEAM_SET[id];
    go("home");
    toast(`Deleted ${team.name}`, () => {
      const back = () => {
        if (!PLANS.includes(plan)) PLANS.push(plan);
        if (!plan.teams.includes(team)) plan.teams.push(team);
        render();
        toast(`Restored ${team.name}`);
      };
      if (!LIVE) return back();
      api(`/api/teams/${id}/restore`, { method: "PUT" }).then(() => {
        back();
        boot();
      }, (error) => toast(`Couldn't restore it: ${error.message}`));
    });
  };
  if (!LIVE) return gone();
  api(`/api/teams/${id}`, { method: "DELETE" }).then(gone, (error) => {
    s.deleting.busy = false;
    render();
    toast(`Couldn't delete the team: ${error.message}`);
  });
}

// Redrawn as typed, with the field being typed in keeping focus and caret
function drawSettingsKeepingFocus() {
  const el = document.activeElement;
  const field = el?.dataset?.setField;
  const at = field ? [el.selectionStart, el.selectionEnd] : null;
  render();
  if (!field) return;
  const again = $(`[data-set-field="${field}"]`, scroller);
  again?.focus({ preventScroll: true });
  if (again && at) again.setSelectionRange(...at);
}

function settingsClick(el) {
  const id = settingsTeam();
  const s = id && TEAM_SET[id];
  if (!s) return;
  const act = el.dataset.set;
  if (act === "reload") {
    delete TEAM_SET[id];
    return render();
  }
  if (TEAM_FLAGS[act]) return setTeamFlag(id, act);
  if (act === "seat") return seatMenu(id, el.dataset.user, el.getBoundingClientRect());
  if (act === "seat-yes") return changeSeat(id);
  if (act === "seat-no") {
    const user = s.askSeat?.user;
    s.askSeat = null;
    render();
    return $(`[data-set=seat][data-user="${CSS.escape(user ?? "")}"]`, scroller)?.focus();
  }
  if (act === "transfer-open") {
    s.transfer = { open: true };
    render();
    return $("[data-set-field=org]", scroller)?.focus();
  }
  if (act === "transfer-cancel") {
    s.transfer = null;
    render();
    return $("[data-set=transfer-open]", scroller)?.focus();
  }
  if (act === "transfer-send") return sendTransfer(id);
  if (act === "transfer-withdraw") return withdrawTransfer(id);
  if (act === "delete-open") {
    s.deleting = { typed: "" };
    render();
    return $("[data-set-field=typed]", scroller)?.focus();
  }
  if (act === "delete-cancel") {
    s.deleting = null;
    render();
    return $("[data-set=delete-open]", scroller)?.focus();
  }
  if (act === "delete-yes") return deleteTeam(id);
}
scroller.addEventListener("input", (e) => {
  const field = e.target.dataset?.setField;
  const id = settingsTeam();
  if (!field || !id) return;
  const s = TEAM_SET[id];
  if (field === "typed") {

});

win.addEventListener("click", (e) => {

function go(view) {

/* Inbox: comments, replies, mentions, invites and edit requests, as Figma's
   bell lists them. Reading a comment note clears it from the file's count */

const NOTES = [];
const ABOUT_COMMENTS = new Set(["comment", "reply", "mention"]);
function seedNotes() {
  const file = (name) => FILES.find((f) => f.name === name);
  const now = Date.now();
  const add = (note) => NOTES.push({ id: "n" + NOTES.length, unread: false, count: 1, done: null, ...note });

  add({ kind: "reply", by: "sam", file: file("Launch deck").id, at: now - 30 * HOUR, text: "Agreed, the second cover is stronger" });
  add({ kind: "invite-file", by: "jonas", file: file("Fieldnote site").id, at: now - 2.2 * DAY });
  add({ kind: "comment", by: "priya", file: file("Onboarding flow").id, at: now - 3.1 * DAY, text: "Left a few notes on the sign-in step" });
  add({ kind: "invite-team", by: "mei", team: "Studio", at: now - 5.4 * DAY, done: "Joined" });
  add({ kind: "mention", by: "jonas", file: file("Sprint retro").id, at: now - 9 * DAY, text: "@Chris owns the follow-up on search" });
  add({ kind: "reply", by: "ana", file: file("Card designs").id, at: now - 16 * DAY, text: "Fixed the corner radius on the metal card" });
}
const noteFile = (note) => byId(note.fileKey ?? note.file) ?? null;
const teamColor = (name) => Object.values(PROJECTS).find((p) => p.team.name === name)?.team.color ?? "#757575";

// Figma's bell, read as its own panel reads it. Its text comes as HTML;
// only bold survives here
const NOTE_KINDS = { AtMentionCommentNotif: "mention", FileCommentReplyNotifV2: "reply", FileCommentNotifV2: "comment", BatchedFileCommentNotif: "comment" };
const ENTITIES = { amp: "&", lt: "<", gt: ">", quot: '"', "#39": "'", apos: "'", nbsp: " " };
const strip = (html) => String(html ?? "").replace(/<br\s*\/?>/gi, " ").replace(/<[^>]+>/g, "").replace(/&(amp|lt|gt|quot|#39|apos|nbsp);/g, (_, e) => ENTITIES[e]);
const boldOnly = (html) => esc(strip(String(html ?? "").replace(/<b>/gi, "\u0001").replace(/<\/b>/gi, "\u0002"))).replace(/\u0001/g, "<b>").replace(/\u0002/g, "</b>");
let notesTimer = 0;
// Figma can't mark a notification unread again, so Ligma remembers which
// ones you did
const localUnread = new Set();
const saveLocalUnread = () => store.set(`unread:${Live.uid}`, [...localUnread]);
async function loadNotes() {
  try {
    if (!localUnread.size) for (const id of store.get(`unread:${Live.uid}`, [])) localUnread.add(id);
    const params = new URLSearchParams({ currentView: "fullscreen", appVersion: "1", clientType: "web", current_plan_id: "-1", is_plan_org: "false" });
    const items = await api(`/api/user_notifications/server_driven/plan?${params}`);
    NOTES.splice(0);
    for (const file of FILES) file.unread = 0;
    for (const item of Array.isArray(items) ? items : []) {
      const attachment = item.preferred_attachments?.[0];
      const body = attachment?.body ?? {};
      const html = (blocks) => (blocks ?? []).map((b) => b?.html_text ?? "").join(" ");
      const type = item.notification_type ?? "";
      const href = item.deeplink?.href ?? attachment?.deeplink?.href ?? null;
      // The title is who it's from, sometimes as their email; the avatar
      // has their name. The subtitle says what happened and where
      const email = (t) => /^[^\s@]+@[^\s@]+$/.test(t);
      let who = strip(html(body.title)).trim();
      if (email(who)) who = Live.users.find((u) => u.email === who)?.name ?? (email(item.avatars?.[0]?.fallback_text ?? "") ? who : item.avatars?.[0]?.fallback_text) ?? who;
      const parts = (body.subtitle ?? []).map((b) => strip(b?.html_text).trim()).filter((t) => t && t !== "·");
      const note = {
        id: item.notification_id,
        live: true,
        kind: NOTE_KINDS[type] ?? (/Invite/.test(type) ? "invite" : /Request(?!Approved)/.test(type) ? "request" : "other"),
        who,
        action: parts[0] ?? "",
        target: parts.slice(1).join(" · "),
        title: esc(who),
        about: /Team/.test(type) ? "team" : /Folder|Project/.test(type) ? "folder" : null,
        serverUnread: !!item.is_unread,
        text: strip(html(body.description)).trim(),
        href,
        fileKey: href?.match(/\/(?:design|file|board|slides|proto|deck|make|site|buzz)\/([A-Za-z0-9]{22})/)?.[1] ?? null,
        avatar: item.avatars?.[0]?.img_url ?? null,
        initial: (item.avatars?.[0]?.fallback_text ?? "?").trim()[0] ?? "?",
        icon: item.icon?.img_url ?? null,
        at: Date.parse(body.created_at) || Date.now(),
        unread: !!item.is_unread || localUnread.has(item.notification_id),
        count: 1,
        done: null,
      };
      NOTES.push(note);
      const file = byId(note.fileKey);
      if (note.unread && file && ABOUT_COMMENTS.has(note.kind)) file.unread += 1;
    }
  } catch (error) {
    // Again shortly; the bell keeps what it had meanwhile
    console.warn("Ligma home: couldn't load notifications", error);
    setTimeout(loadNotes, 5000);
  }
  notesTimer ||= setInterval(() => document.visibilityState === "visible" && loadNotes(), 60000);
  render();
}

function setUnread(note, unread) {
  if (note.unread === unread) return;
  note.unread = unread;
  const file = noteFile(note);
  if (file && ABOUT_COMMENTS.has(note.kind)) file.unread = Math.max(0, file.unread + (unread ? note.count : -note.count));
  if (!note.live) return;
  unread ? localUnread.add(note.id) : localUnread.delete(note.id);
  saveLocalUnread();
  if (!unread && note.serverUnread && !note.bulk) {
    note.serverUnread = false;
    api("/api/user_notifications/read", { method: "PUT", json: { id: note.id, currentView: "fullscreen", medium: "web", appVersion: "1", clientType: "web" } }).catch(() => toast("Couldn't mark it read in Figma"));
  }
}
function markRead(notes, read) {
  if (!notes.length) return;
  if (LIVE) {
    const all = read && notes.length > 1;
    const before = notes.map((n) => [n, n.unread]);
    for (const note of notes) {
      note.bulk = all;
      if (all) note.serverUnread = false;
      setUnread(note, !read);
      note.bulk = false;
    }
    if (all) api("/api/user_notifications/mark_read/plan", { method: "POST", json: { current_plan_id: "-1", currentView: "fullscreen", is_plan_org: false, source: "web" } }).catch(() => toast("Couldn't mark them read in Figma"));
    const what = notes.length === 1 ? "" : ` ${notes.length} notifications`;
    toast(`Marked${what} as ${read ? "read" : "unread"}`, () => {
      for (const [note, unread] of before) setUnread(note, unread);
      render();
    });
    return render();
  }
  const before = notes.map((n) => [n, n.unread]);

  toast(`Marked${what} as ${read ? "read" : "unread"}`, () => {

function openNote(note) {

// Approve or deny an edit request, join or decline a team
function answer(note, act) {
  const file = noteFile(note);
  const person = PEOPLE[note.by].name;
  const outcome = {
    approve: ["Approved", `${person} can now edit “${file?.name}”`],
    deny: ["Denied", `Denied ${person}'s request`],
    accept: ["Joined", `Joined ${note.team}`],
    decline: ["Declined", `Declined the invite to ${note.team}`],

  if (!outcome) return;
  const was = note.unread;
  setUnread(note, false);

  toast(outcome[1], () => {

    setUnread(note, was);

}

function noteRow(note) {

  }

    comment: `${name} commented on ${target}`,

  else if (note.kind === "request") acts = `<div class="nacts"><button class="btn sm primary" data-note-act="approve">Approve</button><button class="btn sm" data-note-act="deny">Deny</button></div>`;
  else if (note.kind === "invite-team") acts = `<div class="nacts"><button class="btn sm primary" data-note-act="accept">Join team</button><button class="btn sm" data-note-act="decline">Decline</button></div>`;
  const pic = file ? `<div class="pt nt" aria-hidden="true">${thumb(file)}</div>` : `<span class="tm nt" aria-hidden="true" style="background:${teamColor(note.team)}">${esc(note.team[0])}</span>`;

// The inbox is a window under the bell beside the account menu
const inboxEl = $("#inbox");

function drawInbox() {
  const show = { unread: (n) => n.unread, mentions: (n) => n.kind === "mention" || n.kind === "reply", requests: (n) => n.kind === "request" || n.kind.startsWith("invite") }[state.inbox] ?? (() => true);
  const notes = NOTES.filter(show).sort((a, b) => b.at - a.at);
  const unread = NOTES.filter((n) => n.unread).length;
  const kinds = [["all", "All"], ["unread", "Unread"], ["mentions", "Mentions"], ["requests", "Requests"]];
  let html = `<div class="ih"><h2 id="inbox-title">Inbox</h2><small>${unread ? `${unread} unread` : ""}</small><span class="grow"></span>`;
  html += `<button class="ib" data-act="read-all" ${unread ? "" : "disabled"}>${icon("check")}Mark all as read</button>`;
  html += `<button class="ib x" data-act="close" aria-label="Close">${icon("x")}</button></div>`;
  html += `<div class="if"><div class="seg" role="group" aria-label="Show">${kinds.map(([id, label]) => `<button data-inbox="${id}" aria-pressed="${state.inbox === id}">${label}</button>`).join("")}</div></div><div class="il">`;
  if (!notes.length) {
    const caughtUp = state.inbox === "all" || state.inbox === "unread";
    html += `<div class="iempty">${icon("bell")}<b>${caughtUp ? "You're all caught up" : "Nothing here"}</b><span>Comments, replies, mentions and invites from Figma land here</span></div>`;
  } else {
    let last = null;
    for (const note of notes) {
      const b = bucket(note.at);
      if (b.key !== last) {
        if (last) html += `</div>`;
        last = b.key;
        html += `<h3>${esc(b.label)}</h3><div role="listbox" aria-label="${esc(b.label)}">`;
      }
      html += noteRow(note);
    }
    html += `</div>`;
  }
  const had = inboxEl.contains(document.activeElement);
  const scrollTop = $(".il", inboxEl)?.scrollTop ?? 0;
  inboxEl.innerHTML = html + `</div>`;
  $(".il", inboxEl).scrollTop = scrollTop;
  const row = (state.noteFocus && document.getElementById("nt-" + state.noteFocus)) || $(".note", inboxEl);
  if (row) {
    state.noteFocus = row.dataset.note;
    row.tabIndex = 0;
    row.setAttribute("aria-selected", "true");
    if (had && !document.activeElement?.closest?.("#inbox")) row.focus({ preventScroll: true });
  }
}

inboxEl.addEventListener("click", (e) => {

function focusNote(id, scroll = false) {

  const i = Math.max(0, rows.findIndex((r) => r.dataset.note === state.noteFocus));
  const note = NOTES.find((n) => n.id === rows[i].dataset.note);
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const to = (j) => focusNote(rows[Math.min(rows.length - 1, Math.max(0, j))].dataset.note, true);

/* Menus */

const menu = $("#menu");
let menuItems = [];
let menuIndex = -1;
let menuReturn = null;
let menuKeys = null;

function placeMenu(at, above = false) {
  menu.classList.add("open");
  const { innerWidth: w, innerHeight: h } = window;
  const rect = at instanceof DOMRect ? at : null;
  let x = rect ? rect.left : at.x;
  let y = rect ? (above ? rect.top - menu.offsetHeight - 8 : rect.bottom + 4) : at.y;
  if (x + menu.offsetWidth > w - 8) x = (rect ? rect.right : at.x) - menu.offsetWidth;
  if (y + menu.offsetHeight > h - 8) y = (rect ? rect.top - 4 : at.y) - menu.offsetHeight;
  menu.style.left = `${Math.max(8, x)}px`;
  menu.style.top = `${Math.max(8, y)}px`;
}

// items: { label, detail, kbd, act, checked, disabled, ext, swatch, iconHtml, sub } | { header } | { html } | null.
// detail is a second line under the label; sub, items of a menu that opens
// beside this one; html, a row of its own that isn't an item
function menuRows(items, list, prefix, checks = items.some((item) => item && "checked" in item)) {
  return items.map((item) => {
    if (!item) return `<div class="msep" role="separator"></div>`;
    if (item.header) return `<div class="mh">${esc(item.header)}</div>`;
    if (item.html) return item.html;
    const i = list.push(item) - 1;
    const radio = checks && "checked" in item;
    const check = checks ? `<span class="ck">${fig("check")}</span>` : "";
    const swatch = item.swatch ? `<span class="sw" style="background:${item.swatch}"></span>` : "";
    const tail = item.sub ? `<span class="x">${fig("right")}</span>` : item.kbd ? `<span class="k">${esc(item.kbd)}</span>` : item.ext ? `<span class="x">${fig("ext")}</span>` : "";
    const label = item.detail ? `<span class="two"><span>${esc(item.label)}</span><small>${esc(item.detail)}</small></span>` : esc(item.label);
    return `<button class="mi${item.detail ? " tall" : ""}" id="${prefix}${i}" tabindex="-1" role="${radio ? "menuitemradio" : "menuitem"}" data-i="${i}" ${radio ? `aria-checked="${!!item.checked}"` : ""} ${item.sub ? 'aria-haspopup="menu" aria-expanded="false"' : ""} ${item.disabled ? 'aria-disabled="true"' : ""}>${check}${swatch}${item.iconHtml ? `<span class="mic">${item.iconHtml}</span>` : ""}${label}${tail}</button>`;
  }).join("");
}
function showMenu(items, at, options = {}) {
  closeMenu();
  menuReturn = document.activeElement;
  // The button that opened it says so while it's open
  if (menuReturn?.matches?.('[aria-haspopup="menu"]')) menuReturn.setAttribute("aria-expanded", "true");
  menuKeys = null;
  menuItems = [];
  menu.innerHTML = menuRows(items, menuItems, "mi", options.checks);
  menuIndex = -1;
  menu.classList.toggle("big", !!options.big);
  menu.classList.toggle("account", !!options.account);
  placeMenu(at, options.above);
  menu.focus();
}
function closeMenu() {
  closeSub();
  if (!menu.classList.contains("open")) return;
  menu.classList.remove("open");
  menu.innerHTML = "";
  menuKeys = null;
  if (menuReturn?.matches?.('[aria-haspopup="menu"]')) menuReturn.setAttribute("aria-expanded", "false");
  if (menuReturn?.isConnected) menuReturn.focus({ preventScroll: true });
  menuReturn = null;
}
// The highlighted item is announced through aria-activedescendant on what
// holds focus: the menu, or the Move to field
function highlight(i) {
  menuIndex = i;
  $$(".mi", menu).forEach((el, j) => el.classList.toggle("on", j === i));
  const owner = $("input", menu) ?? menu;
  if (i >= 0) owner.setAttribute("aria-activedescendant", "mi" + i);
  else owner.removeAttribute("aria-activedescendant");
}
function pickMenu(i) {
  const item = menuItems[i];
  if (!item || item.disabled) return;
  if (item.sub) return openSub(i, true);
  closeMenu();
  item.act?.();
}
const usableIn = (items) => items.map((item, i) => (item.disabled ? -1 : i)).filter((i) => i >= 0);
function stepIn(items, current, down) {
  const usable = usableIn(items);
  const at = usable.indexOf(current);
  return down ? usable[(at + 1) % usable.length] : usable[(at - 1 + usable.length) % usable.length];
}
menu.addEventListener("pointermove", (e) => {
  const el = e.target.closest(".mi");
  if (!el) return;
  const i = Number(el.dataset.i);
  if (i === menuIndex && (subOwner === i || !menuItems[i]?.sub)) return;
  highlight(i);
  if (menuItems[i]?.sub && !menuItems[i].disabled) openSub(i);
  else closeSub();
});
menu.addEventListener("pointerleave", () => highlight(subOwner));
menu.addEventListener("click", (e) => {
  const el = e.target.closest(".mi");
  if (el) pickMenu(Number(el.dataset.i));
});
menu.addEventListener("keydown", (e) => {
  if (menuKeys?.(e)) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const next = stepIn(menuItems, menuIndex, e.key === "ArrowDown");

    closeSub();

  } else if (e.key === "ArrowRight" && menuItems[menuIndex]?.sub) {
    e.preventDefault();
    openSub(menuIndex, true);
  } else if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    pickMenu(menuIndex);
  } else if (e.key === "Escape" || e.key === "Tab") {
    e.preventDefault();
    closeMenu();
  }
});

// A menu beside the open one, for an item with sub items (Change theme)
const submenu = $("#submenu");
let subItems = [];
let subIndex = -1;
let subOwner = -1;
function openSub(i, focus = false) {

    const r = row.getBoundingClientRect();
    const box = menu.getBoundingClientRect();

    const y = Math.min(r.top - 8, innerHeight - 8 - submenu.offsetHeight);
    submenu.style.left = `${Math.max(8, x)}px`;
    submenu.style.top = `${Math.max(8, y)}px`;

}
function subHighlight(i) {

submenu.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    subHighlight(stepIn(subItems, subIndex, e.key === "ArrowDown"));
  } else if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    pickSub(subIndex);
  } else if (e.key === "ArrowLeft" || e.key === "Escape") {
    e.preventDefault();

function fileMenu(at) {
  const ids = selection();
  if (!ids.length) return;
  const one = ids.length === 1;
  if (inTrash()) {
    return showMenu([
      { label: one ? "Restore" : `Restore ${ids.length} files`, act: () => restoreFiles(ids) },
      { label: "Delete forever", act: () => deleteForever(ids) },
    ], at);
  }
  const starred = ids.every((id) => byId(id).starred);
  showMenu([
    { label: one ? "Open" : `Open ${ids.length} files`, kbd: "Enter", act: () => openFiles(ids) },
    ...(LIVE ? [] : [{ label: "Open in the background", kbd: MOD + "Enter", act: () => openFiles(ids, true) }]),
    null,
    { label: starred ? "Remove from starred" : "Add to starred", kbd: "S", act: () => toggleStar(ids) },
    { label: "Rename", kbd: "R", disabled: !one, act: () => rename(ids[0]) },
    { label: "Move to…", kbd: "M", act: () => openMover(ids, at) },
    { label: "Duplicate", kbd: MOD + "D", act: () => duplicate(ids) },

}

// Move to: a menu that filters projects as you type
function openMover(ids, at, above = false) {
  const current = new Set(ids.map((id) => byId(id).project ?? null));
  const targets = [{ project: null, label: "Drafts", where: "" }];
  for (const plan of PLANS) for (const team of plan.teams) for (const [id, name] of team.projects) targets.push({ project: id, label: name, where: team.name });
  closeMenu();
  menuReturn = document.activeElement;
  menu.innerHTML = `<input type="text" role="combobox" aria-expanded="true" aria-controls="mlist" aria-autocomplete="list" placeholder="Move ${esc(named(ids))} to…" aria-label="Project" spellcheck="false"><div class="mlist" id="mlist" role="listbox" aria-label="Projects"></div>`;
  const input = $("input", menu);
  const list = $(".mlist", menu);
  const draw = () => {
    const q = input.value.trim();
    const shown = targets.map((t) => ({ t, m: q ? match(q, `${t.label} ${t.where}`) : { score: 0 } })).filter((x) => x.m).sort((a, b) => b.m.score - a.m.score);
    menuItems = shown.map(({ t }) => ({ label: t.label, disabled: current.size === 1 && current.has(t.project), act: () => moveFiles(ids, t.project) }));
    let team = null;
    list.innerHTML = shown.length ? shown.map(({ t }, i) => {
      let header = "";
      if (!q && t.where !== team) {
        team = t.where;
        header = `<div class="mh">${esc(team)}</div>`;
      }
      const here = current.size === 1 && current.has(t.project);
      return `${header}<button class="mi" id="mi${i}" tabindex="-1" role="option" data-i="${i}" ${here ? 'aria-disabled="true"' : ""}>${t.project ? folderIcon(t.project) : icon("file")}<span style="margin-left:8px">${esc(t.label)}</span>${q && t.where ? `<span class="x">${esc(t.where)}</span>` : here ? `<span class="x">Here now</span>` : ""}</button>`;
    }).join("") : `<div class="none">No project called “${esc(q)}”</div>`;
    const first = menuItems.findIndex((item) => !item.disabled);
    highlight(first);
  };
  menuKeys = (e) => {
    if (e.key.length === 1 || e.key === "Backspace") return true;
    return false;
  };
  input.addEventListener("input", draw);
  draw();
  placeMenu(at, above);
  input.focus();
}

/* Theme: the same palettes as Figma tabs get (themes.js) */

// In Ligma, the themes picked in its settings, which reach every Figma tab
// as "ligma-appearance" (appearance.rs) and come again when they change;
// the system says light or dark. Elsewhere the URL can pick, for previews
const pref = { theme: params.get("theme") ?? "figma", mode: params.get("mode") ?? "system" };
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
if (LIVE) {
  try {
    Live.appearance = JSON.parse(localStorage.getItem("ligma-appearance"));
  } catch {}
  window.__ligmaHomeAppearance = (page) => {
    Live.appearance = page;
    applyTheme();
  };
}
function applyTheme() {
  const dark = pref.mode === "dark" || (pref.mode === "system" && darkQuery.matches);
  const mode = dark ? "dark" : "light";
  const root = document.documentElement;
  root.dataset.mode = mode;
  root.style.colorScheme = mode;
  document.body.dataset.preferredTheme = mode;
  if (typeof ligmaPalette !== "function") return;
  const theme = Live.appearance ? (dark ? Live.appearance.dark : Live.appearance.light) ?? "figma" : pref.theme;
  const vars = ligmaPalette(theme, mode);
  const step = (s) => LIGMA_STEPS.indexOf(s);
  const grey = (s) => vars[`--ramp-grey-${s}`] ?? LIGMA_GREY[step(s)];
  const accent = (s) => vars[`--ligma-accent-${s}`] ?? LIGMA_BLUE[mode][step(s)];
  const white = vars["--ramp-white-1000"] ?? "#ffffff";
  const tokens = dark
    ? { bg: grey(800), bg2: grey(900), bg3: grey(700), line: grey(600), hover: grey(700), text: "#ffffff", text2: "rgba(255, 255, 255, 0.7)", text3: "rgba(255, 255, 255, 0.4)", canvas: grey(900), accent: accent(500), "accent-text": accent(300), sel: `color-mix(in srgb, ${accent(500)} 24%, ${grey(800)})`, "sel-strong": accent(700), menu: grey(900), "menu-line": grey(700), toast: grey(1000), shadow: "0 2px 5px rgba(0, 0, 0, 0.3), 0 10px 24px rgba(0, 0, 0, 0.4)" }
    : { bg: white, bg2: grey(100), bg3: grey(200), line: grey(200), hover: grey(100), text: grey(900), text2: `color-mix(in srgb, ${grey(500)} 84%, ${grey(900)})`, text3: grey(400), canvas: grey(100), accent: accent(500), "accent-text": accent(700), sel: accent(200), "sel-strong": accent(300), menu: white, "menu-line": grey(200), toast: grey(900), shadow: "0 2px 5px rgba(0, 0, 0, 0.08), 0 10px 24px rgba(0, 0, 0, 0.12)" };
  for (const [name, value] of Object.entries(tokens)) root.style.setProperty("--" + name, value);
}
darkQuery.addEventListener("change", applyTheme);

// Asks Ligma for something it does itself (new_home.rs): through
// window.open on Windows, and on macOS as an iframe load, which WKWebView
// reports to on_navigation
function signal(action, params = {}) {
  const url = `https://home.ligma.invalid/${action}?${new URLSearchParams(params)}`;
  if (!MAC) return void window.open(url, "_blank");
  const frame = document.createElement("iframe");
  frame.style.display = "none";
  frame.src = url;
  document.documentElement.appendChild(frame);
  setTimeout(() => frame.remove(), 1000);
}

const avatar = (user, cls = "") =>
  `<span class="av ${cls}" style="background:${colorForTeam(user.id)}">${user.img_url ? `<img src="${esc(user.img_url)}" alt="" referrerpolicy="no-referrer">` : esc((user.name || user.email || "?")[0])}</span>`;

// Figma's account menu, as its home page has it. Theme is Ligma's color
// scheme, for Figma and Ligma alike; Settings, Ligma's. Figma's own
// settings open only as a dialog of its file browser, with no link
function accountMenu(at) {
  const users = LIVE ? Live.users : [{ id: "me", name: "Chris", email: "chris@example.com", community_profile_handle: "chris" }, { id: "work", name: "Chris (work)", email: "chris@northwind.example" }];
  const me = users.find((u) => u.id === (LIVE ? Live.uid : "me"));
  if (!me) return;
  const scheme = LIVE ? Live.appearance?.scheme ?? "system" : pref.mode;
  const setScheme = (value) => {
    if (!LIVE) {
      pref.mode = value;
      return applyTheme();
    }
    Live.appearance = { ...Live.appearance, scheme: value };
    signal("scheme", { value });
  };
  const open = (url) => window.open(url, "_blank");
  const logOutItem = users.length < 2
    ? { label: "Log out", act: () => logOut(me) }
    : { label: "Log out", sub: [...users.map((u) => ({ label: u.email ?? u.name, act: () => logOut(u) })), null, { label: "Log out of all accounts", act: () => logOut(null) }] };
  // Figma's order, with its icons where it has them. The card is the
  // account you're on; the others are one click away, not in a submenu
  const others = users.filter((u) => u.id !== me.id);
  showMenu([
    { html: `<div class="acard" aria-hidden="true">${avatar(me)}<b>${esc(me.name ?? me.email)}</b>${me.email ? `<span>${esc(me.email)}</span>` : ""}</div>` },
    null,
    ...(others.length
      ? [{ header: "Switch account" }, ...others.map((u) => ({ label: u.name ?? u.email, detail: u.name ? u.email : "", iconHtml: avatar(u, "sm"), act: () => LIVE && switchAccount(u.id) }))]
      : []),
    // Figma allows 10 accounts at once
    { label: "Add account", iconHtml: fig("plus"), disabled: users.length >= 10, act: () => open("https://www.figma.com/login?cont=") },
    null,
    { header: "Community" },
    ...(me.community_profile_handle ? [{ label: "View Community profile", iconHtml: fig("community"), act: () => open(`https://www.figma.com/@${me.community_profile_handle}`) }] : []),
    { label: "Saved from Community", iconHtml: fig("bookmark"), act: () => open("https://www.figma.com/community/saves") },
    null,
    {
      label: "Change theme",
      sub: [["light", "Light"], ["dark", "Dark"], ["system", "System theme"]].map(([value, label]) => ({ label, checked: scheme === value, act: () => setScheme(value) })),
    },
    { label: "Settings", act: () => (LIVE ? signal("settings") : toast("Opens Ligma's settings")) },
    null,
    logOutItem,
  ], at, { account: true });
}

// Figma's logout: one account, or every one (user null). What's left of
// the session loads again, or the sign-in page if nothing is
async function logOut(user) {
  if (!LIVE) return toast(`Logs out of ${user ? user.email : "every account"}`);
  try {
    await api(user ? `/api/session/logout/${user.id}` : "/api/session/logout", { method: "POST", user: null });
  } catch (error) {
    return toast(`Couldn't log out: ${error.message}`);
  }
  toast(user ? `Logged out of ${user.email ?? user.name}` : "Logged out of every account");
  // What this page kept of the account goes too
  for (const u of user ? [user] : Live.users) for (const key of ["cache", "trash"]) store.drop(`${key}:${u.id}`);
  if (user && user.id !== Live.uid) {
    Live.users = Live.users.filter((u) => u.id !== user.id);
    saveCache();
    return renderSide();
  }
  const next = user ? Live.users.find((u) => u.id !== user.id) : null;
  await switchAccount(next?.id ?? null);
}

// Letters of `query` in order in `text`; more for runs, word starts and
// whole substrings. Each word of the query has to match
function match(query, text) {
  const lower = text.toLowerCase();
  let total = 0;
  const hits = new Set();
  for (const word of query.toLowerCase().split(/\s+/).filter(Boolean)) {
    let score = 0;
    let at = 0;
    let last = -2;
    const local = [];
    for (let j = 0; j < lower.length && at < word.length; j++) {
      if (lower[j] !== word[at]) continue;
      score += (j === last + 1 ? 3 : 1) + (j === 0 || /[\s—\-_./(]/.test(lower[j - 1]) ? 4 : 0);
      local.push(j);
      last = j;
      at++;
    }
    if (at < word.length) return null;
    const sub = lower.indexOf(word);
    if (sub >= 0) {
      score += 8 + (sub === 0 ? 6 : 0);
      local.length = 0;
      for (let k = 0; k < word.length; k++) local.push(sub + k);
    }
    local.forEach((j) => hits.add(j));
    total += score;
  }
  return { score: total - lower.length * 0.02, hits };
}
function marked(text, hits) {
  if (!hits?.size) return esc(text);
  let out = "";
  for (let i = 0; i < text.length; i++) out += hits.has(i) ? `<b>${esc(text[i])}</b>` : esc(text[i]);
  return out.replace(/<\/b><b>/g, "");
}

function openPalette() {
  closeMenu();
  closeInbox(false);
  chips = [];
  palInput.value = "";
  if (!pal.open) pal.showModal();
  palInput.focus();
  drawPalette();
}
pal.addEventListener("pointerdown", (e) => {
  if (e.target === pal) pal.close();
});
pal.addEventListener("close", () => {
  if (document.activeElement && document.activeElement !== document.body && !pal.contains(document.activeElement)) return;
  const card = state.focus && cardEl(state.focus);
  card?.focus({ preventScroll: true });
});

function parse() {
  const text = palInput.value;
  const token = text.match(/(?:^|\s)(in|type|by):(\S*)$/i);
  if (!token) return { query: text.trim(), scope: null };
  const start = token.index + (token[0].length - token[1].length - token[2].length - 1);
  return { query: text.slice(0, start).trim(), scope: { key: token[1].toLowerCase(), q: token[2], start } };
}

function fileRow(file, i, hits) {
  return `<div class="pr file" role="option" id="po${i}" data-i="${i}" aria-selected="${i === palIndex}">
    <div class="pt" data-key="${file.key ?? file.id}">${thumb(file)}</div>
    <div class="pn">${glyph(file.type)}<span>${marked(file.name, hits)}</span>${file.unread ? `<span class="badge">${file.unread}</span>` : ""}</div>
    <span class="pp">${esc(placeOf(file.project))}</span><span class="pw">${esc(short(file.at))}</span></div>`;
}
function row(i, iconHtml, label, tail = "") {
  return `<div class="pr" role="option" id="po${i}" data-i="${i}" aria-selected="${i === palIndex}">${iconHtml}<div class="pn"><span>${label}</span></div>${tail}</div>`;
}

// Figma's search, for files not loaded here yet; it also matches what's
// in them. Results join the list as they come
let searchTimer = 0;
let searched = "";
function searchFigma(query) {
  clearTimeout(searchTimer);
  if (!LIVE || !Live.uid || !query || query === searched) return;
  searchTimer = setTimeout(async () => {
    searched = query;
    try {
      const meta = await api(`/api/search/full_results?${new URLSearchParams({ query, search_model_type: "files", sort: "relevancy", desc: "true" })}`);
      for (const result of meta?.results ?? []) if (result.model?.key && !result.model.trashed_at) fromRest(result.model).found = query;
    } catch {}
    if (pal.open && parse().query === query) drawPalette();
  }, 180);
}

function drawPalette() {
  const { query, scope } = parse();
  const items = [];
  let html = "";
  palBody.classList.remove("split");
  palChips.innerHTML = chips.map((chip, i) => `<span class="chip"><i>${chip.key}:</i>${esc(chip.label)}<button data-chip="${i}" aria-label="Remove ${chip.key} ${esc(chip.label)}">${icon("x")}</button></span>`).join("");
  const live = FILES.filter((f) => !f.trashed);
  const scoped = live.filter((f) => chips.every((c) => (c.key === "in" ? f.project === c.value : c.key === "type" ? f.type === c.value : f.by === c.value)));
  const recency = (f) => 3 * Math.exp(-(Date.now() - f.at) / (7 * DAY));

  if (scope) {
    const options = SCOPES[scope.key].options()
      .map((o) => ({ o, m: scope.q ? match(scope.q, o.label) : { score: 0 } }))
      .filter((x) => x.m)
      .sort((a, b) => b.m.score - a.m.score)
      .slice(0, 9);
    html += `<div class="ph">${SCOPES[scope.key].title}<small>Tab or Enter to add</small></div>`;
    options.forEach(({ o, m }) => {
      const i = items.push({ kind: "scope", key: scope.key, value: o.value, label: o.label, start: scope.start }) - 1;
      html += row(i, icon(scope.key === "in" ? "folder" : scope.key === "by" ? "users" : "file"), marked(o.label, m.hits), o.where ? `<span class="pp">${esc(o.where)}</span>` : "");
    });
    if (!options.length) html += `<div class="pmsg">Nothing called <b>${esc(scope.q)}</b></div>`;
  } else if (!query && !chips.length) {
    palBody.classList.add("split");
    let left = `<div class="ph">Recent</div>`;
    live.slice().sort((a, b) => b.at - a.at).slice(0, 8).forEach((file) => {
      const i = items.push({ kind: "file", id: file.id }) - 1;
      left += fileRow(file, i);
    });
    let right = `<div class="ph">Starred</div>`;
    live.filter((f) => f.starred).sort((a, b) => b.at - a.at).slice(0, 5).forEach((file) => {
      const i = items.push({ kind: "file", id: file.id }) - 1;
      right += row(i, glyph(file.type), esc(file.name));
    });
    right += `<div class="ph">Create</div>`;
    for (const type of Object.keys(TYPES)) {
      const i = items.push({ kind: "create", type, name: "Untitled" }) - 1;
      right += row(i, glyph(type), `New ${TYPES[type].noun}`);
    }
    right += `<div class="ph">Narrow down</div><div class="scopes">${Object.keys(SCOPES).map((key) => `<button data-scope="${key}">${key}:</button>`).join("")}</div>`;
    html = `<div>${left}</div><div>${right}</div>`;
  } else {
    searchFigma(query);
    const files = scoped
      .map((file) => ({ file, m: query ? match(query, file.name) ?? (match(query, `${file.name} ${placeOf(file.project)}`) && { score: -4, hits: null }) ?? (file.found === query && { score: -6, hits: null }) : { score: 0 } }))
      .filter((x) => x.m)
      .sort((a, b) => b.m.score + recency(b.file) - (a.m.score + recency(a.file)));
    if (files.length) {
      html += `<div class="ph">Files<small>${files.length > 8 ? `8 of ${files.length}` : files.length}</small></div>`;
      files.slice(0, 8).forEach(({ file, m }) => {
        const i = items.push({ kind: "file", id: file.id }) - 1;
        html += fileRow(file, i, m.hits);
      });
    }
    const inChip = chips.find((c) => c.key === "in");
    if (query && !inChip) {
      const projects = Object.values(PROJECTS).map((p) => ({ p, m: match(query, p.name) })).filter((x) => x.m).sort((a, b) => b.m.score - a.m.score).slice(0, 3);
      if (projects.length) {
        html += `<div class="ph">Projects</div>`;
        for (const { p, m } of projects) {
          const i = items.push({ kind: "view", view: "p:" + p.id }) - 1;
          html += row(i, folderIcon(p.id), marked(p.name, m.hits), `<span class="pp">${esc(p.team.name)}</span>`);
        }
      }
    }
    if (!files.length) html = `<div class="pmsg">No files match <b>${esc(query || "these filters")}</b>${chips.length ? " with these filters" : ""}</div>` + html;
    html += `<div class="ph">Actions</div>`;
    if (query) {
      const where = inChip ? inChip.value : state.view.startsWith("p:") ? state.view.slice(2) : null;
      for (const type of ["design", "figjam"]) {

function selectPal(i, scroll = true) {

function activate(item, background = false) {

    chips.push({ key: item.key, value: item.value, label: item.label });
    palInput.value = palInput.value.slice(0, item.start).replace(/\s+$/, "");

const measureCards = () => $$(".card[data-id]", scroller).map((el) => ({ id: el.dataset.id, l: el.offsetLeft, t: el.offsetTop, r: el.offsetLeft + el.offsetWidth, b: el.offsetTop + el.offsetHeight }));

  const y = Math.min(Math.max(box.py - area.top, 0), scroller.clientHeight) + scroller.scrollTop;
  const [x1, x2] = [Math.min(box.x, x), Math.max(box.x, x)];

  const next = new Set([...box.base, ...hits]);

scroller.addEventListener("pointerdown", (e) => {

    y: e.clientY - area.top + scroller.scrollTop,

    px: e.clientX,
    py: e.clientY,
    pointer: e.pointerId,

// On the window, so the box follows the pointer and ends on release

addEventListener("pointermove", (e) => {

addEventListener("pointercancel", endBox, true);
addEventListener("blur", () => endBox());

/* Starred: pick a file up and put it somewhere else. It hangs from the
   pointer and swings as it moves, the files around it make room, and it
   drops into its place with a small bounce. Let go over a project, Drafts
   or the Trash in the sidebar and it goes there, as any dragged file does */

const calm = () => reducedMotion.matches;
const GHOST_PAD = 6;

scroller.addEventListener("pointerdown", (e) => {
  // A press that never became a drag (released outside, say) doesn't block this one
  if (lift?.live || e.button !== 0 || e.pointerType === "touch" || e.ctrlKey || e.metaKey || e.shiftKey) return;
  const card = e.target.closest(".star-grid > .card[data-id]");
  if (!card || e.target.closest("button")) return;

});
scroller.addEventListener("pointermove", (e) => {

scroller.addEventListener("pointerup", (e) => {

  if (lift.live) dropLift();
  else lift = null;
});

function startLift() {
  const l = lift;

  const card = (l.card = cardEl(l.id));
  const grid = card?.parentElement;
  if (!grid?.classList.contains("star-grid")) return void (lift = null);
  const r = card.getBoundingClientRect();
  closeMenu();
  tip.style.display = "none";
  if (!state.sel.has(l.id) || state.sel.size > 1) setSel([l.id], l.id);
  const ghost = card.cloneNode(true);
  ghost.removeAttribute("id");
  for (const el of ghost.querySelectorAll("[id]")) el.removeAttribute("id");
  ghost.querySelector(".tools")?.remove();
  ghost.className = "card lifted";
  ghost.setAttribute("aria-hidden", "true");
  ghost.removeAttribute("role");
  ghost.style.width = `${r.width + GHOST_PAD * 2}px`;

  const ox = l.sx - r.left + GHOST_PAD;
  const oy = l.sy - r.top + GHOST_PAD;
  ghost.style.transformOrigin = `${ox}px ${oy}px`;
  ghost.style.transform = `translate(${r.left - GHOST_PAD}px, ${r.top - GHOST_PAD}px)`;
  document.body.append(ghost);
  card.classList.add("hole");
  document.body.classList.add("grabbing");

    scroller.setPointerCapture(l.pointer);

// Each frame: follow the pointer, swing, scroll near an edge, make room
function stepLift(now) {
  const l = lift;
  if (!l?.live || l.dropping) return;
  const dt = Math.min(3, Math.max(0.25, (now - l.lastT) / 16.67));
  l.lastT = now;
  l.vx += ((l.px - l.lastX) / dt - l.vx) * 0.12;
  l.lastX = l.px;
  // Hanging from the pointer, it trails behind the way it moves: the
  // farther from where it's held, the more it leans. A spring that
  // overshoots a little brings it back
  const lever = (l.h / 2 - l.oy) / (l.h / 2);
  const lean = calm() ? 0 : Math.max(-7, Math.min(7, l.vx * 0.3 * lever));
  l.angV += ((lean - l.ang) * 0.06 - l.angV * 0.2) * dt;
  l.ang += l.angV * dt;
  l.scale += ((calm() ? 1 : 1.04) - l.scale) * Math.min(1, 0.22 * dt);
  const area = scroller.getBoundingClientRect();
  const edge = 56;
  const dy = l.py < area.top + edge ? -(area.top + edge - l.py) / 3 : l.py > area.bottom - edge ? (l.py - area.bottom + edge) / 3 : 0;

  l.ghost.style.transform = `translate(${l.px - l.ox}px, ${l.py - l.oy}px) rotate(${l.ang.toFixed(2)}deg) scale(${l.scale.toFixed(4)})`;
  retarget(area);
  l.frame = requestAnimationFrame(stepLift);

function retarget(area) {
  const l = lift;
  const over = document.elementFromPoint(l.px, l.py)?.closest("#side [data-drop]") ?? null;
  if (over !== l.target) {
    l.target?.classList.remove("drop");
    over?.classList.add("drop");
    l.target = over;

  if (over || l.px < area.left || l.px > area.right) return;
  const gx = l.px - area.left + scroller.scrollLeft;
  const gy = l.py - area.top + scroller.scrollTop;

  let bestDistance = Infinity;
  l.slots.forEach((s, i) => {

    if (d < bestDistance) [best, bestDistance] = [i, d];

  for (const el of others) {
    const a = was.get(el);
    const b = el.getBoundingClientRect();
    const dx = a.left - b.left;
    const dy = a.top - b.top;
    if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) continue;
    el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], { duration: calm() ? 1 : 340, easing: "cubic-bezier(0.2, 0.9, 0.3, 1.12)" });
  }
}

function dropLift(cancel = false) {
  const l = lift;
  cancelAnimationFrame(l.frame);
  l.dropping = true;
  liftJustEnded = true;
  setTimeout(() => (liftJustEnded = false));
  document.body.classList.remove("grabbing");
  l.target?.classList.remove("drop");
  try {
    scroller.releasePointerCapture(l.pointer);
  } catch {}
  const finish = () => {
    l.ghost.remove();
    l.card.classList.remove("hole");
    lift = null;
  };
  const into = !cancel && l.target;
  if (into) {
    // Into the sidebar: it shrinks away into where it went
    const t = into.getBoundingClientRect();
    const fall = l.ghost.animate([{ transform: l.ghost.style.transform, opacity: 1 }, { transform: `translate(${t.left + 20 - l.ox}px, ${t.top + t.height / 2 - l.oy}px) scale(0.12)`, opacity: 0 }], { duration: calm() ? 1 : 240, easing: "cubic-bezier(0.5, 0, 0.75, 0)", fill: "forwards" });
    fall.onfinish = () => {
      finish();
      if (into.dataset.drop === "trash") trashFiles([l.id]);
      else moveFiles([l.id], into.dataset.drop === "drafts" ? null : into.dataset.drop.slice(2));
      if (l.rerender) render();
    };
    return;
  }
  if (cancel) moveHole(l.from);
  // Down into its place, quickening as it falls, then a squash and a
  // rebound as it lands; the files beside it take a little of the knock
  const r = l.card.getBoundingClientRect();
  const fall = l.ghost.animate([{ transform: l.ghost.style.transform }, { transform: `translate(${r.left - GHOST_PAD}px, ${r.top - GHOST_PAD}px) rotate(0deg) scale(1)` }], { duration: calm() ? 1 : 200, easing: "cubic-bezier(0.55, 0, 0.85, 0.5)", fill: "forwards" });
  fall.onfinish = () => {
    finish();
    if (!calm()) {
      const origin = "50% 85%";
      l.card.animate([{ transform: "scale(1.035, 0.95)", transformOrigin: origin }, { transform: "scale(0.99, 1.015)", transformOrigin: origin, offset: 0.45 }, { transform: "none", transformOrigin: origin }], { duration: 320, easing: "ease-out" });
      const at = [...l.grid.children].indexOf(l.card);
      [[l.grid.children[at - 1], -1], [l.grid.children[at + 1], 1]].forEach(([el, side]) => {
        if (el && Math.abs(el.offsetTop - l.card.offsetTop) < 4) el.animate([{ transform: "none" }, { transform: `translateX(${side * 3}px)`, offset: 0.3 }, { transform: "none" }], { duration: 280, easing: "ease-out" });
      });
    }
    commitStarOrder(l.grid);
    focusCard(l.id, false);
    if (l.rerender) render();
  };
}

// The order as the grid now shows it, kept for next time
function commitStarOrder(grid) {
  const shown = [...grid.children].map((el) => el.dataset.id);
  const rest = store.get(starOrderKey(), []).filter((id) => !shown.includes(id) && byId(id)?.starred);
  store.set(starOrderKey(), [...shown, ...rest]);
  // On Home the starred row comes first, then the other sections
  order = [...shown, ...order.filter((id) => !shown.includes(id))];
  previousOrder = order;
}
side.addEventListener("dragover", (e) => {
  const target = e.target.closest("[data-drop]");
  if (!target || !e.dataTransfer.types.includes("application/x-ligma-files")) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  $$(".nav.drop", side).forEach((el) => el !== target && el.classList.remove("drop"));
  target.classList.add("drop");
});
side.addEventListener("dragleave", (e) => {
  const target = e.target.closest("[data-drop]");
  if (target && !target.contains(e.relatedTarget)) target.classList.remove("drop");
});
side.addEventListener("drop", (e) => {
  const target = e.target.closest("[data-drop]");
  if (!target) return;
  e.preventDefault();
  target.classList.remove("drop");
  const ids = e.dataTransfer.getData("application/x-ligma-files").split(",").filter((id) => byId(id));
  const drop = target.dataset.drop;
  if (drop === "trash") trashFiles(ids);
  else moveFiles(ids, drop === "drafts" ? null : drop.slice(2));
});

addEventListener("keydown", (e) => {
  const typing = e.target.closest?.("input, textarea, [contenteditable]");
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !typing && toastUndo && !toastEl.hidden) {
    e.preventDefault();
    const undo = toastUndo;
    hideToast();
    undo();
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    pal.open ? pal.close() : openPalette();
  } else if (e.key === "/" && !typing && !pal.open) {
    e.preventDefault();
    openPalette();
  } else if (!typing && !pal.open && !menu.classList.contains("open") && e.target === document.body && e.key.startsWith("Arrow") && order.length) {
    e.preventDefault();
    setSel([order[0]], order[0]);
    focusCard(order[0]);
  }
});

// Focus rings show once the keyboard moves focus around, and go when the
// pointer's used again. Focus Ligma moves itself, after a click or a
// selection box, stays without one
const NAV_KEYS = new Set(["Tab", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Home", "End", "PageUp", "PageDown"]);
addEventListener("keydown", (e) => NAV_KEYS.has(e.key) && document.documentElement.classList.add("kbd"), true);
addEventListener("pointerdown", () => document.documentElement.classList.remove("kbd"), true);

/* Sync: shown from what's saved at once, then brought up to date */

function syncNow() {
  const sync = $("#sync");
  sync?.classList.add("busy");
  if (sync) sync.lastElementChild.textContent = "Checking for changes";
  setTimeout(() => {
    render();
    const done = $("#sync");
    if (done) done.lastElementChild.textContent = "Sample files, not yours yet";
  }, 700);
}

applyTheme();
if (LIVE) boot();
else {
  loadPins();
  seedFiles();
  seedNotes();
  render({ keepScroll: false });
}
if (state.mode === "loading") setTimeout(() => {
  state.mode = null;
  render({ keepScroll: false });
}, 1600);
</script>
</body>
