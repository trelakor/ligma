    if (!state.sel.has(id)) setSel([id], id);
    focusCard(id, false);
    return fileMenu(e.target.closest(".more").getBoundingClientRect());
  }
  if (e.ctrlKey || e.metaKey) {
    const next = new Set(state.sel);
    next.has(id) ? next.delete(id) : next.add(id);
    setSel([...next], id);
  } else if (e.shiftKey && state.anchor) rangeTo(id);
  else setSel([id], id);
  focusCard(id, false);
});
/* Selection box: drag over empty space to select every file it touches.
   Ctrl, Cmd or Shift adds to the files already selected. Near the top or
   bottom edge the list scrolls along */

let boxJustEnded = false;
let boxFrame = 0;

// Where each file is, in the list's own coordinates; again after a redraw
const measureCards = () => $$(".card[data-id]", scroller).map((el) => ({ id: el.dataset.id, l: el.offsetLeft, t: el.offsetTop, r: el.offsetLeft + el.offsetWidth, b: el.offsetTop + el.offsetHeight }));
function drawBox() {
  const area = scroller.getBoundingClientRect();
  const x = Math.min(Math.max(box.px - area.left, 0), scroller.clientWidth) + scroller.scrollLeft;
  const y = Math.min(Math.max(box.py - area.top, 0), scroller.clientHeight) + scroller.scrollTop;
  const [x1, x2] = [Math.min(box.x, x), Math.max(box.x, x)];
  const [y1, y2] = [Math.min(box.y, y), Math.max(box.y, y)];
  Object.assign(marquee.style, { left: `${x1}px`, top: `${y1}px`, width: `${x2 - x1}px`, height: `${y2 - y1}px` });
  box.cards ??= measureCards();
  const hits = box.cards.filter((c) => c.l < x2 && c.r > x1 && c.t < y2 && c.b > y1).map((c) => c.id);
  const next = new Set([...box.base, ...hits]);
  if (next.size !== state.sel.size || hits.some((id) => !state.sel.has(id))) setSel(order.filter((id) => next.has(id)), hits[0] ?? state.anchor);
  box.last = hits;
}
function edgeScroll() {
  if (!box?.moved) return;
  const area = scroller.getBoundingClientRect();
  const edge = 48;
  const dy = box.py < area.top + edge ? -(area.top + edge - box.py) / 3 : box.py > area.bottom - edge ? (box.py - area.bottom + edge) / 3 : 0;
  if (dy) {
    scroller.scrollTop += Math.round(dy);
    drawBox();
  }
  boxFrame = requestAnimationFrame(edgeScroll);
}

scroller.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 || e.pointerType === "touch" || e.target.closest(".card, button, a, input, .empty")) return;
  // Not on the scrollbar
  if (e.target === scroller && e.offsetX > scroller.clientWidth) return;
  // A box left over from a release the page never heard about
  if (box) endBox();
  const area = scroller.getBoundingClientRect();
  box = {
    x: e.clientX - area.left + scroller.scrollLeft,
    y: e.clientY - area.top + scroller.scrollTop,
    sx: e.clientX,
    sy: e.clientY,
    px: e.clientX,
    py: e.clientY,
    pointer: e.pointerId,
    moved: false,
    base: e.ctrlKey || e.metaKey || e.shiftKey ? new Set(state.sel) : new Set(),
    cards: null,
    last: [],
  };
});
// On the window, so the box follows the pointer and ends on release
// wherever that is: over the sidebar, the header or outside the window
addEventListener("pointermove", (e) => {
  if (!box || e.pointerId !== box.pointer) return;
  // Released where the page didn't hear it
  if (!(e.buttons & 1)) return endBox();
  box.px = e.clientX;
  box.py = e.clientY;
  if (!box.moved) {
    if (Math.hypot(e.clientX - box.sx, e.clientY - box.sy) < 4) return;
    box.moved = true;
    try {
      scroller.setPointerCapture(e.pointerId);
    } catch {}
    scroller.append(marquee);
    closeMenu();
    boxFrame = requestAnimationFrame(edgeScroll);
  }
  drawBox();
}, true);
function endBox(e) {
  if (!box || (e && e.pointerId !== box.pointer)) return;
  cancelAnimationFrame(boxFrame);
  const ended = box;
  box = null;
  marquee.remove();
  try {
    if (scroller.hasPointerCapture(ended.pointer)) scroller.releasePointerCapture(ended.pointer);
  } catch {}
  if (!ended.moved) return;
  // The click that ends the box does nothing else, wherever it lands
  boxJustEnded = true;
  setTimeout(() => (boxJustEnded = false));
  const first = order.find((id) => state.sel.has(id));
  if (first) focusCard(ended.last[0] ?? first, false);
}
addEventListener("pointerup", endBox, true);
addEventListener("pointercancel", endBox, true);
addEventListener("blur", () => endBox());
addEventListener("click", (e) => {
  if (!boxJustEnded) return;
  boxJustEnded = false;
  e.stopPropagation();
  e.preventDefault();
}, true);
scroller.addEventListener("scroll", () => box?.moved && drawBox(), { passive: true });

scroller.addEventListener("dblclick", (e) => {
  const card = e.target.closest(".card[data-id]");
  if (!card || e.target.closest("button")) return;
  if (inTrash()) toast("Restore the file to open it");
  else openFiles([card.dataset.id]);
});
scroller.addEventListener("contextmenu", (e) => {
  const project = e.target.closest("[data-project]")?.dataset.project;
  if (project) {
    e.preventDefault();
    return showMenu([
      { label: "Open", act: () => go("p:" + project) },
      { label: "Open in Figma", ext: true, act: () => window.open(`https://www.figma.com/files/project/${project}`, "_blank") },
    ], { x: e.clientX, y: e.clientY });
  }
  const card = e.target.closest(".card[data-id]");
  if (!card) return;
  e.preventDefault();
  const id = card.dataset.id;
  if (!state.sel.has(id)) setSel([id], id);
  focusCard(id, false);
  fileMenu({ x: e.clientX, y: e.clientY });
});
scroller.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  // Home's own buttons (fold, View all, a project) take their keys
  if (e.target.closest("button, a") && !e.target.closest(".card")) return;
  if (!order.length) return;
  const id = state.focus && order.includes(state.focus) ? state.focus : order[0];
  const mod = e.ctrlKey || e.metaKey;
  const move = (next) => {
    if (!next) return;
    if (e.shiftKey) rangeTo(next);
    else setSel([next], next);
    focusCard(next);
  };
  const trash = inTrash();
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  // Alt+Left and Alt+Right move starred files, as dragging does
  if (e.altKey && state.view === "starred" && (key === "ArrowLeft" || key === "ArrowRight")) {
    e.preventDefault();
    const ids = selection();
    const left = key === "ArrowLeft";
    const edge = order.indexOf(left ? ids[0] : ids.at(-1));
    if (left && edge > 0) reorderStarred(ids, order[edge - 1]);
    else if (!left && edge < order.length - 1) reorderStarred(ids, order[edge + 2] ?? null);
    return focusCard(id);
  }
  if (["ArrowRight", "ArrowLeft", "ArrowDown", "ArrowUp"].includes(key)) {
    e.preventDefault();
    if (!state.focus) return move(order[0]);
    move(neighbor(id, key));
  } else if (key === "Home" || key === "End") {
    e.preventDefault();
    move(key === "Home" ? order[0] : order.at(-1));
  } else if (key === "Enter") {
    e.preventDefault();
    if (trash) restoreFiles(selection());
    else openFiles(selection(), mod);
  } else if (key === "ContextMenu" || (e.shiftKey && key === "F10")) {
    e.preventDefault();
    if (!state.sel.has(id)) setSel([id], id);
    fileMenu(cardEl(id).getBoundingClientRect());
  } else if (key === " ") {
    e.preventDefault();
    const next = new Set(state.sel);
    next.has(id) ? next.delete(id) : next.add(id);
    setSel([...next], id);
  } else if (key === "Escape") setSel([]);
  else if (key === "a" && mod) {
    e.preventDefault();
    setSel(order);
  } else if (key === "d" && mod && !trash) {
    e.preventDefault();
    duplicate(selection());
  } else if ((key === "Delete" || key === "Backspace") && !trash) trashFiles(selection());
  else if (mod || e.altKey || trash) return;
  else if (key === "s") toggleStar(selection());
  else if (key === "r" && selection().length === 1) {
    e.preventDefault();
    rename(selection()[0]);
  } else if (key === "m" && selection().length) {
    e.preventDefault();
    openMover(selection(), cardEl(selection()[0]).getBoundingClientRect());
  }
});
scroller.addEventListener("focusin", (e) => {
  const card = e.target.closest(".card[data-id]");
  if (card) state.focus = card.dataset.id;
});

/* Drag files onto a project, Drafts or the Trash in the sidebar */

scroller.addEventListener("dragstart", (e) => {
  // Starred has its own drag (startLift), which a native one would cancel
  if (e.target.closest(".star-grid")) return void e.preventDefault();
  const card = e.target.closest(".card[data-id]");
  if (!card) return;
  if (!state.sel.has(card.dataset.id)) setSel([card.dataset.id], card.dataset.id);
  const ids = selection();
  e.dataTransfer.setData("text/plain", ids.map((id) => fileUrl(byId(id))).join("\n"));
  e.dataTransfer.setData("application/x-ligma-files", ids.join(","));
  e.dataTransfer.effectAllowed = "move";
  for (const id of ids) cardEl(id)?.classList.add("ghost");

scroller.addEventListener("dragend", () => {
  $$(".ghost", scroller).forEach((el) => el.classList.remove("ghost"));
  $$(".nav.drop", side).forEach((el) => el.classList.remove("drop"));
});

/* Starred: pick a file up and put it somewhere else. It hangs from the
   pointer and swings as it moves, the files around it make room, and it
   drops into its place with a small bounce. Let go over a project, Drafts
   or the Trash in the sidebar and it goes there, as any dragged file does */

const calm = () => reducedMotion.matches;
const GHOST_PAD = 6;

scroller.addEventListener("pointerdown", (e) => {
  // A press that never became a drag (released outside, say) doesn't block this one
  if (lift?.live || e.button !== 0 || e.pointerType === "touch" || e.ctrlKey || e.metaKey || e.shiftKey) return;
  const card = e.target.closest(".star-grid > .card[data-id]");
  if (!card || e.target.closest("button")) return;
  lift = { id: card.dataset.id, card, pointer: e.pointerId, sx: e.clientX, sy: e.clientY, px: e.clientX, py: e.clientY, live: false };
});
scroller.addEventListener("pointermove", (e) => {
  if (!lift || e.pointerId !== lift.pointer || lift.dropping) return;
  lift.px = e.clientX;
  lift.py = e.clientY;
  if (!lift.live && Math.hypot(e.clientX - lift.sx, e.clientY - lift.sy) > 3) startLift();
});
scroller.addEventListener("pointerup", (e) => {
  if (!lift || e.pointerId !== lift.pointer || lift.dropping) return;
  if (lift.live) dropLift();
  else lift = null;
});
scroller.addEventListener("pointercancel", (e) => {
  if (!lift || e.pointerId !== lift.pointer || lift.dropping) return;
  if (lift.live) dropLift(true);
  else lift = null;
});
// Escape, or leaving the window, puts it back where it was
addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || !lift?.live || lift.dropping) return;
  e.preventDefault();
  e.stopPropagation();
  dropLift(true);
}, true);
addEventListener("blur", () => lift?.live && !lift.dropping && dropLift(true));

function startLift() {
  const l = lift;
  // The list may have been drawn again since the press
  const card = (l.card = cardEl(l.id));
  const grid = card?.parentElement;
  if (!grid?.classList.contains("star-grid")) return void (lift = null);
  const r = card.getBoundingClientRect();
  closeMenu();
  tip.style.display = "none";
  if (!state.sel.has(l.id) || state.sel.size > 1) setSel([l.id], l.id);
  const ghost = card.cloneNode(true);
  ghost.removeAttribute("id");
  for (const el of ghost.querySelectorAll("[id]")) el.removeAttribute("id");
  ghost.querySelector(".tools")?.remove();
  ghost.className = "card lifted";
  ghost.setAttribute("aria-hidden", "true");
  ghost.removeAttribute("role");
  ghost.style.width = `${r.width + GHOST_PAD * 2}px`;
  // It turns about the point it was picked up by
  const ox = l.sx - r.left + GHOST_PAD;
  const oy = l.sy - r.top + GHOST_PAD;
  ghost.style.transformOrigin = `${ox}px ${oy}px`;
  ghost.style.transform = `translate(${r.left - GHOST_PAD}px, ${r.top - GHOST_PAD}px)`;
  document.body.append(ghost);
  card.classList.add("hole");
  document.body.classList.add("grabbing");
  try {
    scroller.setPointerCapture(l.pointer);
  } catch {}
  // Where each place in the grid is, in the list's own coordinates: the
  // places stay put while the files move between them
  const slots = [...grid.children].map((el) => ({ x: el.offsetLeft + el.offsetWidth / 2, y: el.offsetTop + el.offsetHeight / 2 }));
  Object.assign(l, { live: true, grid, ghost, ox, oy, h: ghost.offsetHeight, slots, from: [...grid.children].indexOf(card), lastX: l.px, lastT: performance.now(), vx: 0, ang: 0, angV: 0, scale: 1, target: null });
  l.frame = requestAnimationFrame(stepLift);
}

// Each frame: follow the pointer, swing, scroll near an edge, make room
function stepLift(now) {
  const l = lift;
  if (!l?.live || l.dropping) return;
  const dt = Math.min(3, Math.max(0.25, (now - l.lastT) / 16.67));
  l.lastT = now;
  l.vx += ((l.px - l.lastX) / dt - l.vx) * 0.12;
  l.lastX = l.px;
  // Hanging from the pointer, it trails behind the way it moves: the
  // farther from where it's held, the more it leans. A spring that
  // overshoots a little brings it back
  const lever = (l.h / 2 - l.oy) / (l.h / 2);
  const lean = calm() ? 0 : Math.max(-7, Math.min(7, l.vx * 0.3 * lever));
  l.angV += ((lean - l.ang) * 0.06 - l.angV * 0.2) * dt;
  l.ang += l.angV * dt;
  l.scale += ((calm() ? 1 : 1.04) - l.scale) * Math.min(1, 0.22 * dt);
  const area = scroller.getBoundingClientRect();
  const edge = 56;
  const dy = l.py < area.top + edge ? -(area.top + edge - l.py) / 3 : l.py > area.bottom - edge ? (l.py - area.bottom + edge) / 3 : 0;
  if (dy) scroller.scrollTop += Math.round(dy * dt);
  l.ghost.style.transform = `translate(${l.px - l.ox}px, ${l.py - l.oy}px) rotate(${l.ang.toFixed(2)}deg) scale(${l.scale.toFixed(4)})`;
  retarget(area);
  l.frame = requestAnimationFrame(stepLift);
}

function retarget(area) {
  const l = lift;
  const over = document.elementFromPoint(l.px, l.py)?.closest("#side [data-drop]") ?? null;
  if (over !== l.target) {
    l.target?.classList.remove("drop");
    over?.classList.add("drop");
    l.target = over;
  }
  if (over || l.px < area.left || l.px > area.right) return;
  const gx = l.px - area.left + scroller.scrollLeft;
  const gy = l.py - area.top + scroller.scrollTop;
  let best = 0;
  let bestDistance = Infinity;
  l.slots.forEach((s, i) => {
    const d = Math.hypot(s.x - gx, (s.y - gy) * 1.3);
    if (d < bestDistance) [best, bestDistance] = [i, d];
  });
  if (best !== [...l.grid.children].indexOf(l.card)) moveHole(best);
}

// Puts the empty place at `index`; the files between glide over, from
// wherever they are, with a little give
function moveHole(index) {
  const { grid, card } = lift;
  const others = [...grid.children].filter((el) => el !== card);
  const was = new Map(others.map((el) => [el, el.getBoundingClientRect()]));
  grid.insertBefore(card, others[index] ?? null);
  for (const el of others) el.getAnimations().forEach((a) => a.cancel());
  for (const el of others) {
    const a = was.get(el);
    const b = el.getBoundingClientRect();
    const dx = a.left - b.left;
    const dy = a.top - b.top;
    if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) continue;
    el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], { duration: calm() ? 1 : 340, easing: "cubic-bezier(0.2, 0.9, 0.3, 1.12)" });
  }
}

function dropLift(cancel = false) {
  const l = lift;
  cancelAnimationFrame(l.frame);
  l.dropping = true;
  liftJustEnded = true;
  setTimeout(() => (liftJustEnded = false));
  document.body.classList.remove("grabbing");
  l.target?.classList.remove("drop");
  try {
    scroller.releasePointerCapture(l.pointer);
  } catch {}
  const finish = () => {
    l.ghost.remove();
    l.card.classList.remove("hole");
    lift = null;
  };
  const into = !cancel && l.target;
  if (into) {
    // Into the sidebar: it shrinks away into where it went
    const t = into.getBoundingClientRect();
    const fall = l.ghost.animate([{ transform: l.ghost.style.transform, opacity: 1 }, { transform: `translate(${t.left + 20 - l.ox}px, ${t.top + t.height / 2 - l.oy}px) scale(0.12)`, opacity: 0 }], { duration: calm() ? 1 : 240, easing: "cubic-bezier(0.5, 0, 0.75, 0)", fill: "forwards" });
    fall.onfinish = () => {
      finish();
      if (into.dataset.drop === "trash") trashFiles([l.id]);
      else moveFiles([l.id], into.dataset.drop === "drafts" ? null : into.dataset.drop.slice(2));
      if (l.rerender) render();
    };
    return;
  }
  if (cancel) moveHole(l.from);
  // Down into its place, quickening as it falls, then a squash and a
  // rebound as it lands; the files beside it take a little of the knock
  const r = l.card.getBoundingClientRect();
  const fall = l.ghost.animate([{ transform: l.ghost.style.transform }, { transform: `translate(${r.left - GHOST_PAD}px, ${r.top - GHOST_PAD}px) rotate(0deg) scale(1)` }], { duration: calm() ? 1 : 200, easing: "cubic-bezier(0.55, 0, 0.85, 0.5)", fill: "forwards" });
  fall.onfinish = () => {
    finish();
    if (!calm()) {
      const origin = "50% 85%";
      l.card.animate([{ transform: "scale(1.035, 0.95)", transformOrigin: origin }, { transform: "scale(0.99, 1.015)", transformOrigin: origin, offset: 0.45 }, { transform: "none", transformOrigin: origin }], { duration: 320, easing: "ease-out" });
      const at = [...l.grid.children].indexOf(l.card);
      [[l.grid.children[at - 1], -1], [l.grid.children[at + 1], 1]].forEach(([el, side]) => {
        if (el && Math.abs(el.offsetTop - l.card.offsetTop) < 4) el.animate([{ transform: "none" }, { transform: `translateX(${side * 3}px)`, offset: 0.3 }, { transform: "none" }], { duration: 280, easing: "ease-out" });
      });
    }
    commitStarOrder(l.grid);
    focusCard(l.id, false);
    if (l.rerender) render();
  };
}

// The order as the grid now shows it, kept for next time
function commitStarOrder(grid) {
  const shown = [...grid.children].map((el) => el.dataset.id);
  const rest = store.get(starOrderKey(), []).filter((id) => !shown.includes(id) && byId(id)?.starred);
  store.set(starOrderKey(), [...shown, ...rest]);
  // On Home the starred row comes first, then the other sections
  order = [...shown, ...order.filter((id) => !shown.includes(id))];
  previousOrder = order;
}
side.addEventListener("dragover", (e) => {
  const target = e.target.closest("[data-drop]");
  if (!target || !e.dataTransfer.types.includes("application/x-ligma-files")) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  $$(".nav.drop", side).forEach((el) => el !== target && el.classList.remove("drop"));
  target.classList.add("drop");
});
side.addEventListener("dragleave", (e) => {
  const target = e.target.closest("[data-drop]");
  if (target && !target.contains(e.relatedTarget)) target.classList.remove("drop");
});
side.addEventListener("drop", (e) => {
  const target = e.target.closest("[data-drop]");
  if (!target) return;
  e.preventDefault();
  target.classList.remove("drop");
  const ids = e.dataTransfer.getData("application/x-ligma-files").split(",").filter((id) => byId(id));
  const drop = target.dataset.drop;
  if (drop === "trash") trashFiles(ids);
  else moveFiles(ids, drop === "drafts" ? null : drop.slice(2));
});

addEventListener("keydown", (e) => {
  const typing = e.target.closest?.("input, textarea, [contenteditable]");
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !typing && toastUndo && !toastEl.hidden) {
    e.preventDefault();
    const undo = toastUndo;
    hideToast();
    undo();
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    pal.open ? pal.close() : openPalette();
  } else if (e.key === "/" && !typing && !pal.open) {
    e.preventDefault();
    openPalette();
  } else if (!typing && !pal.open && !menu.classList.contains("open") && e.target === document.body && e.key.startsWith("Arrow") && order.length) {
    e.preventDefault();
    setSel([order[0]], order[0]);
    focusCard(order[0]);
  }
});

// Focus rings show once the keyboard moves focus around, and go when the
// pointer's used again. Focus Ligma moves itself, after a click or a
// selection box, stays without one
const NAV_KEYS = new Set(["Tab", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Home", "End", "PageUp", "PageDown"]);
addEventListener("keydown", (e) => NAV_KEYS.has(e.key) && document.documentElement.classList.add("kbd"), true);
addEventListener("pointerdown", () => document.documentElement.classList.remove("kbd"), true);

/* Sync: shown from what's saved at once, then brought up to date */

function syncNow() {
  const sync = $("#sync");
  sync?.classList.add("busy");
  if (sync) sync.lastElementChild.textContent = "Checking for changes";
  setTimeout(() => {
    render();
    const done = $("#sync");
    if (done) done.lastElementChild.textContent = "Sample files, not yours yet";
  }, 700);
}

applyTheme();
if (LIVE) boot();
else {
  loadPins();
  seedFiles();
  seedNotes();
  render({ keepScroll: false });
}
if (state.mode === "loading") setTimeout(() => {
  state.mode = null;
  render({ keepScroll: false });
}, 1600);
</script>
</body>
