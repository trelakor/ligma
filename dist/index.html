<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ligma</title>
<!-- Tab bar. Its webview is 38px tall, and fills the window only while it
     shows a reloading tab's snapshot; Figma tabs are child webviews below
     it (see src-tauri/src/tabs.rs) -->
<style>
  :root {
    --bar: #383838;
    --hover: #424242;
    --active: #2c2c2c;
    --divider: #4d4d4d;
    --text: #b3b3b3;
    --text-active: #fff;
    --brand: #0d99ff;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--active); }
  body {
    font: 500 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "Inter", sans-serif;
    color: var(--text);
    cursor: default;
    -webkit-user-select: none;
    user-select: none;
  }
  #bar {
    display: flex;
    height: 38px;
    padding-left: 78px; /* traffic lights */
    background: var(--bar);
  }
  body.fullscreen #bar, body:not(.macos) #bar { padding-left: 0; }
  /* Window controls where there's no native title bar (Windows, Linux) */
  .control {
    display: grid;
    flex: none;
    place-items: center;
    width: 46px;
    color: var(--text-active);
  }
  .control:hover { background: var(--hover); }
  .control.close-window:hover { background: #c42b1c; color: #fff; }
  .tab, #home, #new {
    position: relative;
    display: flex;
    flex: none;
    align-items: center;
    justify-content: center;
  }
  .tab:hover, #home:hover, #new:hover { background: var(--hover); }
  .tab.active, #home.active { background: var(--active); color: var(--text-active); }
  #home { width: 38px; }
  /* Width follows the title, up to max-width. Once the bar is full,
     tabs shrink in proportion to their width */
  .tab {
    flex: 0 1 auto;
    min-width: 48px;
    max-width: 240px;
    gap: 8px;
    padding: 0 8px 0 12px;
    justify-content: flex-start;
  }
  /* Dividers between inactive neighbours */
  #home::after, .tab::after {
    content: "";
    position: absolute;
    right: 0;
    top: 11px;
    bottom: 11px;
    width: 1px;
    background: var(--divider);
  }
  .active::after, .before-active::after { display: none; }
  /* The other tab of a split view, on screen beside the active one */
  .tab.split { background: var(--active); }
  .split::after, .before-split::after { display: none; }
  /* Without traffic lights, Home sits flush left above Figma's nav rail:
     match its width (measured by THEME_JS in tabs.rs; 48px plus its 1px
     border at 100%) and run the divider down into the rail's border */
  body:not(.macos) #home { width: var(--rail-width, 49px); }
  body:not(.macos) #home::after { top: 0; bottom: 0; }
  body:not(.macos) #home.before-active::after { display: block; }
  .icon { flex: none; width: 16px; height: 16px; }
  /* An emoji is wider than its 16px box: flex centers it all the same,
     where text-align would let it hang off the right */
  .emoji { display: flex; justify-content: center; font-size: 14px; line-height: 16px; }
  .tab.active > .icon { color: var(--accent, currentColor); }
  /* The active file tab's icon opens its emoji picker */
  .tab.active > .icon.picks { border-radius: 3px; }
  .tab.active > .icon.picks:hover { background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1); }
  /* Unloaded to save memory; reloads when selected */
  .asleep:not(.active) > .icon, .asleep:not(.active) > .title { opacity: 0.5; }
  /* Waking or reloading, until its page is drawn */
  .icon.spinner { animation: spin 0.8s linear infinite; }
  .icon.spinner circle { opacity: 0.25; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .title { flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .close {
    flex: none;
    display: grid;
    place-items: center;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    visibility: hidden;
  }
  .tab:hover .close, .tab.active .close { visibility: visible; }
  .close:hover { background: rgba(255, 255, 255, 0.1); }
  #new { width: 36px; }
  /* While a tab is dragged, the others slide out of its way */
  .dragging .tab { transition: transform 150ms ease; }
  .dragging .tab.dragged { transition: none; z-index: 1; }
  /* Where a tab dragged in from another window would go */
  .tab.ghost { opacity: 0.6; }
  /* Pinned tabs show only their icon, like Home */
  .tab.pinned { flex: none; width: 38px; min-width: 38px; padding: 0; justify-content: center; }
  /* A downloaded update: Figma's primary button, after the traffic lights
     on macOS and before Settings elsewhere */
  #update {
    display: flex;
    flex: none;
    align-items: center;
    padding: 0 8px 0 0;
  }
  body:not(.macos) #update { padding: 0 6px; }
  body.macos.fullscreen #update { padding-left: 8px; }
  #update > button {
    height: 24px;
    padding: 0 8px;
    border: 0;
    border-radius: 5px;
    background: var(--brand);
    color: #fff;
    font: 450 11px/16px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", sans-serif;
    font-feature-settings: "cv11", "calt";
    -webkit-font-smoothing: antialiased;
    white-space: nowrap;
  }
  #update > button:hover, #update > button:active { background: color-mix(in srgb, var(--brand) 88%, #000); }
  #update > button:disabled { opacity: 0.6; }
  /* Always leave room to drag the window */
  #drag { flex: 1; min-width: 48px; }
  /* Last image of a tab that's reloading after sleep, shown where its
     webview goes until Figma has drawn the file again */
  #snapshot {
    position: fixed;
    top: 38px;
    left: 0;
    width: 100%;
    height: calc(100% - 38px);
    overflow: hidden;
    cursor: progress;
  }
  #snapshot[hidden] { display: none; }
  /* Between a split view's halves, where the window shows this page (see
     src-tauri/src/split.rs). Drag it to share the canvas otherwise */
  #divider {
    position: fixed;
    display: grid;
    place-items: center;
    cursor: col-resize;
    touch-action: none;
  }
  #divider[hidden] { display: none; }
  #divider.stacked { cursor: row-resize; }
  #divider::after {
    content: "";
    width: 1px;
    height: 100%;
    background: var(--divider);
    transition: background 120ms ease;
  }
  #divider.stacked::after { width: 100%; height: 1px; }
  #divider:hover::after, #divider.dragging::after { width: 2px; background: var(--brand); }
  #divider.stacked:hover::after, #divider.stacked.dragging::after { width: 100%; height: 2px; }
  #snapshot > img { width: 100%; height: 100%; object-fit: cover; object-position: top left; }
  /* The image looks live but isn't: a soft light sweeps across it every
     few seconds while the tab reloads */
  #snapshot::after {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 60%;
    background: linear-gradient(100deg, transparent 0%, rgba(255, 255, 255, 0.07) 35%, rgba(255, 255, 255, 0.14) 50%, rgba(255, 255, 255, 0.07) 65%, transparent 100%);
    transform: translateX(-100%);
    animation: shimmer 2.4s infinite;
    will-change: transform;
    pointer-events: none;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
    60%, 100% { transform: translateX(270%); }
  }
  @media (prefers-reduced-motion: reduce) {
    #snapshot::after { animation: none; }
    .icon.spinner { animation-duration: 2.4s; }
  }
</style>
</head>
<body>
<div id="bar" data-tauri-drag-region></div>
<div id="snapshot" hidden><img alt=""></div>
<div id="divider" hidden></div>
<script>
  const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);

  const svg = (body, size = 16) =>
    `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;

  // The title's leading emoji, if any, and the rest of the title
  const graphemes = new Intl.Segmenter(undefined, { granularity: "grapheme" });
  const splitEmoji = (title) => {
    const first = graphemes.segment(title)[Symbol.iterator]().next().value?.segment ?? "";
    if (!/\p{Emoji_Presentation}|\ufe0f|\p{Regional_Indicator}/u.test(first)) return ["", title];
    const rest = title.slice(first.length).trimStart();
    return rest ? [first, rest] : ["", title];
  };

  // Filled, at the size of the line icons
  const glyph = (body, size = 16) =>
    `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 16 16" fill="none">${body}</svg>`;

  const ICONS = {
    home: svg('<path d="M2.5 7 8 2.5 13.5 7v6.5h-4v-4h-3v4h-4z"/>'),
    // Figma's own glyphs for its products, as on its file browser's tiles
    design: glyph("<path fill=\"currentColor\" fill-rule=\"evenodd\" clip-rule=\"evenodd\" d=\"M4.14 3.207a1 1 0 0 1 .837-.181l3.762.878a4.57 4.57 0 0 1 3.531 4.452l.437.436a1 1 0 0 1 0 1.415l-2.5 2.5a1 1 0 0 1-1.414 0l-.437-.437A4.57 4.57 0 0 1 3.96 8.949l-.054-.21-.879-3.762a1 1 0 0 1 .267-.935l.75-.75zm.59.813 2.623 2.624-.006.006a1.5 1.5 0 1 1-.697.697l-.004.004-2.624-2.624L4 4.749l.879 3.763a3.573 3.573 0 0 0 3.87 2.737l.75.75L12 9.5l-.75-.75a3.57 3.57 0 0 0-2.737-3.872L4.75 4zM8 7.5a.5.5 0 1 0 0 1 .5.5 0 0 0 0-1\"/>"),
    board: glyph("<path fill=\"currentColor\" d=\"M12 3a1 1 0 0 1 1 1v4.586l-.005.099a1 1 0 0 1-.288.608l-3.414 3.414-.073.066a1 1 0 0 1-.634.227H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm-8 9h4V9a1 1 0 0 1 1-1h3V4H4zm5-.414L11.586 9H9z\"/>"),
    slides: glyph("<path fill=\"currentColor\" d=\"M12 3a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-.434l.412 1.354a.5.5 0 0 1-.957.292l-.5-1.646H5.479l-.5 1.646a.5.5 0 0 1-.958-.292L4.434 12H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM4 4a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1zm1 4a1 1 0 1 1 0 2 1 1 0 0 1 0-2m0-3a1 1 0 1 1 0 2 1 1 0 0 1 0-2\"/>"),
    proto: svg('<path d="M5 3.5v9l7-4.5z"/>'),
    make: glyph("<path fill=\"currentColor\" d=\"M9.5 8c.276 0 .501.225.495.5-.033 1.355-.196 2.586-.452 3.52-.142.522-.32.98-.539 1.32C8.8 13.655 8.472 14 8 14c-.471 0-.8-.344-1.003-.66-.22-.34-.397-.798-.54-1.32q-.06-.226-.115-.475a.482.482 0 0 1 .507-.577c.23.013.427.18.478.405q.045.201.095.385c.13.474.274.822.414 1.04.083.127.246.127.329 0 .14-.218.284-.566.414-1.04.227-.834.383-1.974.416-3.258A.51.51 0 0 1 9.5 8M4.454 6.342a.483.483 0 0 1 .578.507.52.52 0 0 1-.405.479 9 9 0 0 0-.384.095c-.474.13-.822.274-1.04.414-.127.083-.127.246 0 .328.218.14.566.285 1.04.415.823.224 1.944.378 3.208.414h.056a.501.501 0 0 1-.013 1h-.069c-1.324-.037-2.527-.2-3.445-.45-.52-.142-.98-.32-1.318-.539C2.345 8.801 2 8.473 2 8.001c0-.471.345-.8.662-1.003.339-.22.797-.398 1.318-.54q.226-.061.474-.116m4.05-.335c1.353.033 2.583.197 3.517.451.52.143.98.32 1.318.54.317.204.662.532.662 1.003 0 .472-.345.8-.662 1.004-.339.219-.797.397-1.318.54q-.226.06-.475.114a.483.483 0 0 1-.578-.507.52.52 0 0 1 .405-.479q.202-.044.385-.093c.474-.13.822-.275 1.04-.415.127-.082.127-.245 0-.328-.218-.14-.566-.284-1.04-.414-.823-.224-1.944-.379-3.208-.414h-.053A.504.504 0 0 1 8 6.503c0-.278.226-.503.504-.497M8 2c.472 0 .8.345 1.004.662.22.339.397.797.54 1.318q.06.226.115.474a.484.484 0 0 1-.508.578.52.52 0 0 1-.478-.405 8 8 0 0 0-.094-.384c-.13-.474-.274-.822-.414-1.04-.083-.128-.246-.128-.329 0-.14.218-.284.566-.414 1.04-.227.834-.383 1.973-.416 3.257A.51.51 0 0 1 6.5 8a.49.49 0 0 1-.494-.5c.033-1.354.196-2.585.452-3.52.142-.521.32-.98.539-1.318C7.2 2.345 7.529 2 8 2\"/>"),
    site: glyph("<path fill=\"currentColor\" d=\"M8 2a6 6 0 1 1 0 12A6 6 0 0 1 8 2M6.51 8.5c.05 1.349.297 2.523.645 3.358.196.47.404.787.584.97a.8.8 0 0 0 .198.152c.039.02.058.02.063.02s.024 0 .063-.02a.8.8 0 0 0 .198-.153c.18-.182.388-.498.584-.969.348-.835.595-2.01.645-3.358zm-3.486 0c.2 2.01 1.59 3.67 3.456 4.264-.544-1.002-.91-2.528-.97-4.264zm7.465 0c-.06 1.736-.426 3.262-.97 4.264A5 5 0 0 0 12.976 8.5zm-.97-5.265c.544 1.002.91 2.528.97 4.265h2.487a5 5 0 0 0-3.457-4.265M7.937 3.02a.8.8 0 0 0-.198.153c-.18.182-.388.498-.584.969-.348.835-.595 2.01-.645 3.358h2.98c-.05-1.349-.297-2.523-.645-3.358-.196-.47-.404-.787-.584-.97a.8.8 0 0 0-.198-.152A.14.14 0 0 0 8 3c-.005 0-.024 0-.063.02m-1.457.215A5 5 0 0 0 3.024 7.5h2.487c.06-1.736.425-3.263.97-4.265\"/>"),
    buzz: glyph("<path fill=\"currentColor\" d=\"M5.164 4.68a1.5 1.5 0 0 1 2.175-.366l.142.126 4.08 4.079a1.5 1.5 0 0 1-.407 2.41l-6.022 2.92a1.5 1.5 0 0 1-1.716-.29l-.977-.976a1.5 1.5 0 0 1-.288-1.715l2.92-6.022zm-2.113 6.625a.5.5 0 0 0 .096.571l.976.977a.5.5 0 0 0 .5.125l.072-.03 1.377-.668L3.72 9.926zM4.18 8.973l2.844 2.845 1.743-.844-3.743-3.742zm2.594-3.826a.5.5 0 0 0-.803.134l-.485.998 4.233 4.233.999-.484a.5.5 0 0 0 .177-.755l-.043-.047zm7.615 1.336a.477.477 0 0 1 .518.39l.011.07a.474.474 0 0 1-.437.536l-1.46.127a.5.5 0 0 1-.086-.996zm-1.09-2.331a.475.475 0 0 1 .643.15l.037.06a.474.474 0 0 1-.18.655l-1.96 1.133a.5.5 0 0 1-.501-.866zm-2.317-1.953a.474.474 0 0 1 .656-.18l.06.038a.475.475 0 0 1 .149.643l-1.132 1.961a.5.5 0 0 1-.865-.499zM9.057 1.081l.07.011c.247.04.411.27.39.519L9.39 3.064a.5.5 0 0 1-.996-.087l.127-1.458a.474.474 0 0 1 .536-.438\"/>"),
    spec: glyph("<path fill=\"currentColor\" d=\"M11 3a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm-6 9h6V4H5zm4.5-2a.5.5 0 0 1 0 1h-3a.5.5 0 0 1 0-1zm0-2.5a.5.5 0 0 1 0 1h-3a.5.5 0 0 1 0-1zM8 5a.5.5 0 1 1 0 1 .5.5 0 0 1 0-1m1.5 0a.5.5 0 1 1 0 1 .5.5 0 0 1 0-1\"/>"),
    page: svg('<path d="M4 2.5h5.5L12 5v8.5H4z"/><path d="M9.5 2.5V5H12"/>'),
    close: svg('<path d="m5 5 6 6M11 5l-6 6"/>', 12),
    plus: svg('<path d="M8 3.5v9M3.5 8h9"/>'),
    spinner: svg('<circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 1 5.5 5.5"/>'),
  };

  // The bar is redrawn on every change; start each spinner where the last
  // one was, so it keeps turning smoothly
  const spinner = () => {
    const icon = el("div", {}, ICONS.spinner).firstElementChild;
    icon.classList.add("spinner");
    icon.style.animationDelay = `-${performance.now() % 800}ms`;
    return icon;
  };

  const ACCENTS = {
    design: "#0d99ff",
    proto: "#0d99ff",
    board: "#9747ff",
    slides: "#ff5c16",
    // Silvery: the bar's text color, softened, so it holds up in light themes
    make: "color-mix(in srgb, var(--text-active) 82%, var(--active))",
    site: "#4d49fc",
    buzz: "#ff24bd",
    spec: "#667799",
  };

  const bar = document.getElementById("bar");

  // Files whose name can start with an emoji: every Figma file but a
  // prototype, which keeps its play icon
  const takesEmoji = (tab) => tab.kind in ACCENTS && tab.kind !== "proto";

  // While a file is renamed for a new emoji, the tab shows it already, by
  // id ("" for none). It goes once the title catches up, or the rename
  // fails (`pendingEmoji(id, null)`, from emoji_picker.rs)
  const pending = new Map();
  let shown = null;
  window.pendingEmoji = (id, emoji) => {
    if (emoji == null) pending.delete(id);
    else {
      pending.set(id, emoji);
      // Figma retitles the tab within a second; don't wait on it forever
      setTimeout(() => {
        if (pending.get(id) !== emoji) return;
        pending.delete(id);
        if (shown) window.render(shown);
      }, 12000);
    }
    if (shown) window.render(shown);
  };
  // A tab's emoji and title, the pending emoji first
  const tabFace = (tab) => {
    const [emoji, title] = takesEmoji(tab) ? splitEmoji(tab.title) : ["", tab.title];
    if (!pending.has(tab.id)) return [emoji, title];
    const want = pending.get(tab.id);
    if (want === emoji) {
      pending.delete(tab.id);
      return [emoji, title];
    }
    return [want, title];
  };

  // Opens tab `id`'s emoji picker under it (see emoji_picker.rs)
  window.openEmojiPicker = (id) => {
    const tab = shown?.tabs.find((tab) => tab.id === id);
    const node = bar.querySelector(`.tab[data-id="${id}"]`);
    if (!tab || !node || !takesEmoji(tab)) return;
    hidePreview();
    invoke("show_emoji_picker", { id, left: node.getBoundingClientRect().left, current: tabFace(tab)[0] });
  };

  const el = (tag, props, html = "") => {
    const node = Object.assign(document.createElement(tag), props);
    if (html) node.innerHTML = html;
    return node;
  };

  // Figma theme colors (see THEME_JS in tabs.rs) onto the bar's variables
  const THEME_VARS = {
    "--bar": "bgSecondary",
    "--hover": "bgTertiary",
    "--active": "bg",
    "--divider": "border",
    "--text": "textSecondary",
    "--text-active": "text",
    "--brand": "brand",
  };

  const CONTROLS = {
    // Settings lives in the app menu on macOS; elsewhere it's a button here
    settings: svg('<g transform="scale(.6667)" stroke-width="1.6"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></g>', 14),
    minimize: svg('<path d="M3 8h10"/>', 10),
    maximize: svg('<rect x="3.5" y="3.5" width="9" height="9"/>', 10),
    close: svg('<path d="m3.5 3.5 9 9M12.5 3.5l-9 9"/>', 10),
  };

  // Dragging a tab moves it among its group, the pinned tabs or the rest
  // `drag` holds the press until it moves DRAG_START px, then the drag;
  // renders wait until the drop, so the tabs don't change under it.
  // Dragged DETACH px off the bar, the tab goes into a window of its own,
  // which follows the pointer from there (see `tear_off_tab` in tabs.rs)
  const DRAG_START = 4;
  const DETACH = 24;
  let drag = null;
  let deferred = null;
  const groupNodes = (pinned) => [...bar.querySelectorAll(pinned ? ".tab.pinned:not(.ghost)" : ".tab:not(.pinned):not(.ghost)")];

  // Before the press selects it, whether the tab was the active one, and
  // whether the press is on its icon, which then opens its emoji picker
  const startPress = (e, tab) => {
    if (e.button !== 0) return;
    const wasActive = e.currentTarget.classList.contains("active");
    const onIcon = wasActive && !!e.target.closest(".icon.picks");
    drag = { id: tab.id, pinned: tab.pinned, wasActive, onIcon, startX: e.clientX, startY: e.clientY, moving: false };
  };

  // Where a tab let go of at `x` in this bar goes among its group, for a
  // tab dragged in from another window
  window.dropIndex = (x, pinned) =>
    groupNodes(pinned).filter((node) => {
      const rect = node.getBoundingClientRect();
      return rect.left + rect.width / 2 < x;
    }).length;

  // A tab dragged over this bar from another window shows where it would
  // go, as `tab` ({ title, kind, pinned }) at `x`, until called with null
  // (see `follow_cursor` in tabs.rs)
  let ghost = null;
  window.dragOver = (x, tab) => {
    ghost = x == null ? null : { x, tab };
    placeGhost();
  };
  const placeGhost = () => {
    bar.querySelector(".ghost")?.remove();
    if (!ghost) return;
    const { x, tab } = ghost;
    // Worked out without the ghost, so it doesn't push the tabs it's
    // measured against
    const index = window.dropIndex(x, tab.pinned);
    const node = el("div", { className: `tab ghost active${tab.pinned ? " pinned" : ""}` }, ICONS[tab.kind] ?? ICONS.page);
    node.style.setProperty("--accent", ACCENTS[tab.kind] ?? "currentColor");
    if (!tab.pinned) node.append(el("span", { className: "title", textContent: tab.title || "Loading…" }));
    const before = groupNodes(tab.pinned)[index]
      || (tab.pinned && groupNodes(false)[0])
      || bar.querySelector("#new");
    bar.insertBefore(node, before);
  };

  // Pointing at another tab previews it in a card below (see
  // src-tauri/src/preview.rs). Rust skips Home, the active tab, and
  // everything when `tabPreviews` is off
  let previewing = null;
  // By id: the bar may have been drawn again since
  const showPreview = (id) => {
    const node = bar.querySelector(`.tab[data-id="${id}"]:not(.active)`);
    if (!node) return hidePreview();
    previewing = id;
    invoke("show_tab_preview", { id, left: node.getBoundingClientRect().left });
  };
  const hoverTab = (node) => {
    if (drag?.moving || node.classList.contains("active")) hidePreview();
    else showPreview(Number(node.dataset.id));
  };
  const hidePreview = () => {
    if (previewing == null) return;
    previewing = null;
    invoke("hide_tab_preview");
  };
  // In the bar, the pointer is likely on its way to another tab: Ligma
  // keeps an image of the one it would leave (at most every second)
  bar.addEventListener("pointerenter", () => invoke("capture_active_tab"));
  bar.addEventListener("pointerover", (e) => e.target.closest(".tab") && invoke("capture_active_tab"));
  bar.addEventListener("pointerleave", hidePreview);
  addEventListener("blur", hidePreview);

  bar.addEventListener("pointermove", (e) => {
    if (!drag) return;
    // Released outside the bar before the drag began
    if (!(e.buttons & 1) && !drag.moving) {
      drag = null;
      return;
    }
    let dx = e.clientX - drag.startX;
    if (!drag.moving) {
      if (Math.hypot(dx, e.clientY - drag.startY) < DRAG_START) return;
      const nodes = groupNodes(drag.pinned);
      drag.from = nodes.findIndex((node) => Number(node.dataset.id) === drag.id);
      if (drag.from < 0) {
        drag = null;
        return;
      }
      drag.moving = true;
      hidePreview();
      drag.rects = nodes.map((node) => node.getBoundingClientRect());
      drag.to = drag.from;
      // Keep getting the pointer if it leaves the bar
      bar.setPointerCapture(e.pointerId);
      bar.classList.add("dragging");
    }
    const { from, rects } = drag;
    const height = bar.getBoundingClientRect().height;
    if (e.clientY < -DETACH || e.clientY > height + DETACH || e.clientX < 0 || e.clientX > innerWidth) {
      const { id, pinned, wasActive } = drag;
      drag = null;
      bar.classList.remove("dragging");
      if (bar.hasPointerCapture(e.pointerId)) bar.releasePointerCapture(e.pointerId);
      // The others go back where they were until the tab's gone
      const state = deferred;
      deferred = null;
      if (state) renderBar(state);
      else groupNodes(pinned).forEach((node) => (node.style.transform = ""));
      invoke("tear_off_tab", { id, wasActive });
      return;
    }
    const me = rects[from];
    dx = Math.max(rects[0].left - me.left, Math.min(rects[rects.length - 1].right - me.right, dx));
    // A neighbour gives way once the dragged tab's leading edge passes its
    // middle, so a wide tab can still pass a narrow one at either end
    const mid = (rect) => rect.left + rect.width / 2;
    const before = rects.filter((rect, i) => i < from && me.left + dx < mid(rect)).length;
    const after = rects.filter((rect, i) => i > from && me.right + dx > mid(rect)).length;
    drag.to = from - before + after;
    groupNodes(drag.pinned).forEach((node, i) => {
      const shift = i === from ? dx
        : from < i && i <= drag.to ? -me.width
        : drag.to <= i && i < from ? me.width
        : 0;
      node.classList.toggle("dragged", i === from);
      node.style.transform = shift ? `translateX(${shift}px)` : "";
    });
  });

  // Selecting redraws the bar, the icon pressed included, so its own click
  // may never come: the release decides
  const endPress = (e) => {
    const done = drag;
    drag = null;
    if (e.type === "pointerup" && done?.onIcon && !done.moving) window.openEmojiPicker(done.id);
    if (!done?.moving) return;
    bar.classList.remove("dragging");
    // The tab stays where it was dropped until the reply renders it there
    const state = deferred;
    deferred = null;
    if (done.to !== done.from) invoke("move_tab_to", { id: done.id, index: done.to });
    else if (state) renderBar(state);
    else groupNodes(done.pinned).forEach((node) => (node.style.transform = ""));
  };
  bar.addEventListener("pointerup", endPress);
  bar.addEventListener("pointercancel", endPress);

  // Pressed Update Now: it says so until Ligma restarts, or the install
  // failed (`updateFailed`, from updater.rs)
  let updating = false;
  window.updateFailed = () => {
    updating = false;
    const button = bar.querySelector("#update > button");
    if (!button) return;
    button.disabled = false;
    button.textContent = "Update now";
  };
  const updateButton = (version) => {
    const wrap = el("div", { id: "update" });
    const button = el("button", {
      type: "button",
      textContent: updating ? "Updating…" : "Update now",
      title: `Restart into Ligma ${version}`,
      disabled: updating,
    });
    button.addEventListener("click", () => {
      updating = true;
      button.disabled = true;
      button.textContent = "Updating…";
      invoke("update_now");
    });
    wrap.append(button);
    return wrap;
  };

  window.render = (state) => {
    if (drag?.moving) deferred = state;
    else renderBar(state);
  };

  const renderBar = (state) => {
    shown = state;
    const { tabs, active, fullscreen, theme, platform, split, update } = state;
    document.body.classList.toggle("fullscreen", fullscreen);
    document.body.classList.toggle("macos", platform === "macos");
    for (const [cssVar, key] of Object.entries(THEME_VARS)) {
      if (theme?.[key]) document.documentElement.style.setProperty(cssVar, theme[key]);
    }
    // Home and the Recents page have no rail; keep the last width so Home
    // doesn't change size when switching to them
    if (theme?.railWidth) {
      document.documentElement.style.setProperty("--rail-width", `${theme.railWidth}px`);
    }
    const activeIndex = tabs.findIndex((tab) => tab.id === active);
    const splitIndex = tabs.findIndex((tab) => tab.id !== active && split?.includes(tab.id));
    bar.replaceChildren();
    if (update && platform === "macos") bar.append(updateButton(update));

    tabs.forEach((tab, index) => {
      const classes = [];
      if (tab.id === active) classes.push("active");
      if (index === activeIndex - 1) classes.push("before-active");
      if (index === splitIndex) classes.push("split");
      if (index === splitIndex - 1) classes.push("before-split");
      if (tab.asleep) classes.push("asleep");

      if (tab.kind === "home") {
        const home = el("div", { id: "home", className: classes.join(" "), title: "Home" }, ICONS.home);
        if (tab.loading) home.replaceChildren(spinner());
        home.addEventListener("mousedown", (e) => e.button === 0 && invoke("select_tab", { id: tab.id }));
        home.addEventListener("contextmenu", () => invoke("tab_menu", { id: tab.id }));
        bar.append(home);
        return;
      }

      if (tab.pinned) classes.push("pinned");
      const node = el("div", { className: ["tab", ...classes].join(" "), title: tab.asleep ? `${tab.title} (asleep)` : tab.title });
      node.dataset.id = tab.id;
      node.style.setProperty("--accent", ACCENTS[tab.kind] ?? "currentColor");
      // A file named "🎨 Thumbnails" shows 🎨 as its icon instead, except
      // in a prototype, which keeps its play icon
      const [emoji, title] = tabFace(tab);
      if (tab.loading) node.append(spinner());
      else if (emoji) node.append(el("span", { className: "icon emoji", textContent: emoji }));
      else node.innerHTML = ICONS[tab.kind] ?? ICONS.page;
      // On the tab already active, a click on the icon picks its emoji
      // (see `startPress`)
      const icon = node.firstElementChild;
      if (takesEmoji(tab) && tab.id === active && !tab.loading) {
        icon.classList.add("picks");
        const hint = emoji ? "Change emoji" : "Add emoji";
        if (icon.tagName === "svg") icon.insertAdjacentHTML("afterbegin", `<title>${hint}</title>`);
        else icon.title = hint;
      }
      const close = el("div", { className: "close", title: "Close tab" }, ICONS.close);
      if (!tab.pinned) node.append(el("span", { className: "title", textContent: title || "Loading…" }), close);

      node.addEventListener("pointerenter", () => hoverTab(node));
      node.addEventListener("pointerdown", (e) => {
        hidePreview();
        if (!close.contains(e.target)) startPress(e, tab);
      });
      node.addEventListener("mousedown", (e) => {
        if (e.button === 0 && !close.contains(e.target)) invoke("select_tab", { id: tab.id });
      });
      // Middle click closes, like the desktop app
      node.addEventListener("auxclick", (e) => e.button === 1 && invoke("close_tab", { id: tab.id }));
      close.addEventListener("click", () => invoke("close_tab", { id: tab.id }));
      node.addEventListener("contextmenu", () => invoke("tab_menu", { id: tab.id }));
      bar.append(node);
    });

    const plus = el("div", { id: "new", title: "New tab" }, ICONS.plus);
    plus.addEventListener("click", () => invoke("open_new_tab"));
    const drag = el("div", { id: "drag" });
    drag.setAttribute("data-tauri-drag-region", "");
    bar.append(plus, drag);
    if (update && platform !== "macos") bar.append(updateButton(update));
    if (platform !== "macos") {
      for (const [action, icon] of Object.entries(CONTROLS)) {
        const control = el("div", { className: `control ${action}-window` }, icon);
        if (action === "settings") control.title = "Settings";
        control.addEventListener("click", () => invoke("window_control", { action }));
        bar.append(control);
      }
    }

    placeGhost();
    // Off the tabs, the card goes. A previewed tab may have moved: follow it
    for (const other of bar.querySelectorAll(":scope > :not(.tab)")) other.addEventListener("pointerenter", hidePreview);
    if (previewing != null) showPreview(previewing);
  };

  const snapshot = document.getElementById("snapshot");
  const snapshotImage = snapshot.querySelector("img");
  window.showSnapshot = (url) => {
    snapshotImage.src = url;
    snapshot.hidden = false;
  };
  window.hideSnapshot = () => {
    snapshot.hidden = true;
    snapshotImage.removeAttribute("src");
  };

  // A split view's divider, placed by `showDivider` in CSS pixels: `gap`
  // where it goes and `canvas` what it shares, `[left, top, right,
  // bottom]`. Dragged, it moves at once and tells Ligma each frame
  const divider = document.getElementById("divider");
  let shared = null;
  let resizing = null;
  const placeDivider = ([left, top, right, bottom]) =>
    Object.assign(divider.style, { left: `${left}px`, top: `${top}px`, width: `${right - left}px`, height: `${bottom - top}px` });
  window.showDivider = (shown) => {
    shared = shown;
    divider.hidden = false;
    divider.classList.toggle("stacked", !shown.sideBySide);
    if (!resizing) placeDivider(shown.gap);
  };
  window.hideDivider = () => {
    shared = null;
    resizing = null;
    divider.hidden = true;
  };
  divider.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || !shared) return;
    divider.setPointerCapture(e.pointerId);
    divider.classList.add("dragging");
    resizing = { frame: 0, ratio: null };
  });
  divider.addEventListener("pointermove", (e) => {
    if (!resizing || !shared) return;
    const [left, top, right, bottom] = shared.canvas;
    const [gl, gt, gr, gb] = shared.gap;
    const ratio = Math.min(0.85, Math.max(0.15, shared.sideBySide
      ? (e.clientX - left) / (right - left)
      : (e.clientY - top) / (bottom - top)));
    const half = shared.sideBySide ? (gr - gl) / 2 : (gb - gt) / 2;
    const at = shared.sideBySide ? left + (right - left) * ratio : top + (bottom - top) * ratio;
    placeDivider(shared.sideBySide ? [at - half, gt, at + half, gb] : [gl, at - half, gr, at + half]);
    resizing.ratio = ratio;
    if (!resizing.frame) {
      resizing.frame = requestAnimationFrame(() => {
        if (!resizing) return;
        resizing.frame = 0;
        invoke("set_split_ratio", { ratio: resizing.ratio });
      });
    }
  });
  const stopResizing = () => {
    if (!resizing) return;
    if (resizing.ratio != null) invoke("set_split_ratio", { ratio: resizing.ratio });
    resizing = null;
    divider.classList.remove("dragging");
  };
  divider.addEventListener("pointerup", stopResizing);
  divider.addEventListener("pointercancel", stopResizing);

  // Tabs have their own menu (`tab_menu`); nothing else in the bar has one
  document.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    hidePreview();
  });

  invoke("tab_bar_ready");
</script>
</body>
</html>
