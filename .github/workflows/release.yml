# Builds Ligma for macOS (universal) and Windows and publishes a GitHub
# release named after the version in src-tauri/tauri.conf.json.
# Run it by pushing a tag like v0.1.0, or manually from the Actions tab.
# The TAURI_SIGNING_PRIVATE_KEY secret signs the update packages, and the
# release gets a latest.json that installed apps check for updates.
# The release notes come from scripts/release-notes.mjs: the version's
# CHANGELOG.md section plus install steps naming its files. The run stops
# before building if that section is missing or the tag isn't the version.
# The Rust build cache comes from warm-cache.yml.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - id: notes
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in src-tauri/tauri.conf.json."
            exit 1
          fi
          {
            echo "body<<RELEASE_NOTES_EOF"
            node scripts/release-notes.mjs "$version"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Tag runs can't see each other's caches, only main's, so this reads
      # the cache warm-cache.yml saves on main and doesn't save its own.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release
          save-if: false

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: Ligma v__VERSION__
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: ${{ needs.notes.outputs.body }}
