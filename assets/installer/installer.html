<!doctype html>
<!-- The installer art, rendered with `npm run graphics`: #dmg is the macOS disk image window (src-tauri/installer/dmg-background.tiff), #header the Windows installer header (src-tauri/installer/nsis-header.bmp). The DMG's icon positions in tauri.conf.json (appPosition and applicationFolderPosition) must match the frame and arrow here -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ligma installer art</title>
<style>
  @font-face { font-family: "Inter"; src: url(../../site/fonts/inter.woff2) format("woff2"); font-weight: 400 700; }

  /* Figma's light UI: canvas grey, selection blue #0c8ce9, prototype blue #0d99ff, multiplayer purple #9747ff.
     Light because Finder draws the icon labels in black over a background picture, even in dark mode.
     The frame name is a shade darker than Figma's blue so it reads at 12px */
  :root { --canvas: #f5f5f5; --dot: #d6d6d6; --select: #0c8ce9; --flow: #0d99ff; --label: #0a73c4; --you: #9747ff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { overflow: hidden; background: var(--canvas); }
  body { font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; }
  .art { display: none; position: relative; }
  :root[data-art="dmg"] #dmg, :root[data-art="header"] #header { display: block; }

  /* Selected, as Figma draws it: outline, square handles and the frame's name above */
  .frame { position: absolute; }
  .frame::before { content: ""; position: absolute; inset: 0; border: 1px solid var(--select); }
  .frame i { position: absolute; width: 7px; height: 7px; background: #fff; border: 1px solid var(--select); }
  .frame i:nth-of-type(1) { left: -3px; top: -3px; } .frame i:nth-of-type(2) { right: -3px; top: -3px; }
  .frame i:nth-of-type(3) { left: -3px; bottom: -3px; } .frame i:nth-of-type(4) { right: -3px; bottom: -3px; }
  .frame .name { position: absolute; left: -1px; bottom: calc(100% + 6px); white-space: nowrap; font-size: 12px; font-weight: 500; color: var(--label); letter-spacing: 0.005em; }

  /* The disk image window. Finder draws the icons and their labels on top; the
     window is 420 tall including its ~28pt title bar, so the bottom of this
     image is cut off and nothing sits there */
  #dmg { width: 660px; height: 420px; background: radial-gradient(circle, var(--dot) 0.9px, transparent 1.3px) 0 0 / 20px 20px, var(--canvas); }
  #dmg .frame { left: 112px; top: 132px; width: 116px; height: 116px; }
  #dmg svg.flow { position: absolute; inset: 0; width: 660px; height: 420px; overflow: visible; }
  #dmg .you { position: absolute; left: 340px; top: 212px; display: flex; align-items: flex-start; }
  #dmg .you svg { width: 18px; height: 18px; color: var(--you); filter: drop-shadow(0 1px 1.5px rgb(0 0 0 / 0.3)); }
  #dmg .you span { margin: 14px 0 0 -2px; padding: 2px 6px 3px; border-radius: 4px; background: var(--you); color: #fff; font-size: 11px; font-weight: 600; line-height: 1.2; }

  /* The Windows header image: 150x57 at 1x, drawn at 2x so it stays sharp when
     the installer scales up. It sits on the header's own white, so no grid */
  #header { width: 150px; height: 57px; background: #fff; }
  #header .frame { right: 30px; top: 9px; width: 29px; height: 39px; overflow: visible; }
  #header .frame::before { border-width: 1.5px; }
  #header .frame i { width: 6px; height: 6px; border-width: 1.5px; }
  /* logo.png's mark spans x 219-605 and y 122-700 of 824; this crops it to 31px tall with 4px inside the frame */
  #header .mark { position: absolute; left: 4px; top: 4px; width: 20.7px; height: 31px; overflow: hidden; }
  #header .mark img { position: absolute; left: -11.74px; top: -6.54px; width: 44.19px; height: 44.19px; }
  #header .you { position: absolute; right: 16px; bottom: 2px; width: 14px; height: 14px; color: var(--you); filter: drop-shadow(0 1px 1px rgb(0 0 0 / 0.3)); }
</style>
<script>document.documentElement.dataset.art = location.hash.slice(1) || "dmg"</script>
</head>
<body>
  <div class="art" id="dmg">
    <!-- Ligma.app is centered at (170, 190) and Applications at (490, 190) -->
    <div class="frame"><span class="name">Drag to Applications</span><i></i><i></i><i></i><i></i></div>
    <!-- A prototype connection, as Figma draws one: a node on the frame's edge, then a curve to the destination -->
    <svg class="flow" viewBox="0 0 660 420" aria-hidden="true">
      <path d="M232 190 C 276 190, 290 216, 328 216 C 366 216, 380 190, 418 190" fill="none" stroke="var(--flow)" stroke-width="2" stroke-linecap="round"/>
      <path d="M428 190 L417 184.5 L417 195.5 Z" fill="var(--flow)" stroke="var(--flow)" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="228" cy="190" r="4.5" fill="var(--flow)" stroke="#fff" stroke-width="1.5"/>
    </svg>
    <div class="you"><svg viewBox="0 0 16 16"><path d="M3.4 2.2c-.7-.3-1.4.4-1.1 1.1l4.3 10.3c.3.7 1.3.7 1.6-.1l1.3-3.7c.1-.3.3-.5.6-.6l3.7-1.3c.8-.3.8-1.3.1-1.6z" fill="currentColor" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg><span>You</span></div>
  </div>

  <div class="art" id="header">
    <div class="frame"><span class="mark"><img src="../logo.png" alt=""></span><i></i><i></i><i></i><i></i></div>
    <svg class="you" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 2.2c-.7-.3-1.4.4-1.1 1.1l4.3 10.3c.3.7 1.3.7 1.6-.1l1.3-3.7c.1-.3.3-.5.6-.6l3.7-1.3c.8-.3.8-1.3.1-1.6z" fill="currentColor" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>
  </div>
</body>
</html>
