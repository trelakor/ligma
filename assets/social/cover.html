<!doctype html>
<!-- The social cover (site/social-cover.png): the site's hero as a poster, in its light Figma theme. Render it with `npm run social-cover` -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ligma social cover</title>
<style>
  @font-face { font-family: "Funnel Display"; src: url(../../site/fonts/funnel-display.woff2) format("woff2"); font-weight: 300 800; }
  @font-face { font-family: "Inter"; src: url(../../site/fonts/inter.woff2) format("woff2"); font-weight: 400 700; }

  /* The site's light Figma theme (site/index.html, dist/themes.js) */
  :root {
    --bg: #ffffff; --ink: #1e1e1e; --ink-2: #444444;
    --weight: #f5f5f5; --weight-rule: #e6e6e6; --weight-ink: #757575;
    --field: #0d99ff;
    --display: "Funnel Display", sans-serif;
    --text: "Inter", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: var(--bg); }
  body {
    display: flex; flex-direction: column; padding: 56px 64px 64px;
    color: var(--ink); font-family: var(--text); -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv11", "calt";
  }

  header { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; font: 650 32px/1 var(--display); letter-spacing: -0.02em; }
  .brand img { width: 56px; height: 56px; margin: -6px -4px -6px -8px; }
  .os { font-size: 22px; font-weight: 500; color: var(--ink-2); }

  h1 { margin: 40px 0 0; font: 700 92px/0.92 var(--display); letter-spacing: -0.04em; white-space: nowrap; }

  /* 16 MB of 305 MB, by area: each side at sqrt(16 / 305) */
  .weight {
    position: relative; flex: 1; margin-top: 40px; border-radius: 24px; overflow: hidden;
    background:
      linear-gradient(to right, var(--weight-rule) 1.5px, transparent 1.5px) 0 0 / 10% 100%,
      linear-gradient(to bottom, var(--weight-rule) 1.5px, transparent 1.5px) 0 0 / 100% 10%,
      var(--weight);
  }
  .them { position: absolute; top: 28px; left: 32px; right: 32px; display: flex; justify-content: space-between; align-items: flex-start; }
  .them span { font-size: 22px; font-weight: 600; color: var(--ink-2); }
  .them b { font: 700 136px/0.8 var(--display); letter-spacing: -0.05em; color: var(--weight-ink); font-variant-numeric: tabular-nums; }
  .us { position: absolute; left: 0; bottom: 0; width: 22.9%; height: 22.9%; background: var(--field); border-top-right-radius: 14px; }
  .us-label { position: absolute; left: calc(22.9% + 20px); bottom: 14px; display: flex; align-items: baseline; gap: 14px; }
  .us-label b { font: 700 60px/1 var(--display); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .us-label span { font-size: 22px; font-weight: 600; color: var(--ink-2); }
</style>
</head>
<body>
  <header>
    <div class="brand"><img src="../logo.png" alt="">Ligma</div>
    <div class="os">Free for macOS and Windows</div>
  </header>
  <h1>Figma, without the weight.</h1>
  <div class="weight" role="img" aria-label="Installed size on macOS, drawn to scale by area: Figma desktop 305 MB, Ligma 16 MB">
    <div class="them"><span>Figma desktop, installed on macOS</span><b>305 MB</b></div>
    <div class="us"></div>
    <div class="us-label"><b>16 MB</b><span>Ligma</span></div>
  </div>
</body>
</html>
