<!doctype html>
<!-- The social cover (site/social-cover.png): the logo selected on a dark Figma canvas. Render it with `npm run social-cover` -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ligma social cover</title>
<style>
  @font-face { font-family: "Funnel Display"; src: url(../../site/fonts/funnel-display.woff2) format("woff2"); font-weight: 300 800; }

  :root {
    --canvas: #1e1e1e; --dot: #4a4a4a; --ink: #ffffff; --select: #0d99ff;
    --display: "Funnel Display", "Inter", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: var(--canvas); }
  body { position: relative; color: var(--ink); -webkit-font-smoothing: antialiased; }

  /* Figma's canvas dot grid, fading out from the middle */
  .grid {
    position: absolute; inset: 0;
    background: radial-gradient(circle, var(--dot) 1.2px, transparent 1.6px) 4px 4px / 24px 24px;
    mask: radial-gradient(ellipse 70% 80% at 50% 50%, #000 20%, transparent 75%);
  }

  /* The logo's own colors, bloomed behind it */
  .bloom { position: absolute; left: 50%; top: 50%; width: 1100px; height: 760px; transform: translate(-50%, -50%); filter: blur(100px) saturate(1.6); opacity: 0.6; }
  .bloom i { position: absolute; border-radius: 50%; }

  .lockup {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 44px; padding: 40px 64px 40px 52px;
  }
  .lockup svg { display: block; width: 196px; height: auto; filter: drop-shadow(0 18px 40px rgb(0 0 0 / 0.45)); }
  .lockup b { font: 700 216px/1 var(--display); letter-spacing: -0.045em; margin-top: -18px; }

  /* A Figma selection around the lockup */
  .selection { position: absolute; inset: 0; border: 2px solid var(--select); }
  .selection i { position: absolute; width: 14px; height: 14px; background: #fff; border: 2px solid var(--select); border-radius: 2px; }
  .selection i:nth-child(1) { left: -8px; top: -8px; }
  .selection i:nth-child(2) { right: -8px; top: -8px; }
  .selection i:nth-child(3) { left: -8px; bottom: -8px; }
  .selection i:nth-child(4) { right: -8px; bottom: -8px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="bloom" aria-hidden="true">
    <i style="left:22%;top:-4%;width:320px;height:280px;background:#00cc66"></i>
    <i style="left:0%;top:44%;width:320px;height:300px;background:#ff0033"></i>
    <i style="left:32%;top:58%;width:380px;height:320px;background:#9050ff"></i>
    <i style="left:56%;top:22%;width:420px;height:380px;background:#00b8ff"></i>
  </div>

  <div class="lockup">
    <div class="selection"><i></i><i></i><i></i><i></i></div>
    <!-- assets/logo.png, redrawn in its own 193-unit grid -->
    <svg viewBox="0 0 386 579" aria-label="Ligma logo">
      <path fill="#00cc66" d="M96.5 0A96.5 96.5 0 0 1 193 96.5V193H96.5A96.5 96.5 0 0 1 96.5 0z"/>
      <path fill="#ff0033" d="M96.5 193H193V386H96.5A96.5 96.5 0 0 1 96.5 193z"/>
      <path fill="#9050ff" d="M96.5 386H193V579H96.5A96.5 96.5 0 0 1 96.5 386z"/>
      <circle fill="#00b8ff" cx="289.5" cy="482.5" r="96.5"/>
    </svg>
    <b>Ligma</b>
  </div>
</body>
</html>
