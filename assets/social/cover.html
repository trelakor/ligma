<!doctype html>
<!-- The social cover (site/social-cover.png): the lockup as a selected layer on a white Figma canvas. Render it with `npm run graphics` -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ligma social cover</title>
<style>
  @font-face { font-family: "Funnel Display"; src: url(../../site/fonts/funnel-display.woff2) format("woff2"); font-weight: 300 800; }
  @font-face { font-family: "Inter"; src: url(../../site/fonts/inter.woff2) format("woff2"); font-weight: 400 700; }

  /* Figma's light UI: grey ramp, selection blue #0d99ff */
  :root { --ink: #1e1e1e; --ink-2: #757575; --dot: #dedede; --select: #0d99ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #fff; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--ink); font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased;
    background: radial-gradient(circle, var(--dot) 1.3px, transparent 1.8px) 4px 4px / 24px 24px, #fff;
  }

  /* The lockup, selected: Figma's frame label, outline and corner handles */
  .layer { position: relative; display: flex; align-items: center; gap: 20px; padding: 18px 48px 26px 30px; background: #fff; }
  .layer::before { content: ""; position: absolute; inset: 0; border: 2px solid var(--select); }
  .layer .label { position: absolute; left: 0; bottom: calc(100% + 10px); font-size: 17px; font-weight: 500; color: #0768cf; }
  .layer i { position: absolute; width: 14px; height: 14px; background: #fff; border: 2px solid var(--select); border-radius: 2px; }
  .layer i:nth-of-type(1) { left: -6px; top: -6px; } .layer i:nth-of-type(2) { right: -6px; top: -6px; }
  .layer i:nth-of-type(3) { left: -6px; bottom: -6px; } .layer i:nth-of-type(4) { right: -6px; bottom: -6px; }
  .layer img { width: 168px; height: 168px; margin: -14px -26px -14px -18px; }
  .layer b { font: 700 156px/1 "Funnel Display", sans-serif; letter-spacing: -0.045em; padding-bottom: 14px; }

  h1 { margin: 56px 0 0; font: 600 46px/1 "Funnel Display", sans-serif; letter-spacing: -0.025em; }
  .os { display: flex; align-items: center; gap: 12px; margin-top: 24px; font-size: 21px; font-weight: 500; color: var(--ink-2); }
  .os svg { width: 22px; height: 22px; fill: currentColor; }
  .os em { width: 4px; height: 4px; margin: 0 6px; border-radius: 50%; background: currentColor; }
</style>
</head>
<body>
  <div class="layer">
    <span class="label">Ligma</span>
    <img src="../logo.png" alt="">
    <b>Ligma</b>
    <i></i><i></i><i></i><i></i>
  </div>
  <h1>Same Figma. Lighter.</h1>
  <div class="os">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
    macOS
    <em></em>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 2h9.5v9.5H2zM12.5 2H22v9.5h-9.5zM2 12.5h9.5V22H2zM12.5 12.5H22V22h-9.5z"/></svg>
    Windows
  </div>
</body>
</html>
